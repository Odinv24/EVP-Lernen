<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA 1 v7 – Fragentrainer</title>
<style>
:root{
  --bg:#eef2f5; --panel:#ffffff; --ink:#14232e; --muted:#5b6c78; --line:#d3dde4;
  --accent:#0a6f94; --accent-ink:#ffffff; --ok:#1f8a4c; --ok-bg:#e3f4ea; --bad:#c23b2a; --bad-bg:#fbe7e4;
  --flag:#d99a12; --code:#0f1e28; --code-ink:#d6e6ef;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e171d; --panel:#16232c; --ink:#e3edf3; --muted:#92a5b2; --line:#294050;
    --accent:#4cb8dc; --accent-ink:#06222d; --ok:#4cc27d; --ok-bg:#12341f; --bad:#ef7766; --bad-bg:#3a1b17;
    --flag:#f0b73c; --code:#0a1217; --code-ink:#c9dde8;
  }
}
:root[data-theme="dark"]{
  --bg:#0e171d; --panel:#16232c; --ink:#e3edf3; --muted:#92a5b2; --line:#294050;
  --accent:#4cb8dc; --accent-ink:#06222d; --ok:#4cc27d; --ok-bg:#12341f; --bad:#ef7766; --bad-bg:#3a1b17;
  --flag:#f0b73c; --code:#0a1217; --code-ink:#c9dde8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 18px;overflow:auto}
main{padding:20px 24px 60px;max-width:980px;width:100%}
h1{font-size:1.2rem;margin:0 0 2px;letter-spacing:.2px}
.sub{color:var(--muted);font-size:.88rem;margin:0 0 16px}
fieldset{border:0;padding:0;margin:0 0 16px}
legend{font-weight:650;font-size:.92rem;padding:0;margin-bottom:6px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:.92rem;padding:2px 0}
.chk input{margin-top:5px}
.chk small{color:var(--muted)}
select,input[type=search]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{font-size:.88rem;color:var(--muted);margin:4px 0 12px}
.stat b{color:var(--ink)}
.tabs{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content;max-width:100%}
.tabs button{border:0;background:var(--panel);padding:9px 18px;font-weight:600}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
/* Port-Leiste */
.ports{display:flex;flex-wrap:wrap;gap:3px;margin:0 0 16px;padding:10px;background:var(--code);border-radius:8px;max-height:132px;overflow:auto}
.ports button{width:14px;height:14px;border-radius:3px;border:1px solid #3d5666;background:#243744;padding:0}
.ports button.ok{background:var(--ok);border-color:var(--ok)}
.ports button.bad{background:var(--bad);border-color:var(--bad)}
.ports button.ans{background:var(--accent);border-color:var(--accent)}
.ports button.flag{box-shadow:0 0 0 2px var(--flag)}
.ports button.cur{outline:2px solid #fff;outline-offset:1px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px 24px}
.meta{display:flex;gap:8px 14px;flex-wrap:wrap;color:var(--muted);font-size:.84rem;margin-bottom:10px}
.tag{border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.qtext{font-size:1.1rem;font-weight:600;margin:0 0 14px;white-space:pre-wrap;line-height:1.5}
.qtext .code,.code{display:block;font:.86rem/1.45 ui-monospace,Consolas,Menlo,monospace;background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:6px;margin:8px 0;white-space:pre-wrap;overflow-x:auto;font-weight:400}
.imgs{display:flex;flex-direction:column;gap:10px;margin:0 0 14px}
.imgs img{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;align-self:flex-start}
.imgfail{border:1px dashed var(--line);border-radius:6px;padding:10px;font-size:.88rem;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .box{flex:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:800;margin-top:1px}
.multi .opt .box{border-radius:5px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--panel))}
.opt.sel .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.right .box{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .box{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.missed{border-style:dashed}
.opt span.t{white-space:pre-wrap}
.opt .oimg{display:block;max-width:100%;margin-top:6px;border:1px solid var(--line);border-radius:4px;background:#fff}
.match{width:100%;border-collapse:collapse}
.match td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.match td:first-child{width:55%}
.match select{border-width:1.5px}
.match .good select{border-color:var(--ok);background:var(--ok-bg)}
.match .bad select{border-color:var(--bad);background:var(--bad-bg)}
.match .fix{font-size:.86rem;color:var(--ok);font-weight:600;margin-top:3px}
.verdict{margin:16px 0 0;padding:12px 14px;border-radius:8px;font-weight:650}
.verdict.ok{background:var(--ok-bg);color:var(--ok)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.exp{margin-top:12px;padding:12px 14px;border-left:4px solid var(--accent);background:var(--bg);border-radius:0 6px 6px 0;white-space:pre-wrap}
.exp b{display:block;font-size:.84rem;color:var(--muted);margin-bottom:4px}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.nav .sp{flex:1}
.flagbtn[aria-pressed="true"]{border-color:var(--flag);color:var(--flag)}
.empty{padding:40px 10px;text-align:center;color:var(--muted)}
.result{text-align:center;padding:10px 0}
.result .big{font-size:3rem;font-weight:800;line-height:1.1}
.mobile-toggle{display:none}
@media (max-width:880px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line);padding:14px}
  aside .filters{display:none}
  aside.open .filters{display:block}
  .mobile-toggle{display:inline-block;margin-top:6px}
  main{padding:14px 12px 50px}
  .card{padding:16px}
}
@media (prefers-reduced-motion:no-preference){.opt{transition:border-color .12s,background .12s}}

.tabs{overflow-x:auto}
.tabs button{white-space:nowrap}
.muted{color:var(--muted);font-size:.88rem}
.alist{margin:6px 0 0;padding-left:20px}.alist li{margin:4px 0}.alist.plain{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}.kpi b{display:block;font-size:1.7rem;line-height:1.2}.kpi span{color:var(--muted);font-size:.84rem}
.stat-table,.ref{width:100%;border-collapse:collapse;font-size:.92rem}
.stat-table th,.stat-table td,.ref th,.ref td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.ref thead th,.stat-table thead th{background:var(--bg);font-weight:650;position:sticky;top:0}
.ref td:first-child{font-weight:600}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-bottom:3px;min-width:80px}
.bar i{display:block;height:100%;background:var(--accent)}.bar.good i{background:var(--ok)}.bar.low i{background:var(--bad)}
.stat-table .row{flex-wrap:nowrap}.stat-table .btn{padding:5px 10px;font-size:.85rem}
.tw{overflow-x:auto}
.sec h2{font-size:1.15rem;margin:26px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0 0 12px}
.blk p{margin:6px 0}.blk code{font:.88em ui-monospace,Consolas,Menlo,monospace;background:var(--bg);padding:1px 5px;border-radius:4px}
.blk .code{margin:4px 0}
.tips li{margin:6px 0}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.toc a{color:var(--ink);text-decoration:none}.toc a:hover{border-color:var(--accent)}
.sheetbar{margin-bottom:12px;padding:14px}
.card input:not([type=checkbox]){padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%}
.row input:not([type=checkbox]){width:auto}
.code u{text-decoration:none;color:var(--accent);font-weight:700}
h3{font-size:1rem;margin:18px 0 8px}
@media print{aside,.tabs,.sheetbar,.nav{display:none!important}.app{display:block}body{background:#fff;color:#000}.blk,.card{border-color:#999;break-inside:avoid}main{max-width:none;padding:0}}

.dd{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:18px;align-items:start}
.dd-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch;margin-bottom:8px}
.dd-label{padding:9px 12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;font-size:.95rem;white-space:pre-wrap;overflow-wrap:anywhere}
.dd-zone{min-height:46px;border:2px dashed var(--line);border-radius:8px;padding:5px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.dd-zone .ph{color:var(--muted);font-size:.84rem;text-align:center}
.dd-zone.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--panel))}
.dd-zone.good{border:2px solid var(--ok);background:var(--ok-bg)}
.dd-zone.bad{border:2px solid var(--bad);background:var(--bad-bg)}
.dd-zone .fix{font-size:.84rem;color:var(--ok);font-weight:600;padding:0 4px}
.dd-pool{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-height:60px;position:sticky;top:10px}
.chip{display:block;width:100%;text-align:left;padding:8px 12px;border:1.5px solid var(--accent);background:var(--panel);border-radius:8px;cursor:grab;font-size:.93rem;overflow-wrap:anywhere}
.chip.pick{background:var(--accent);color:var(--accent-ink)}
.chip.drag{opacity:.45}
.chip[disabled]{cursor:default;opacity:.9}
details.exp summary{cursor:pointer;font-weight:650}
@media (max-width:760px){.dd{grid-template-columns:1fr}.dd-pool{position:static;order:-1}.dd-row{grid-template-columns:1fr}}

.topbar{display:flex;justify-content:flex-end;align-items:center;gap:18px;margin:0 0 14px;flex-wrap:wrap}
.cisco{height:46px;width:auto;flex:none}
.countdown{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;text-align:right}
.cd-label{font-size:.8rem;color:var(--muted)}
.cd-time{font-size:1.35rem;font-weight:750;font-variant-numeric:tabular-nums}
.countdown.soon .cd-time{color:var(--bad)}
.countdown.done .cd-time{color:var(--ok)}
@media (max-width:520px){.topbar{justify-content:space-between}.countdown{align-items:flex-start;text-align:left}.cd-time{font-size:1.1rem}}
@media print{.topbar{display:none}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <h1>CCNA 1 v7 · Fragentrainer</h1>
  <p class="sub" id="totals"></p>
  <button class="btn ghost mobile-toggle" id="mt" aria-expanded="false">Filter & Einstellungen</button>
  <div class="filters">
    <fieldset><legend>Prüfungssätze</legend><div id="srcs"></div></fieldset>
    <fieldset><legend>Modul</legend><select id="fmod"></select></fieldset>
    <fieldset><legend>Fragetyp</legend><select id="ftype">
      <option value="all">Alle Typen</option>
      <option value="single">Eine richtige Antwort</option>
      <option value="multiple">Mehrere richtige Antworten</option>
      <option value="other">Zuordnung (Drag &amp; Drop), Bild, Kurzantwort</option></select></fieldset>
    <fieldset><legend>Status</legend><select id="fstat">
      <option value="all">Alle</option>
      <option value="new">Noch nicht beantwortet</option>
      <option value="bad">Zuletzt falsch</option>
      <option value="ok">Zuletzt richtig</option>
      <option value="flag">Markiert</option></select></fieldset>
    <fieldset><legend>Suche</legend><input type="search" id="fq" placeholder="Stichwort in Frage oder Antwort"></fieldset>
    <fieldset><legend>Reihenfolge</legend>
      <label class="chk"><input type="checkbox" id="fshuf"> Zufällig mischen</label></fieldset>
    <div class="stat" id="pstat"></div>
    <div class="row">
      <button class="btn" id="reset">Fortschritt löschen</button>
      <button class="btn ghost" id="theme">Hell / Dunkel</button>
    </div>
  </div>
</aside>
<main>
  <div class="topbar">
    <div class="countdown" id="cd" role="timer" aria-live="off"><span class="cd-label">Test: Mi, 14.10.2026, 08:00 Uhr (Berlin)</span><span class="cd-time" id="cdt"></span></div>
    <svg class="cisco" viewBox="0 0 120 58" role="img" aria-label="Cisco (nachempfundenes Logo)"><g fill="#049fd9"><rect x="6" y="24" width="7" height="12" rx="3.5"/><rect x="19" y="16" width="7" height="20" rx="3.5"/><rect x="32" y="8" width="7" height="28" rx="3.5"/><rect x="45" y="16" width="7" height="20" rx="3.5"/><rect x="58" y="2" width="7" height="34" rx="3.5"/><rect x="71" y="16" width="7" height="20" rx="3.5"/><rect x="84" y="8" width="7" height="28" rx="3.5"/><rect x="97" y="16" width="7" height="20" rx="3.5"/><rect x="110" y="24" width="7" height="12" rx="3.5"/></g><text x="60" y="55" text-anchor="middle" font-family="Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="1" fill="#049fd9">cisco</text></svg>
  </div>
  <div class="tabs" role="group" aria-label="Bereich">
    <button data-m="learn" aria-pressed="true">Üben</button>
    <button data-m="exam" aria-pressed="false">Prüfung</button>
    <button data-m="cards" aria-pressed="false">Karteikarten</button>
    <button data-m="stats" aria-pressed="false">Fortschritt</button>
    <button data-m="sheet" aria-pressed="false">Cheat Sheet</button>
    <button data-m="calc" aria-pressed="false">Rechner &amp; Übungen</button>
  </div>
  <div id="examBar" class="row" style="display:none;margin-bottom:14px"></div>
  <div class="ports" id="ports" aria-label="Fragenübersicht"></div>
  <div id="view"></div>
</main>
</div>
<script>
const DATA=[{"type":"single","q":"Why would a Layer 2 switch need an IP address?","imgs":[],"exp":"A switch, as a Layer 2 device, does not need an IP address to transmit frames to attached devices. However, when a switch is accessed remotely through the network, it must have a Layer 3 address. The IP address must be applied to a virtual interface rather than to a physical interface. Routers, not switches, function as default gateways.","topic":"2.6.2","opts":[{"t":"to enable the switch to send broadcast frames to attached PCs","imgs":[]},{"t":"to enable the switch to function as a default gateway","imgs":[]},{"t":"to enable the switch to be managed remotely","imgs":[]},{"t":"to enable the switch to receive frames from attached PCs","imgs":[]}],"ans":[2],"sources":["Module 1-3","Final Exam (161)"],"module":2,"id":1},{"type":"single","q":"Refer to the exhibit. An administrator is trying to configure the switch but receives the error message that is displayed in the exhibit. What is the problem?","imgs":["https://itexamanswers.net/wp-content/uploads/2020/01/i208399v1n1_Question-1.png"],"exp":"In order to enter global configuration mode, the command configure terminal, or a shortened version such as config t, must be entered from privileged EXEC mode. In this scenario the administrator is in user EXEC mode, as indicated by the > symbol after the hostname. The administrator would need to use the enable command to move into privileged EXEC mode before entering the configure terminal command.","topic":"2.2.1","opts":[{"t":"The entire command, configure terminal, must be used.","imgs":[]},{"t":"The administrator is already in global configuration mode.","imgs":[]},{"t":"The administrator must first enter privileged EXEC mode before issuing the command.","imgs":[]},{"t":"The administrator must connect via the console port to access global configuration mode.","imgs":[]}],"ans":[2],"sources":["Module 1-3","Practice Final (58)","Final Exam (161)"],"module":2,"id":2},{"q":"During a routine inspection, a technician discovered that software that was installed on a computer was secretly collecting data about websites that were visited by users of the computer. Which type of threat is affecting this computer?","imgs":[],"exp":"Spyware is software that is installed on a network device and that collects information.","topic":"1.8.1","opts":[{"t":"DoS attack","imgs":[]},{"t":"identity theft","imgs":[]},{"t":"spyware","imgs":[]},{"t":"zero-day attack","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":3},{"q":"Which term refers to a network that provides secure access to the corporate offices by suppliers, customers and collaborators?","imgs":[],"exp":"The term Internet refers to the worldwide collection of connected networks. Intranet refers to a private connection of LANs and WANS that belong to an organization and is designed to be accessible to the members of the organization, employees, or others with authorization. Extranets provide secure and safe access to suppliers, customers, and collaborators. Extendednet is not a type of network.","topic":"1.4.4","opts":[{"t":"Internet","imgs":[]},{"t":"intranet","imgs":[]},{"t":"extranet","imgs":[]},{"t":"extendednet","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":4},{"q":"A large corporation has modified its network to allow users to access network resources from their personal laptops and smart phones. Which networking trend does this describe?","imgs":[],"exp":"BYOD allows end users to use personal tools to access the corporate network. Allowing this trend can have major impacts on a network, such as security and compatibility with corporate software and devices.","topic":"1.7.2","opts":[{"t":"cloud computing","imgs":[]},{"t":"online collaboration","imgs":[]},{"t":"bring your own device","imgs":[]},{"t":"video conferencing","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":5},{"q":"What is an ISP?","imgs":[],"exp":"An ISP, or Internet Service Provider, is an organization that provides access to the Internet for businesses and individuals.","topic":"1.5.1","opts":[{"t":"It is a standards body that develops cabling and wiring standards for networking.","imgs":[]},{"t":"It is a protocol that establishes how computers within a local network communicate.","imgs":[]},{"t":"It is an organization that enables individuals and businesses to connect to the Internet.","imgs":[]},{"t":"It is a networking device that combines the functionality of several different networking devices in one.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":6},{"q":"Match the requirements of a reliable network with the supporting network architecture. (Not all options are used.)","imgs":[],"exp":"","topic":"1.6.5","type":"matrix_sort_answer","rows":["fault tolerance","scalability","security"],"items":["Provide redundant links and devices.","Expand the network without degrading the service for existing users.","Protect the network from unauthorized access."],"ans":[0,1,2],"aimgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2020-03-08_181549.jpg"],"sources":["Module 1-3"],"module":1,"id":7},{"q":"An employee at a branch office is creating a quote for a customer. In order to do this, the employee needs to access confidential pricing information from internal servers at the Head Office. What type of network would the employee access?","imgs":[],"exp":"Intranet is a term used to refer to a private connection of LANs and WANs that belongs to an organization. An intranet is designed to be accessible only by the organization's members, employees, or others with authorization.","topic":"1.4.4","opts":[{"t":"an intranet","imgs":[]},{"t":"the Internet","imgs":[]},{"t":"an extranet","imgs":[]},{"t":"a local area network","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":8},{"q":"Which statement describes the use of powerline networking technology?","imgs":[],"exp":"Powerline networking adds the ability to connect a device to the network using an adapter wherever there is an electrical outlet. The network uses existing electrical wiring to send data. It is not a replacement for physical cabling, but it can add functionality in places where wireless access points cannot be used or cannot reach devices.","topic":"1.7.8","opts":[{"t":"New “smart” electrical cabling is used to extend an existing home LAN.","imgs":[]},{"t":"A home LAN is installed without the use of physical cabling.","imgs":[]},{"t":"A device connects to an existing home LAN using an adapter and an existing electrical outlet.","imgs":[]},{"t":"Wireless access points use powerline adapters to distribute data through the home LAN.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":9},{"q":"A networking technician is working on the wireless network at a medical clinic. The technician accidentally sets up the wireless network so that patients can see the medical records data of other patients. Which of the four network characteristics has been violated in this situation?","imgs":[],"exp":"Network security includes protecting the confidentiality of data that is on the network. In this case, because confidential data has been made available to unauthorized users, the security characteristic of the network has failed.","topic":"1.1.8","opts":[{"t":"fault tolerance","imgs":[]},{"t":"scalability","imgs":[]},{"t":"security","imgs":[]},{"t":"Quality of Service (QoS)","imgs":[]},{"t":"reliability","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":10},{"q":"Match each characteristic to its corresponding Internet connectivity type. (Not all options are used.)","imgs":[],"exp":"DSL is an always-on, high bandwidth connection that runs over telephone lines. Cable uses the same coaxial cable that carries television signals into the home to provide Internet access. Dialup telephone is much slower than either DSL or cable, but is the least expensive option for home users because it can use any telephone line and a simple modem. Satellite requires a clear line of sight and is affected by trees and other obstructions. None of these typical home options use dedicated leased lines such as T1/E1 and T3/E3.","topic":"1.5.2","type":"matrix_sort_answer","rows":["uses coaxial cable as a medium","not suited for heavily wooded areas","typically has very low bandwidth","high bandwidth connection that runs over telephone line"],"items":["cable","satellite","dialup telephone","DSL"],"ans":[0,1,2,3],"aimgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2024-11-19_094041.jpg"],"sources":["Module 1-3"],"module":1,"id":11},{"q":"What two criteria are used to help select a network medium from various network media? (Choose two.)","imgs":[],"exp":"Criteria for choosing a network medium are the distance the selected medium can successfully carry a signal, the environment in which the selected medium is to be installed, the amount of data and the speed at which the data must be transmitted, and the cost of the medium and its installation.","topic":"2.6.2","opts":[{"t":"the types of data that need to be prioritized","imgs":[]},{"t":"the cost of the end devices utilized in the network","imgs":[]},{"t":"the distance the selected medium can successfully carry a signal","imgs":[]},{"t":"the number of intermediate devices installed in the network","imgs":[]},{"t":"the environment where the selected medium is to be installed","imgs":[]}],"ans":[2,4],"type":"multiple","sources":["Module 1-3"],"module":2,"id":12},{"q":"What type of network traffic requires QoS?","imgs":[],"exp":"Video conferencing utilizes real-time audio and video communications. Both of these are time-sensitive and bandwidth-intensive forms of communication that require quality of service to be active on the network. QoS will ensure an uninterrupted user experience.","topic":"1.6.4","opts":[{"t":"email","imgs":[]},{"t":"on-line purchasing","imgs":[]},{"t":"video conferencing","imgs":[]},{"t":"wiki","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":13},{"q":"A user is implementing security on a small office network. Which two actions would provide the minimum security requirements for this network? (Choose two.)","imgs":[],"exp":"Technically complex security measures such as intrusion prevention and intrusion prevention systems are usually associated with business networks rather than home networks. Installing antivirus software, antimalware software, and implementing a firewall will usually be the minimum requirements for home networks. Installing a home wireless network will not improve network security, and will require further security actions to be taken.","topic":"1.8.2","opts":[{"t":"implementing a firewall","imgs":[]},{"t":"installing a wireless network","imgs":[]},{"t":"installing antivirus software","imgs":[]},{"t":"implementing an intrusion detection system","imgs":[]},{"t":"adding a dedicated intrusion prevention device","imgs":[]}],"ans":[0,2],"type":"multiple","sources":["Module 1-3"],"module":1,"id":14},{"q":"Passwords can be used to restrict access to all or parts of the Cisco IOS. Select the modes and interfaces that can be protected with passwords. (Choose three.)","imgs":[],"exp":"Access to the VTY and console interfaces can be restricted using passwords. Out-of-band management of the router can be restricted in both user EXEC and privileged EXEC modes.","topic":"2.4.3","opts":[{"t":"VTY interface","imgs":[]},{"t":"console interface","imgs":[]},{"t":"Ethernet interface","imgs":[]},{"t":"boot IOS mode","imgs":[]},{"t":"privileged EXEC mode","imgs":[]},{"t":"router configuration mode","imgs":[]}],"ans":[0,1,4],"type":"multiple","sources":["Module 1-3"],"module":2,"id":15},{"q":"Which interface allows remote management of a Layer 2 switch?","imgs":[],"exp":"In a Layer 2 switch, there is a switch virtual interface (SVI) that provides a means for remotely managing the device.","topic":"2.6.2","opts":[{"t":"the AUX interface","imgs":[]},{"t":"the console port interface","imgs":[]},{"t":"the switch virtual interface","imgs":[]},{"t":"the first Ethernet port interface","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":2,"id":16},{"q":"What function does pressing the Tab key have when entering a command in IOS?","imgs":[],"exp":"Pressing the Tab key after a command has been partially typed will cause the IOS to complete the rest of the command.","topic":"2.3.5","opts":[{"t":"It aborts the current command and returns to configuration mode.","imgs":[]},{"t":"It exits configuration mode and returns to user EXEC mode.","imgs":[]},{"t":"It moves the cursor to the beginning of the next line.","imgs":[]},{"t":"It completes the remainder of a partially typed word in a command.","imgs":[]}],"ans":[3],"type":"single","sources":["Module 1-3"],"module":2,"id":17},{"q":"While trying to solve a network issue, a technician made multiple changes to the current router configuration file. The changes did not solve the problem and were not saved. What action can the technician take to discard the changes and work with the file in NVRAM?","imgs":[],"exp":"The technician does not want to make any mistakes trying to remove all the changes that were done to the running configuration file. The solution is to reboot the router without saving the running configuration. The copy startup-config running-config command does not overwrite the running configuration file with the configuration file stored in NVRAM, but rather it just has an additive effect.","topic":"2.5.2","opts":[{"t":"Issue the reload command without saving the running configuration.","imgs":[]},{"t":"Delete the vlan.dat file and reboot the device.","imgs":[]},{"t":"Close and reopen the terminal emulation software.","imgs":[]},{"t":"Issue the copy startup-config running-config command.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":2,"id":18},{"q":"An administrator uses the Ctrl-Shift-6 key combination on a switch after issuing the ping command. What is the purpose of using these keystrokes?","imgs":[],"exp":"To interrupt an IOS process such as ping or traceroute, a user enters the Ctrl-Shift-6 key combination. Tab completes the remainder of parameters or arguments within a command. To exit from configuration mode to privileged mode use the Ctrl-Z keystroke. CTRL-R will redisplay the line just typed, thus making it easier for the user to press Enter and reissue the ping command.","topic":"2.3.5","opts":[{"t":"to restart the ping process","imgs":[]},{"t":"to interrupt the ping process","imgs":[]},{"t":"to exit to a different configuration mode","imgs":[]},{"t":"to allow the user to complete the command","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":2,"id":19},{"q":"Refer to the exhibit. A network administrator is configuring access control to switch SW1. If the administrator uses a console connection to connect to the switch, which password is needed to access user EXEC mode?","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/CCNA-1-v7-Modules-1-3-Basic-Network-Connectivity-and-Communications-Exam-Answers-14.jpg"],"exp":"Telnet accesses a network device through the virtual interface configured with the line VTY command. The password configured under this is required to access the user EXEC mode. The password configured under the line console 0 command is required to gain entry through the console port, and the enable and enable secret passwords are used to allow entry into the privileged EXEC mode.","topic":"2.4.3","opts":[{"t":"letmein","imgs":[]},{"t":"secretin","imgs":[]},{"t":"lineconin","imgs":[]},{"t":"linevtyin","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":2,"id":20},{"q":"A technician configures a switch with these commands:","imgs":[],"exp":"For a switch to have an IP address, a switch virtual interface must be configured. This allows the switch to be managed remotely over the network.","topic":"2.7.4","opts":[{"t":"Telnet access","imgs":[]},{"t":"SVI","imgs":[]},{"t":"password encryption","imgs":[]},{"t":"physical switchport access","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":2,"id":21},{"q":"Which command or key combination allows a user to return to the previous level in the command hierarchy?","imgs":[],"exp":"End and CTRL-Z return the user to the privileged EXEC mode. Ctrl-C ends a command in process. The exit command returns the user to the previous level.","topic":"2.2.4","opts":[{"t":"end","imgs":[]},{"t":"exit","imgs":[]},{"t":"Ctrl-Z","imgs":[]},{"t":"Ctrl-C","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":2,"id":22},{"q":"What are two characteristics of RAM on a Cisco device? (Choose two.)","imgs":[],"exp":"RAM stores data that is used by the device to support network operations. The running configuration is stored in RAM. This type of memory is considered volatile memory because data is lost during a power cycle. Flash memory stores the IOS and delivers a copy of the IOS into RAM when a device is powered on. Flash memory is nonvolatile since it retains stored contents during a loss of power.","topic":"2.5.1","opts":[{"t":"RAM provides nonvolatile storage.","imgs":[]},{"t":"The configuration that is actively running on the device is stored in RAM.","imgs":[]},{"t":"The contents of RAM are lost during a power cycle.","imgs":[]},{"t":"RAM is a component in Cisco switches but not in Cisco routers.","imgs":[]},{"t":"RAM is able to store multiple versions of IOS and configuration files.","imgs":[]}],"ans":[1,2],"type":"multiple","sources":["Module 1-3"],"module":2,"id":23},{"q":"Which two host names follow the guidelines for naming conventions on Cisco IOS devices? (Choose two.)","imgs":[],"exp":"Some guidelines for naming conventions are that names should:\n\nStart with a letter\n\nContain no spaces\n\nEnd with a letter or digit\n\nUse only letters, digits, and dashes\n\nBe less than 64 characters in length","topic":"2.4.1","opts":[{"t":"Branch2!","imgs":[]},{"t":"RM-3-Switch-2A4","imgs":[]},{"t":"Floor(15)","imgs":[]},{"t":"HO Floor 17","imgs":[]},{"t":"SwBranch799","imgs":[]}],"ans":[1,4],"type":"multiple","sources":["Module 1-3"],"module":2,"id":24},{"q":"How is SSH different from Telnet?","imgs":[],"exp":"SSH is the preferred protocol for connecting to a device operating system over the network because it is much more secure than Telnet. Both SSH and Telnet are used to connect to devices over the network, and so are both used in-band. PuTTY and Terra Term can be used to make both SSH and Telnet connections.","topic":"2.1.4","opts":[{"t":"SSH makes connections over the network, whereas Telnet is for out-of-band access.","imgs":[]},{"t":"SSH provides security to remote sessions by encrypting messages and using user authentication. Telnet is considered insecure and sends messages in plaintext.","imgs":[]},{"t":"SSH requires the use of the PuTTY terminal emulation program. Tera Term must be used to connect to devices through the use of Telnet.","imgs":[]},{"t":"SSH must be configured over an active network connection, whereas Telnet is used to connect to a device from a console connection.","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":2,"id":25},{"q":"An administrator is configuring a switch console port with a password. In what order will the administrator travel through the IOS modes of operation in order to reach the mode in which the configuration commands will be entered? (Not all options are used.)","imgs":[],"exp":"The configuration mode that the administrator first encounters is user EXEC mode. After the enable command is entered, the next mode is privileged EXEC mode. From there, the configure terminal command is entered to move to global configuration mode. Finally, the administrator enters the line console 0 command to enter the mode in which the configuration will be entered.","topic":"2.2.4","type":"matrix_sort_answer","rows":["first mode","second mode","third mode","final mode"],"items":["user EXEC mode","privileged EXEC mode","global configuration mode","line configuration mode"],"ans":[0,1,2,3],"aimgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2024-09-17_085553.jpg"],"sources":["Module 1-3"],"module":2,"id":26},{"q":"What are three characteristics of an SVI? (Choose three.)","imgs":[],"exp":"Switches have one or more switch virtual interfaces (SVIs). SVIs are created in software since there is no physical hardware associated with them. Virtual interfaces provide a means to remotely manage a switch over a network that is using IP. Each switch comes with one SVI appearing in the default configuration \"out-of-the-box.\" The default SVI interface is VLAN1.","topic":"2.6.2","opts":[{"t":"It is designed as a security protocol to protect switch ports.","imgs":[]},{"t":"It is not associated with any physical interface on a switch.","imgs":[]},{"t":"It is a special interface that allows connectivity by different types of media.","imgs":[]},{"t":"It is required to allow connectivity by any device at any location.","imgs":[]},{"t":"It provides a means to remotely manage a switch.","imgs":[]},{"t":"It is associated with VLAN1 by default.","imgs":[]}],"ans":[1,4,5],"type":"multiple","sources":["Module 1-3"],"module":2,"id":27},{"q":"What command is used to verify the condition of the switch interfaces, including the status of the interfaces and a configured IP address?","imgs":[],"exp":"The show ip interface brief command is used to display a brief synopsis of the condition of the device interfaces. The ipconfig command is used to verify TCP/IP properties on a host. The ping command is used to verify Layer 3 connectivity. The traceroute command is used to trace the network path from source to destination.","topic":"2.8.1","opts":[{"t":"ipconfig","imgs":[]},{"t":"ping","imgs":[]},{"t":"traceroute","imgs":[]},{"t":"show ip interface brief","imgs":[]}],"ans":[3],"type":"single","sources":["Module 1-3"],"module":2,"id":28},{"q":"Match the description with the associated IOS mode. (Not all options are used.)","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2020-03-08_184953.jpg"],"exp":"","topic":"2.2.4","type":"image","sources":["Module 1-3"],"module":2,"id":29},{"q":"Match the definitions to their respective CLI hot keys and shortcuts. (Not all options are used.)","imgs":[],"exp":"The shortcuts with their functions are as follows:\n\n- Tab - Completes the remainder of a partially typed command or keyword\n\n- Space bar - displays the next screen\n\n- ? - provides context-sensitive help\n\n- Up Arrow - Allows user to scroll backward through former commands\n\n- Ctrl-C - cancels any command currently being entered and returns directly to privileged EXEC mode\n\n- Ctrl-Shift-6 - Allows the user to interrupt an IOS process such as ping or traceroute","topic":"2.3.5","type":"matrix_sort_answer","rows":["provides context-sensitive help","displays the next screen","completes abbreviated commands and parameters","scrolls backwards through previously entered commands","aborts commands such as trace and ping"],"items":["?","Space bar","Tab","Up Arrow","Ctrl-Shift-6"],"ans":[0,1,2,3,4],"aimgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2024-09-17_092502.jpg"],"sources":["Module 1-3"],"module":2,"id":30},{"q":"In the show running-config command, which part of the syntax is represented by running-config ?","imgs":[],"exp":"The first part of the syntax, show, is the command, and the second part of the syntax, running-config, is the keyword. The keyword specifies what should be displayed as the output of the show command.","topic":"2.3.1","opts":[{"t":"the command","imgs":[]},{"t":"a keyword","imgs":[]},{"t":"a variable","imgs":[]},{"t":"a prompt","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":2,"id":31},{"q":"After making configuration changes on a Cisco switch, a network administrator issues a copy running-config startup-config command. What is the result of issuing this command?","imgs":[],"exp":"With the copy running-config startup-config command, the content of the current operating configuration replaces the startup configuration file stored in NVRAM. The configuration file saved in NVRAM will be loaded when the device is restarted.","topic":"2.5.2","opts":[{"t":"The new configuration will be stored in flash memory.","imgs":[]},{"t":"The new configuration will be loaded if the switch is restarted.","imgs":[]},{"t":"The current IOS file will be replaced with the newly configured file.","imgs":[]},{"t":"The configuration changes will be removed and the original configuration will be restored.","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":2,"id":32},{"q":"What command will prevent all unencrypted passwords from displaying in plain text in a configuration file?","imgs":[],"exp":"To prevent all configured passwords from appearing in plain text in configuration files, an administrator can execute the service password-encryption command. This command encrypts all configured passwords in the configuration file.","topic":"2.4.4","opts":[{"t":"(config)# enable password secret","imgs":[]},{"t":"(config)# enable secret Secret_Password","imgs":[]},{"t":"(config-line)# password secret","imgs":[]},{"t":"(config)# service password-encryption","imgs":[]},{"t":"(config)# enable secret Encrypted_Password","imgs":[]}],"ans":[3],"type":"single","sources":["Module 1-3"],"module":2,"id":33},{"q":"A network administrator enters the service password-encryption command into the configuration mode of a router. What does this command accomplish?","imgs":[],"exp":"The startup-config and running-config files display most passwords in plaintext. Use the service password-encryption global config command to encrypt all plaintext passwords in these files.","topic":"2.4.4","opts":[{"t":"This command encrypts passwords as they are transmitted across serial WAN links.","imgs":[]},{"t":"This command prevents someone from viewing the running configuration passwords.","imgs":[]},{"t":"This command enables a strong encryption algorithm for the enable secret password command.","imgs":[]},{"t":"This command automatically encrypts passwords in configuration files that are currently stored in NVRAM.","imgs":[]},{"t":"This command provides an exclusive encrypted password for external service personnel who are required to do router maintenance.","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":2,"id":34},{"q":"What method can be used by two computers to ensure that packets are not dropped because too much data is being sent too quickly?","imgs":[],"exp":"In order for two computers to be able to communicate effectively, there must be a mechanism that allows both the source and destination to set the timing of the transmission and receipt of data. Flow control allows for this by ensuring that data is not sent too fast for it to be received properly.","topic":"3.1.9","opts":[{"t":"encapsulation","imgs":[]},{"t":"flow control","imgs":[]},{"t":"access method","imgs":[]},{"t":"response timeout","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":3,"id":35},{"q":"Which statement accurately describes a TCP/IP encapsulation process when a PC is sending data to the network?","imgs":[],"exp":"When the data is traveling from the PC to the network, the transport layer sends segments to the internet layer. The internet layer sends packets to the network access layer, which creates frames and then converts the frames to bits. The bits are released to the network media.","topic":"3.6.4","opts":[{"t":"Data is sent from the internet layer to the network access layer.","imgs":[]},{"t":"Packets are sent from the network access layer to the transport layer.","imgs":[]},{"t":"Segments are sent from the transport layer to the internet layer.","imgs":[]},{"t":"Frames are sent from the network access layer to the internet layer.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":3,"id":36},{"q":"What three application layer protocols are part of the TCP/IP protocol suite? (Choose three.)","imgs":[],"exp":"DNS, DHCP, and FTP are all application layer protocols in the TCP/IP protocol suite. ARP and PPP are network access layer protocols, and NAT is an internet layer protocol in the TCP/IP protocol suite.","topic":"3.3.4","opts":[{"t":"ARP","imgs":[]},{"t":"DHCP","imgs":[]},{"t":"DNS","imgs":[]},{"t":"FTP","imgs":[]},{"t":"NAT","imgs":[]},{"t":"PPP","imgs":[]}],"ans":[1,2,3],"type":"multiple","sources":["Module 1-3"],"module":3,"id":37},{"q":"Match the description to the organization. (Not all options are used.)","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2020-04-23_200939.jpg"],"exp":"The EIA is an international standards and trade organization for electronics organizations. It is best known for its standards related to electrical wiring, connectors, and the 19-inch racks used to mount networking equipment.","topic":"3.3.2","type":"image","sources":["Module 1-3"],"module":3,"id":38},{"q":"Which name is assigned to the transport layer PDU?","imgs":[],"exp":"Application data is passed down the protocol stack on its way to be transmitted across the network media. During the process, various protocols add information to it at each level. At each stage of the process, a PDU (protocol data unit) has a different name to reflect its new functions. The PDUs are named according to the protocols of the TCP/IP suite:\n\nData - The general term for the PDU used at the application layer.\n\nSegment - transport layer PDU\n\nPacket - network layer PDU\n\nFrame – data link layer PDU\n\nBits - A physical layer PDU used when physically transmitting data over the medium","topic":"3.6.3","opts":[{"t":"bits","imgs":[]},{"t":"data","imgs":[]},{"t":"frame","imgs":[]},{"t":"packet","imgs":[]},{"t":"segment","imgs":[]}],"ans":[4],"type":"single","sources":["Module 1-3"],"module":3,"id":39},{"q":"When IPv4 addressing is manually configured on a web server, which property of the IPv4 configuration identifies the network and host portion for an IPv4 address?","imgs":[],"exp":"There are several components that need to be entered when configuring IPv4 for an end device:\n\nIPv4 address - uniquely identifies an end device on the network\nSubnet mask - determines the network address portion and host portion for an IPv4 address\nDefault gateway - the IP address of the router interface used for communicating with hosts in another network\nDNS server address - the IP address of the Domain Name System (DNS) server\n\nDHCP server address (if DHCP is used) is not configured manually on end devices. It will be provided by a DHCP server when an end device requests an IP address.","topic":"3.7.2","opts":[{"t":"DNS server address","imgs":[]},{"t":"subnet mask","imgs":[]},{"t":"default gateway","imgs":[]},{"t":"DHCP server address","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":3,"id":40},{"q":"What process involves placing one PDU inside of another PDU?","imgs":[],"exp":"When a message is placed inside of another message, this is known as encapsulation. On networks, encapsulation takes place when one protocol data unit is carried inside of the data field of the next lower protocol data unit.","topic":"3.6.3","opts":[{"t":"encapsulation","imgs":[]},{"t":"encoding","imgs":[]},{"t":"segmentation","imgs":[]},{"t":"flow control","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":41},{"q":"What layer is responsible for routing messages through an internetwork in the TCP/IP model?","imgs":[],"exp":"The TCP/IP model consists of four layers: application, transport, internet, and network access. Of these four layers, it is the internet layer that is responsible for routing messages. The session layer is not part of the TCP/IP model but is rather part of the OSI model.","topic":"3.5.4","opts":[{"t":"internet","imgs":[]},{"t":"transport","imgs":[]},{"t":"network access","imgs":[]},{"t":"session","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":42},{"q":"For the TCP/IP protocol suite, what is the correct order of events when a Telnet message is being prepared to be sent over the network?","imgs":[],"exp":"","topic":"3.3.5","type":"matrix_sort_answer","rows":["First","Second","Third","Fourth"],"items":["The Telnet-formatted data is provided to the next layer.","The TCP header is added.","The IP header is added.","The Ethernet header is added."],"ans":[0,1,2,3],"aimgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2024-09-17_084235.jpg"],"sources":["Module 1-3"],"module":3,"id":43},{"q":"Which PDU format is used when bits are received from the network medium by the NIC of a host?","imgs":[],"exp":"When received at the physical layer of a host, the bits are formatted into a frame at the data link layer. A packet is the PDU at the network layer. A segment is the PDU at the transport layer. A file is a data structure that may be used at the application layer.","topic":"3.6.3","opts":[{"t":"file","imgs":[]},{"t":"frame","imgs":[]},{"t":"packet","imgs":[]},{"t":"segment","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":3,"id":44},{"q":"Refer to the exhibit. ServerB is attempting to contact HostA. Which two statements correctly identify the addressing that ServerB will generate in the process? (Choose two.)","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/i304745v1n1_214638.png"],"exp":"In order to send data to HostA, ServerB will generate a packet that contains the IP address of the destination device on the remote network and a frame that contains the MAC address of the default gateway device on the local network.","topic":"3.7.2","opts":[{"t":"ServerB will generate a packet with the destination IP address of RouterB.","imgs":[]},{"t":"ServerB will generate a frame with the destination MAC address of SwitchB.","imgs":[]},{"t":"ServerB will generate a packet with the destination IP address of RouterA.","imgs":[]},{"t":"ServerB will generate a frame with the destination MAC address of RouterB.","imgs":[]},{"t":"ServerB will generate a packet with the destination IP address of HostA.","imgs":[]},{"t":"ServerB will generate a frame with the destination MAC address of RouterA.","imgs":[]}],"ans":[3,4],"type":"multiple","sources":["Module 1-3"],"module":3,"id":45},{"q":"Which method allows a computer to react accordingly when it requests data from a server and the server takes too long to respond?","imgs":[],"exp":"If a computer makes a request and does not hear a response within an acceptable amount of time, the computer assumes that no answer is coming and reacts accordingly.","topic":"3.1.9","opts":[{"t":"encapsulation","imgs":[]},{"t":"flow control","imgs":[]},{"t":"access method","imgs":[]},{"t":"response timeout","imgs":[]}],"ans":[3],"type":"single","sources":["Module 1-3"],"module":3,"id":46},{"q":"A web client is receiving a response for a web page from a web server. From the perspective of the client, what is the correct order of the protocol stack that is used to decode the received transmission?","imgs":[],"exp":"1. HTTP governs the way that a web server and client interact.\n\n2. TCP manages individual conversations between web servers and clients.\n\n3. IP is responsible for delivery across the best path to the destination.\n\n4. Ethernet takes the packet from IP and formats it for transmission.","topic":"3.6.3","opts":[{"t":"Ethernet, IP, TCP, HTTP","imgs":[]},{"t":"HTTP, TCP, IP, Ethernet","imgs":[]},{"t":"Ethernet, TCP, IP, HTTP","imgs":[]},{"t":"HTTP, Ethernet, IP, TCP","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":47},{"q":"Which two OSI model layers have the same functionality as a single layer of the TCP/IP model? (Choose two.)","imgs":[],"exp":"The OSI data link and physical layers together are equivalent to the TCP/IP network access layer. The OSI transport layer is functionally equivalent to the TCP/IP transport layer, and the OSI network layer is equivalent to the TCP/IP internet layer. The OSI application, presentation, and session layers are functionally equivalent to the application layer within the TCP/IP model.","topic":"3.5.4","opts":[{"t":"data link","imgs":[]},{"t":"network","imgs":[]},{"t":"physical","imgs":[]},{"t":"session","imgs":[]},{"t":"transport","imgs":[]}],"ans":[0,2],"type":"multiple","sources":["Module 1-3"],"module":3,"id":48},{"q":"At which layer of the OSI model would a logical address be added during encapsulation?","imgs":[],"exp":"Logical addresses, also known as IP addresses, are added at the network layer. Physical addresses are edded at the data link layer. Port addresses are added at the transport layer. No addresses are added at the physical layer.","topic":"3.7.2","opts":[{"t":"physical layer","imgs":[]},{"t":"data link layer","imgs":[]},{"t":"network layer","imgs":[]},{"t":"transport layer","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":3,"id":49},{"q":"What is a characteristic of multicast messages?","imgs":[],"exp":"Multicast is a one-to-many type of communication. Multicast messages are addressed to a specific multicast group.","topic":"3.1.9","opts":[{"t":"They are sent to a select group of hosts.","imgs":[]},{"t":"They are sent to all hosts on a network.","imgs":[]},{"t":"They must be acknowledged.","imgs":[]},{"t":"They are sent to a single destination.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":50},{"q":"Which statement is correct about network protocols?","imgs":[],"exp":"Network protocols are implemented in hardware, or software, or both. They interact with each other within different layers of a protocol stack. Protocols have nothing to do with the installation of the network equipment. Network protocols are required to exchange information between source and destination devices in both local and remote networks.","topic":"3.1.7","opts":[{"t":"Network protocols define the type of hardware that is used and how it is mounted in racks.","imgs":[]},{"t":"They define how messages are exchanged between the source and the destination.","imgs":[]},{"t":"They all function in the network access layer of TCP/IP.","imgs":[]},{"t":"They are only required for exchange of messages between devices on remote networks.","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":3,"id":51},{"q":"What is an advantage of network devices using open standard protocols?","imgs":[],"exp":"An advantage of network devices implementing open standard protocols, such as from the TCP/IP suite, is that clients and servers running different operating systems can communicate with each other. Open standard protocols facilitate innovation and competition between vendors and across markets, and can reduce the occurrence of monopolies in networking markets.","topic":"3.4.1","opts":[{"t":"Network communications is confined to data transfers between devices from the same vendor.","imgs":[]},{"t":"A client host and a server running different operating systems can successfully exchange data.","imgs":[]},{"t":"Internet access can be controlled by a single ISP in each market.","imgs":[]},{"t":"Competition and innovation are limited to specific types of products.","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":3,"id":52},{"q":"Which device performs the function of determining the path that messages should take through internetworks?","imgs":[],"exp":"A router is used to determine the path that the messages should take through the network. A firewall is used to filter incoming and outgoing traffic. A DSL modem is used to provide Internet connection for a home or an organization.","topic":"1.2.4","opts":[{"t":"a router","imgs":[]},{"t":"a firewall","imgs":[]},{"t":"a web server","imgs":[]},{"t":"a DSL modem","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":53},{"q":"Open the PT Activity. Perform the tasks in the activity instructions and then answer the question.","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2.jpg"],"exp":"After the enable command is issued, the show running-configuration command or the show ip interfaces brief command will display the IP address of the switch virtual interface (SVI).","topic":"2.7.4","opts":[{"t":"192.168.5.10","imgs":[]},{"t":"192.168.10.5","imgs":[]},{"t":"192.168.10.1","imgs":[]},{"t":"192.168.5.0","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":2,"id":54},{"q":"What term describes a network owned by one organization that provides safe and secure access to individuals who work for a different organization?","imgs":[],"exp":"The term extranet describes a controlled and private network infrastructure owned by a single organization that is purposely built to grant secure, limited access to external individuals who work for completely different organizations or business entities.\nAn extranet is typically deployed to facilitate seamless collaboration with external stakeholders such as trusted suppliers, vendors, business partners, or high-priority clients. It allows them to access specific internal resources and files safely without exposing the core corporate network to broader security risks.","topic":"1.4.4","opts":[{"t":"extranet","imgs":[]},{"t":"cloud","imgs":[]},{"t":"BYOD","imgs":[]},{"t":"quality of service","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":55},{"q":"What term describes storing personal files on servers over the internet to provide access anywhere, anytime, and on any device?","imgs":[],"exp":"The term cloud (or cloud computing) refers to the practice of storing, managing, and processing data on remote servers hosted on the Internet, rather than on a local hard drive. This architecture allows users to seamlessly upload and retrieve their personal files, applications, and services from any geographical location, at any given time, and across any internet-enabled device.","topic":"1.7.6","opts":[{"t":"cloud","imgs":[]},{"t":"BYOD","imgs":[]},{"t":"quality of service","imgs":[]},{"t":"converged network","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":56},{"q":"What term describes a network where one computer can be both client and server?","imgs":[],"exp":"The term peer-to-peer (P2P) describes a network model where every interconnected computer can function as both a client and a server simultaneously.\nIn this specific architecture, there is no requirement for a centralized or dedicated server. For instance, a computer acts as a server when it shares a local file or a connected printer with other users, and at the same time, it operates as a client when retrieving a shared document stored on another workstation. This setup is highly cost-effective for home environments or small offices, though it has distinct limitations regarding scalability and centralized security management.","topic":"1.2.2","opts":[{"t":"peer-to-peer","imgs":[]},{"t":"cloud","imgs":[]},{"t":"BYOD","imgs":[]},{"t":"quality of service","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":57},{"q":"What term describes a type of network used by people who work from home or from a small remote office?","imgs":[],"exp":"The term SOHO stands for Small Office, Home Office. It describes a specific category of Local Area Network (LAN) engineered to support individuals working remotely from home or operating within a small-scale business environment with a limited number of end devices.\nThese networks are highly cost-effective and typically rely on a single, integrated multi-function device (a standard home router) that simultaneously provides switching capabilities, wireless access (Wi-Fi), and routing functions to grant Internet access and enable local resource sharing.","topic":"1.4.1","opts":[{"t":"SOHO network","imgs":[]},{"t":"BYOD","imgs":[]},{"t":"quality of service","imgs":[]},{"t":"converged network","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":58},{"q":"What term describes a computing model where server software runs on dedicated computers?","imgs":[],"exp":"The client/server model is a distributed network architecture where tasks and workloads are partitioned between service providers (called servers) and service requesters (called clients).\nIn this specific computing model, the server software runs on dedicated, high-performance computers that are completely optimized to host, manage, and respond to requests sent by multiple client devices simultaneously (such as web servers, file servers, or email servers).\nThis centralization of network resources and hardware is what mainly distinguishes the client/server architecture from a Peer-to-Peer (P2P) network, where individual devices share responsibilities equally and can act as both clients and servers at the same time without relying on dedicated hardware.","topic":"1.2.2","opts":[{"t":"client/server","imgs":[]},{"t":"internet","imgs":[]},{"t":"intranet","imgs":[]},{"t":"extranet","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":59},{"q":"What term describes a technology that allows devices to connect to the LAN using an electrical outlet?","imgs":[],"exp":"Powerline networking is a technology that allows data to be transmitted over an object's existing electrical wiring. By using specialized powerline adapters plugged directly into any standard electrical outlet, devices can seamlessly connect to the local area network (LAN). This approach effectively turns standard electrical infrastructure into network data channels without requiring extra Ethernet cabling.","topic":"1.7.8","opts":[{"t":"powerline networking","imgs":[]},{"t":"internet","imgs":[]},{"t":"intranet","imgs":[]},{"t":"extranet","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":60},{"q":"What term describes a policy that allows network devices to manage the flow of data to give priority to voice and video?","imgs":[],"exp":"Quality of Service (QoS) is a network policy that enables devices to manage data traffic flows by prioritizing bandwidth. It ensures that time-sensitive, real-time communications like voice and video are given higher priority over standard data traffic. This mechanism significantly reduces latency and jitter, maintaining acceptable transmission quality even during network congestion. Other options like Internet, Intranet, or Extranet merely define the scope or boundaries of network access.","topic":"1.6.4","opts":[{"t":"quality of service","imgs":[]},{"t":"internet","imgs":[]},{"t":"intranet","imgs":[]},{"t":"extranet","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":61},{"q":"What term describes a private collection of LANs and WANs that belongs to an organization?","imgs":[],"exp":"An intranet is a private collection of LANs and WANs that belongs to an organization. It is designed to be accessible only by the organization's members, employees, or others with explicit authorization to securely share internal data and resources.","topic":"1.4.4","opts":[{"t":"intranet","imgs":[]},{"t":"internet","imgs":[]},{"t":"extranet","imgs":[]},{"t":"peer-to-peer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":62},{"q":"What term describes the ability to use personal devices across a business or campus network?","imgs":[],"exp":"The term BYOD (which stands for Bring Your Own Device) describes the growing trend and corporate policy where users, employees, or students are officially permitted to utilize their personal tech devices (such as laptops, smartphones, or tablets) to connect to a corporate or campus network to access internal organizational resources.","topic":"1.7.2","opts":[{"t":"BYOD","imgs":[]},{"t":"internet","imgs":[]},{"t":"intranet","imgs":[]},{"t":"extranet","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":1,"id":63},{"q":"At which OSI layer is a source IP address added to a PDU during the encapsulation process?","imgs":[],"exp":"","topic":"3.6.4","opts":[{"t":"network layer","imgs":[]},{"t":"data link layer","imgs":[]},{"t":"transport layer","imgs":[]},{"t":"application layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":64},{"q":"At which OSI layer is a destination port number added to a PDU during the encapsulation process?","imgs":[],"exp":"The transport layer (Layer 4 of the OSI model) is responsible for establishing a temporary communication session between two applications and transferring data between them reliably.\nDuring the encapsulation process, as data moves down from the application layer, the transport layer breaks it into smaller pieces called segments (PDU). It is exactly at this stage that a header containing both the source port number and the destination port number is added. The destination port number is critical because it tells the receiving device exactly which specific upper-layer application or service (such as HTTP on port 80, HTTPS on port 443, or DNS on port 53) should receive the data.","topic":"3.6.3","opts":[{"t":"transport layer","imgs":[]},{"t":"data link layer","imgs":[]},{"t":"network layer","imgs":[]},{"t":"application layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":65},{"q":"At which OSI layer is data added to a PDU during the encapsulation process?","imgs":[],"exp":"The application layer (Layer 7 of the OSI model) is the starting point where data is generated by user interactions or software applications (such as web browsers or email clients).\nDuring the encapsulation process, this layer takes the raw user information and formats it according to the specific protocol in use (such as HTTP, FTP, or SMTP), creating the initial PDU known simply as data. This data PDU is then passed down to the lower layers of the OSI stack, where it will sequentially receive headers and trailers (becoming segments, packets, and frames) to prepare it for physical transmission.","topic":"3.6.3","opts":[{"t":"application layer","imgs":[]},{"t":"data link layer","imgs":[]},{"t":"network layer","imgs":[]},{"t":"transport layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":66},{"q":"At which OSI layer is a source IP address added to a PDU during the encapsulation process?","imgs":[],"exp":"The network layer (Layer 3 of the OSI model) is responsible for end-to-end packet delivery across multiple interconnected networks.\nDuring the encapsulation process, when data from the transport layer arrives at the network layer, it is packaged into protocol data units called packets (PDUs). At this stage, a Layer 3 network header is attached, which strictly includes both the source IP address (identifying the original sender) and the destination IP address (identifying the final receiver). This logical addressing allows intermediate routers to successfully inspect the information and forward the data along the best path toward its final destination.","topic":"3.6.4","opts":[{"t":"network layer","imgs":[]},{"t":"data link layer","imgs":[]},{"t":"application layer","imgs":[]},{"t":"presentation layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":67},{"q":"Which of the following is the name for all computers connected to a network that participate directly in network communication?","imgs":[],"exp":"Hosts are all computers connected to a network that participate directly in network communication.","topic":"1.2.1","opts":[{"t":"Servers","imgs":[]},{"t":"Intermediary device","imgs":[]},{"t":"Host","imgs":[]},{"t":"media","imgs":[]}],"ans":[2],"type":"single","sources":["Module 1-3"],"module":1,"id":68},{"q":"At which OSI layer is a destination IP address added to a PDU during the encapsulation process?","imgs":[],"exp":"The network layer (Layer 3 of the OSI model) is responsible for logical addressing and routing data across different interconnected networks.\nDuring the encapsulation process, as data segments move down from the transport layer, the network layer packages them into protocol data units called packets (PDU). It is exactly at this stage that a network header containing both the source IP address and the destination IP address is added. The destination IP address is critical because it allows intermediate routers to make proper forwarding decisions, ensuring the packet is routed through the correct path until it reaches its ultimate destination.","topic":"3.6.3","opts":[{"t":"network layer","imgs":[]},{"t":"application layer","imgs":[]},{"t":"transport layer","imgs":[]},{"t":"presentation layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":69},{"q":"At which OSI layer is a source MAC address added to a PDU during the encapsulation process?","imgs":[],"exp":"The data link layer (Layer 2 of the OSI model) is responsible for preparing data for physical transmission across local network media and controlling access to those media.\nDuring the encapsulation process, as IP packets move down from the network layer (Layer 3), the data link layer packages them into protocol data units called frames (PDUs). It is exactly at this stage that a data link header is attached, which includes both the source MAC address (the physical address of the sending device's NIC) and the destination MAC address (the next physical hop on the local network). This allows local network hardware, such as switches, to successfully identify the immediate sender and receiver within the same local network segment.","topic":"3.6.3","opts":[{"t":"data link layer","imgs":[]},{"t":"application layer","imgs":[]},{"t":"transport layer","imgs":[]},{"t":"presentation layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":70},{"q":"At which OSI layer is a source port number added to a PDU during the encapsulation process?","imgs":[],"exp":"The transport layer (Layer 4 of the OSI model) is responsible for managing data flow and ensuring that applications on both ends of the network can communicate seamlessly.\nDuring the encapsulation process, data moving down from the application layer is segmented into smaller protocol data units called segments (PDUs). It is precisely at this level that a transport header is attached, which includes both the source port number and the destination port number. The source port number is dynamically assigned by the sending device to uniquely identify the local application session initiating the communication, ensuring that return traffic is directed back to the correct software or service.","topic":"3.6.3","opts":[{"t":"transport layer","imgs":[]},{"t":"application layer","imgs":[]},{"t":"network layer","imgs":[]},{"t":"presentation layer","imgs":[]},{"t":"data link layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":71},{"q":"At which OSI layer is a destination MAC address added to a PDU during the encapsulation process?","imgs":[],"exp":"","topic":"3.6.3","opts":[{"t":"data link layer","imgs":[]},{"t":"transport layer","imgs":[]},{"t":"application layer","imgs":[]},{"t":"network layer","imgs":[]}],"ans":[0],"type":"single","sources":["Module 1-3"],"module":3,"id":72},{"q":"When data is encoded as pulses of light, which media is being used to transmit the data?","imgs":[],"exp":"Fiber-optic cable is the media is being used to transmit the data when data is encoded as pulses of light.","topic":"1.2.5","opts":[{"t":"Wireless","imgs":[]},{"t":"Fire optic cable","imgs":[]},{"t":"Copper cable","imgs":[]}],"ans":[1],"type":"single","sources":["Module 1-3"],"module":1,"id":73},{"q":"Which two devices are intermediary devices? (Choose two)","imgs":[],"exp":"Routers and switches are intermediary devices.","topic":"1.2.4","opts":[{"t":"Host","imgs":[]},{"t":"Router","imgs":[]},{"t":"Switch","imgs":[]},{"t":"Servers","imgs":[]}],"ans":[1,2],"type":"multiple","sources":["Module 1-3"],"module":1,"id":74},{"q":"A college is building a new dormitory on its campus. Workers are digging in the ground to install a new water pipe for the dormitory. A worker accidentally damages a fiber optic cable that connects two of the existing dormitories to the campus data center. Although the cable has been cut, students in the dormitories only experience a very short interruption of network services. What characteristic of the network is shown here?","imgs":[],"exp":"Fault tolerance is the characteristic of a network which allows it to quickly respond to failures of network devices, media, or services. Quality of service refers to the measures taken to ensure that network traffic requiring higher throughput receives the required network resources. Scalability refers to the ability of the network to grow to accommodate new requirements. Security refers to protecting networks and data from theft, alteration, or destruction. Integrity refers to the completeness of something and is generally not used as a characteristic of networks in the same way as the other terms.","topic":"1.6.2","opts":[{"t":"quality of service (QoS)","imgs":[]},{"t":"scalability","imgs":[]},{"t":"security","imgs":[]},{"t":"fault tolerance","imgs":[]},{"t":"integrity","imgs":[]}],"ans":[3],"type":"single","sources":["Module 1-3"],"module":1,"id":75},{"type":"single","q":"What does the term “attenuation” mean in data communication?","imgs":[],"exp":"Data is transmitted on copper cables as electrical pulses. A detector in the network interface of a destination device must receive a signal that can be successfully decoded to match the signal sent. However, the farther the signal travels, the more it deteriorates. This is referred to as signal attenuation.","topic":"4.3.1","opts":[{"t":"strengthening of a signal by a networking device","imgs":[]},{"t":"leakage of signals from one cable pair to another","imgs":[]},{"t":"time for a signal to reach its destination","imgs":[]},{"t":"loss of signal strength as distance increases","imgs":[]}],"ans":[3],"sources":["Module 4-7","Final Exam (161)"],"module":4,"id":76},{"type":"single","q":"Refer to the exhibit. What is wrong with the displayed termination?","imgs":["https://itexamanswers.net/wp-content/uploads/2020/01/i274300v1n1_209630-300x221-1.png"],"exp":"When a cable to an RJ-45 connector is terminated, it is important to ensure that the untwisted wires are not too long and that the flexible plastic sheath surrounding the wires is crimped down and not the bare wires. None of the colored wires should be visible from the bottom of the jack.","topic":"4.4.2","opts":[{"t":"The woven copper braid should not have been removed.","imgs":[]},{"t":"The wrong type of connector is being used.","imgs":[]},{"t":"The untwisted length of each wire is too long.","imgs":[]},{"t":"The wires are too thick for the connector that is used.","imgs":[]}],"ans":[2],"sources":["Module 4-7","Final Exam (161)"],"module":4,"id":77},{"type":"single","q":"What OSI physical layer term describes the measure of the transfer of bits across a medium over a given period of time?","imgs":[],"exp":"Throughput is the physical layer term that describes the actual measure of bits transferred across a network medium over a given period of time.\nIt is highly common to confuse this with Bandwidth, but there is a fundamental distinction: bandwidth represents the maximum theoretical capacity a medium can handle under perfect conditions, whereas throughput is the real-world, practical measure of data that successfully traverses the link. Throughput is almost always lower than bandwidth due to factors such as network traffic congestion, processing latency, and the overhead introduced by network protocols.","topic":"4.2.6","opts":[{"t":"latency","imgs":[]},{"t":"goodput","imgs":[]},{"t":"throughput","imgs":[]},{"t":"bandwidth","imgs":[]}],"ans":[2],"sources":["Module 4-7","Practice Final (58)"],"module":4,"id":78},{"q":"What is the purpose of the OSI physical layer?","imgs":[],"exp":"","topic":"4.1.1","opts":[{"t":"controlling access to media","imgs":[]},{"t":"transmitting bits across the local media","imgs":[]},{"t":"performing error detection on received frames","imgs":[]},{"t":"exchanging frames between nodes over physical network media","imgs":[]}],"ans":[1],"type":"single","sources":["Module 4-7"],"module":4,"id":79},{"q":"Why are two strands of fiber used for a single fiber optic connection?","imgs":[],"exp":"","topic":"4.5.4","opts":[{"t":"The two strands allow the data to travel for longer distances without degrading.","imgs":[]},{"t":"They prevent crosstalk from causing interference on the connection.","imgs":[]},{"t":"They increase the speed at which the data can travel.","imgs":[]},{"t":"They allow for full-duplex connectivity.","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":4,"id":80},{"q":"Which characteristic describes crosstalk?","imgs":[],"exp":"","topic":"4.3.1","opts":[{"t":"the distortion of the network signal from fluorescent lighting","imgs":[]},{"t":"the distortion of the transmitted messages from signals carried in adjacent wires","imgs":[]},{"t":"the weakening of the network signal over long cable lengths","imgs":[]},{"t":"the loss of wireless signal over excessive distance from the access point","imgs":[]}],"ans":[1],"type":"single","sources":["Module 4-7"],"module":4,"id":81},{"q":"Which procedure is used to reduce the effect of crosstalk in copper cables?","imgs":[],"exp":"","topic":"4.3.1","opts":[{"t":"requiring proper grounding connections","imgs":[]},{"t":"twisting opposing circuit wire pairs together","imgs":[]},{"t":"wrapping the bundle of wires with metallic shielding","imgs":[]},{"t":"designing a cable infrastructure to avoid crosstalk interference","imgs":[]},{"t":"avoiding sharp bends during installation","imgs":[]}],"ans":[1],"type":"single","sources":["Module 4-7"],"module":4,"id":82},{"q":"Match the situation with the appropriate use of network media.","imgs":[],"exp":"","topic":"4.3.3","type":"matrix_sort_answer","rows":["horizontal cabling structure","backbone cabling in an enterprise","guest access in a coffee shop","desktop PCs in offices in an enterprise","long-haul networks","waiting rooms in a hospital"],"items":["Copper Cables","Fiber optic","Wireless","Copper Cables","Fiber optic","Wireless"],"ans":[0,1,2,3,4,5],"aimgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2024-12-25_150053.jpg"],"sources":["Module 4-7"],"module":4,"id":83},{"q":"A network administrator is measuring the transfer of bits across the company backbone for a mission critical financial application. The administrator notices that the network throughput appears lower than the bandwidth expected. Which three factors could influence the differences in throughput? (Choose three.)","imgs":[],"exp":"Throughput usually does not match the specified bandwidth of physical links due to multiple factors. These factors include, the amount of traffic, type of traffic, and latency created by the network devices the data has to cross.","topic":"4.2.6","opts":[{"t":"the amount of traffic that is currently crossing the network","imgs":[]},{"t":"the sophistication of the encapsulation method applied to the data","imgs":[]},{"t":"the type of traffic that is crossing the network","imgs":[]},{"t":"the latency that is created by the number of network devices that the data is crossing","imgs":[]},{"t":"the bandwidth of the WAN connection to the Internet","imgs":[]},{"t":"the reliability of the gigabit Ethernet infrastructure of the backbone","imgs":[]}],"ans":[0,2,3],"type":"multiple","sources":["Module 4-7"],"module":4,"id":84},{"q":"What are two characteristics of fiber-optic cable? (Choose t
