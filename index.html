:1::8:1","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":12,"id":280},{"q":"Which is the compressed format of the IPv6 address 2001:0db8:0000:0000:0000:a0b0:0008:0001?","imgs":[],"exp":"","topic":"12.2.2","opts":[{"t":"2001:db8::a0b0:8:1","imgs":[]},{"t":"2001:db8::ab8:1:0:1000","imgs":[]},{"t":"2001:db80:0:1::80:1","imgs":[]},{"t":"2001:db8:0:1::8:1","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":12,"id":281},{"q":"Which is the compressed format of the IPv6 address 2002:0042:0010:c400:0000:0000:0000:0909?","imgs":[],"exp":"Omit leading zeros: Drop any starting zeros within each 16-bit segment (hextet). Following this step, 0042 simplifies to 42, 0010 becomes 10, and 0909 reduces to 909. Trailing zeros (such as the ones in c400) must be kept exactly as they are.\nCompress with the double colon (::): The contiguous string of three consecutive all-zero segments (0000:0000:0000) is fully replaced by a single :: notation.\n\nCombining both optimization rules yields the correct compressed format: 2002:42:10:c400::909.","topic":"12.2.2","opts":[{"t":"2002:42:10:c400::909","imgs":[]},{"t":"2002:4200::25:1090:0:99","imgs":[]},{"t":"2002:420:c4:1008:25:190::990","imgs":[]},{"t":"2002:42::25:1090:0:99","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":12,"id":282},{"q":"Which is the compressed format of the IPv6 address fe80:09ea:0000:2200:0000:0000:0fe0:0290?","imgs":[],"exp":"Omit leading zeros: Remove any starting zeros from each 16-bit segment (hextet). Following this, 09ea becomes 9ea, 0000 becomes 0, 0fe0 simplifies to fe0, and 0290 reduces to 290. (Note: Trailing zeros, such as those in 2200, cannot be dropped).\nCompress with double colons (::): This rule allows you to replace the longest contiguous string of all-zero hextets with a single ::. This specific address features a single 0000 in the third hextet and a consecutive pair of 0000:0000 in the fifth and sixth hextets. You must choose the longest sequence to compress, which substitutes the consecutive pair with ::.\n\nCombining these rules yields the correct optimized format: fe80:9ea:0:2200::fe0:290.","topic":"12.2.2","opts":[{"t":"fe80:9ea:0:2200::fe0:290","imgs":[]},{"t":"fe80:9ea0::2020:0:bf:e0:9290","imgs":[]},{"t":"fe80::220:b3f:f0e0:29","imgs":[]},{"t":"fe80::0220:0b3f:f0e0:0029","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":12,"id":283},{"q":"A user issues a ping 2001:db8:FACE:39::10 command and receives a response that includes a code of 2. What does this code represent?","imgs":[],"exp":"In ICMPv6 \"Destination Unreachable\" messages (Type 1), the Code field specifies the precise diagnostic reason why the packet could not be delivered. The standard ICMPv6 codes are defined as follows:\n\nCode 0: No route to destination.\nCode 1: Communication with destination administratively prohibited.\nCode 2: Beyond scope of the source address. This tells the sender that the scope of its source IP address is too constrained (for example, a Link-Local Address) to successfully communicate with the destination IP address (such as a Global Unicast Address).\nCode 3: Address unreachable.","topic":"13.1.3","opts":[{"t":"beyond scope of the source address","imgs":[]},{"t":"communication with the destination administratively prohibited","imgs":[]},{"t":"address unreachable","imgs":[]},{"t":"no route to destination","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":284},{"q":"A user issues a ping 192.135.250.103 command and receives a response that includes a code of 1. What does this code represent?","imgs":[],"exp":"Within ICMPv4 \"Destination Unreachable\" messages (Type 3), the Code field identifies the precise diagnostic reason for the delivery failure. The standard codes are classified as follows:\n\nCode 0: Network unreachable (the router lacks a valid path to the destination network).\nCode 1: Host unreachable. This indicates that the packet successfully reached the local gateway or edge router responsible for the destination network segment, but the specific target host failed to respond (e.g., the device is powered off, disconnected, or its MAC address cannot be resolved via ARP).\nCode 2: Protocol unreachable.\nCode 3: Port unreachable.","topic":"13.1.3","opts":[{"t":"host unreachable","imgs":[]},{"t":"beyond scope of the source address","imgs":[]},{"t":"address unreachable","imgs":[]},{"t":"communication with the destination administratively prohibited","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":285},{"q":"A user issues a ping fe80:65ab:dcc1::100 command and receives a response that includes a code of 3. What does this code represent?","imgs":[],"exp":"Within ICMPv6 \"Destination Unreachable\" messages (Type 1), the Code field values identify the precise reason for the delivery failure. The standard definitions are classified as follows:\n\nCode 0: No route to destination.\nCode 1: Communication with destination administratively prohibited.\nCode 2: Beyond scope of the source address.\nCode 3: Address unreachable (the targeted destination IP cannot be resolved or is physically unavailable on the local link).","topic":"13.1.3","opts":[{"t":"address unreachable","imgs":[]},{"t":"communication with the destination administratively prohibited","imgs":[]},{"t":"beyond scope of the source address","imgs":[]},{"t":"no route to destination","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":286},{"q":"A user issues a ping 10.10.14.67 command and receives a response that includes a code of 0. What does this code represent?","imgs":[],"exp":"Within ICMP \"Destination Unreachable\" messages (Type 3), Code 0 specifically stands for Network unreachable. This indicates that the router does not possess a valid route in its routing table to reach the destination network.","topic":"13.1.3","opts":[{"t":"network unreachable","imgs":[]},{"t":"protocol unreachable","imgs":[]},{"t":"port unreachable","imgs":[]},{"t":"host unreachable","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":287},{"q":"A user issues a ping fe80:65ab:dcc1::100 command and receives a response that includes a code of 4. What does this code represent?","imgs":[],"exp":"When a device replies with an ICMPv6 \"Destination Unreachable\" message (Type 1), it includes a specific Code value to explain precisely why the packet could not be delivered. Within the ICMPv6 standard, these codes are classified as follows:\n\nCode 0: No route to destination (Network unreachable).\nCode 1: Communication with destination administratively prohibited.\nCode 3: Address unreachable (Host unreachable).\nCode 4: Port unreachable.\n\nConsequently, a code of 4 fundamentally indicates that the packet successfully reached the destination host, but the transport layer protocol (such as UDP) on that host was unable to find an active application or service listening on the targeted port.","topic":"13.1.3","opts":[{"t":"port unreachable","imgs":[]},{"t":"host unreachable","imgs":[]},{"t":"protocol unreachable","imgs":[]},{"t":"network unreachable","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":288},{"q":"A user issues a ping 198.133.219.8 command and receives a response that includes a code of 0. What does this code represent?","imgs":[],"exp":"","topic":"13.1.3","opts":[{"t":"network unreachable","imgs":[]},{"t":"protocol unreachable","imgs":[]},{"t":"port unreachable","imgs":[]},{"t":"host unreachable","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":289},{"q":"A user issues a ping 2001:db8:3040:114::88 command and receives a response that includes a code of 4. What does this code represent?","imgs":[],"exp":"Much like in IPv4 networking, the ICMPv6 protocol relies on distinct code numbers inside its \"Destination Unreachable\" error messages (Type 1) to provide diagnostic details about delivery failures.\nCode 4 specifically stands for Port unreachable. This means that the IP packet was successfully routed across the network and physically reached the target host. However, once the network layer passed the payload up to the transport layer (TCP or UDP), the receiving operating system could not find any active application or service listening on the specified destination port.","topic":"13.1.3","opts":[{"t":"port unreachable","imgs":[]},{"t":"host unreachable","imgs":[]},{"t":"protocol unreachable","imgs":[]},{"t":"network unreachable","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":290},{"q":"A user issues a ping 2001:db8:FACE:39::10 command and receives a response that includes a code of 2. What does this code represent?","imgs":[],"exp":"In ICMPv6 \"Destination Unreachable\" messages (Type 1), the Code field specifies the precise diagnostic reason why the packet could not be delivered. The standard ICMPv6 codes are defined as follows:\n\nCode 0: No route to destination.\nCode 1: Communication with destination administratively prohibited.\nCode 2: Beyond scope of the source address. This tells the sender that the scope of its source IP address is too constrained (for example, a Link-Local Address) to successfully communicate with the destination IP address (such as a Global Unicast Address).\nCode 3: Address unreachable.","topic":"13.1.3","opts":[{"t":"beyond scope of the source address","imgs":[]},{"t":"host unreachable","imgs":[]},{"t":"protocol unreachable","imgs":[]},{"t":"network unreachable","imgs":[]}],"ans":[0],"type":"single","sources":["Module 11-13"],"module":13,"id":291},{"type":"multiple","q":"Which two functions are performed at the LLC sublayer of the OSI Data Link Layer to facilitate Ethernet communication? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"implements CSMA/CD over legacy shared half-duplex media","imgs":[]},{"t":"enables IPv4 and IPv6 to utilize the same physical medium","imgs":[]},{"t":"integrates Layer 2 flows between 10 Gigabit Ethernet over fiber and 1 Gigabit Ethernet over copper","imgs":[]},{"t":"implements a process to delimit fields within an Ethernet 2 frame","imgs":[]},{"t":"places information in the Ethernet frame that identifies which network layer protocol is being encapsulated by the frame","imgs":[]}],"ans":[1,4],"sources":["Practice Final (58)","Final Exam (161)"],"module":null,"id":292},{"type":"single","q":"What service is provided by POP3?","imgs":[],"exp":"","topic":"","opts":[{"t":"Retrieves email from the server by downloading the email to the local mail application of the client.","imgs":[]},{"t":"An application that allows real-time chatting among remote users.","imgs":[]},{"t":"Allows remote access to network devices and servers.","imgs":[]},{"t":"Uses encryption to provide secure remote access to network devices and servers.","imgs":[]}],"ans":[0],"sources":["Practice Final (58)","Final Exam (161)"],"module":null,"id":293},{"type":"single","q":"What characteristic describes spyware?","imgs":[],"exp":"","topic":"","opts":[{"t":"a network device that filters access and traffic coming into a network","imgs":[]},{"t":"software that is installed on a user device and collects information about the user","imgs":[]},{"t":"an attack that slows or crashes a device or network service","imgs":[]},{"t":"the use of stolen credentials to access private data","imgs":[]}],"ans":[1],"sources":["Practice Final (58)","Final Exam (161)"],"module":null,"id":294},{"type":"single","q":"A client packet is received by a server. The packet has a destination port number of 22. What service is the client requesting?","imgs":[],"exp":"","topic":"","opts":[{"t":"SSH","imgs":[]},{"t":"TFTP","imgs":[]},{"t":"DHCP","imgs":[]},{"t":"DNS","imgs":[]}],"ans":[0],"sources":["Practice Final (58)"],"module":null,"id":295},{"type":"single","q":"Refer to the exhibit. What does the value of the window size specify?","imgs":["https://it ata link layer?","imgs":[],"exp":"","topic":"","opts":[{"t":"It generates the electrical or optical signals that represent the 1 and 0 on the media.","imgs":[]},{"t":"It converts a stream of data bits into a predefined code.","imgs":[]},{"t":"It shields the upper layer protocol from being aware of the physical medium to be used in the communication.","imgs":[]},{"t":"It accepts Layer 3 packets and decides the path by which to forward the packet to a remote network.","imgs":[]}],"ans":[2],"sources":["Final Exam (161)"],"module":null,"id":348},{"type":"multiple","q":"What are three characteristics of the CSMA/CD process? (Choose three.)","imgs":[],"exp":"","topic":"","opts":[{"t":"The device with the electronic token is the only one that can transmit after a collision.","imgs":[]},{"t":"A device listens and waits until the media is not busy before transmitting.","imgs":[]},{"t":"After detecting a collision, hosts can attempt to resume transmission after a random time delay has expired.","imgs":[]},{"t":"All of the devices on a segment see data that passes on the network medium.","imgs":[]},{"t":"A jam signal indicates that the collision has cleared and the media is not busy.","imgs":[]},{"t":"Devices can be configured with a higher transmission priority.","imgs":[]}],"ans":[1,2,3],"sources":["Final Exam (161)"],"module":null,"id":349},{"type":"multiple","q":"What are two primary responsibilities of the Ethernet MAC sublayer? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"error detection","imgs":[]},{"t":"frame delimiting","imgs":[]},{"t":"accessing the media","imgs":[]},{"t":"data encapsulation","imgs":[]},{"t":"logical addressing","imgs":[]}],"ans":[2,3],"sources":["Final Exam (161)"],"module":null,"id":350},{"type":"multiple","q":"Which two commands can be used on a Windows host to display the routing table? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"netstat -s","imgs":[]},{"t":"route print","imgs":[]},{"t":"show ip route","imgs":[]},{"t" tion address = 00-00-0c-94-36-ab\nLayer 2 source address = 00-00-0c-94-36-bb\nLayer 3 destination address = 172.16.20.200\nLayer 3 source address = 172.16.10.200","imgs":[]},{"t":"Layer 2 destination address = 00-00-0c-94-36-dd\nLayer 2 source address = 00-00-0c-94-36-bb\nLayer 3 destination address = 172.16.20.200\nLayer 3 source address = 172.16.10.200","imgs":[]},{"t":"Layer 2 destination address = 00-00-0c-94-36-cd\nLayer 2 source address = 00-00-0c-94-36-bb\nLayer 3 destination address = 172.16.20.99\nLayer 3 source address = 172.16.10.200","imgs":[]},{"t":"Layer 2 destination address = 00-00-0c-94-36-ab\nLayer 2 source address = 00-00-0c-94-36-bb\nLayer 3 destination address = 172.16.20.200\nLayer 3 source address = 172.16.100.200","imgs":[]}],"ans":[0],"sources":["Final Exam (161)"],"module":null,"id":372},{"type":"multiple","q":"Which two protocols operate at the top layer of the TCP/IP protocol suite? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"TCP","imgs":[]},{"t":"IP","imgs":[]},{"t":"UDP","imgs":[]},{"t":"POP","imgs":[]},{"t":"DNS","imgs":[]},{"t":"Ethernet","imgs":[]}],"ans":[3,4],"sources":["Final Exam (161)"],"module":null,"id":373},{"type":"single","q":"A company has a file server that shares a folder named Public. The network security policy specifies that the Public folder is assigned Read-Only rights to anyone who can log into the server while the Edit rights are assigned only to the network admin group. Which component is addressed in the AAA network service framework?","imgs":[],"exp":"","topic":"","opts":[{"t":"automation","imgs":[]},{"t":"accounting","imgs":[]},{"t":"authentication","imgs":[]},{"t":"authorization","imgs":[]}],"ans":[3],"sources":["Final Exam (161)"],"module":null,"id":374},{"type":"multiple","q":"What three requirements are defined by the protocols used in network communcations to allow message transmission across a network? (Choose three.)","imgs":[],"exp":"","topic":"","opts":[{"t":"message size","imgs":[]},{"t":"message encoding","imgs":[]},{"t":"connector specifications","imgs":[]},{"t":"media selection","imgs":[]},{"t":"delivery options","imgs":[]},{"t":"end-device installation","imgs":[]}],"ans":[0,1,4],"sources":["Final Exam (161)"],"module":null,"id":375},{"type":"multiple","q":"What are two characteristics of IP? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"does not require a dedicated end-to-end connection","imgs":[]},{"t":"operates independently of the network media","imgs":[]},{"t":"retransmits packets if errors occur","imgs":[]},{"t":"re-assembles out of order packets into the correct order at the receiver end","imgs":[]},{"t":"guarantees delivery of packets","imgs":[]}],"ans":[0,1],"sources":["Final Exam (161)"],"module":null,"id":376},{"type":"multiple","q":"An employee of a large corporation remotely logs into the company using the appropriate username and password. The employee is attending an important video conference with a customer concerning a large sale. It is important for the video quality to be excellent during the meeting. The employee is unaware that after a successful login, the connection to the company ISP failed. The secondary connection, however, activated within seconds. The disruption was not noticed by the employee or other employees.\nWhat three network characteristics are described in this scenario? (Choose three.)","imgs":[],"exp":"","topic":"","opts":[{"t":"security","imgs":[]},{"t":"quality of service","imgs":[]},{"t":"scalability","imgs":[]},{"t":"powerline networking","imgs":[]},{"t":"integrity","imgs":[]},{"t":"fault tolerance","imgs":[]}],"ans":[0,1,5],"sources":["Final Exam (161)"],"module":null,"id":377},{"type":"multiple","q":"What are two common causes of signal degradation when using UTP cabling? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"improper termination","imgs":[]},{"t":"low-quality shielding in cable","imgs":[]},{"t":"installing cables in conduit","imgs":[]},{"t":"low-quality cable or connectors","imgs":[]},{"t":"loss of light over long distances","imgs":[]}],"ans":[0,3],"sources":["Final Exam (161)"],"module":null,"id":378},{"type":"multiple","q":"Refer to the exhibit. On the basis of the output, which two statements about network connectivity are correct? (Choose two.)","imgs":["https://itexamanswers.net/wp-content/uploads/2020/01/i275429v1n1_chapter-9-WAN-images2.jpg"],"exp":"","topic":"","opts":[{"t":"This host does not have a default gateway configured.","imgs":[]},{"t":"There are 4 hops between this device and the device at 192.168.100.1.","imgs":[]},{"t":"There is connectivity between this device and the device at 192.168.100.1.","imgs":[]},{"t":"The connectivity between these two hosts allows for videoconferencing calls.","imgs":[]},{"t":"The average transmission time between the two hosts is 2 milliseconds.","imgs":[]}],"ans":[1,2],"sources":["Final Exam (161)"],"module":null,"id":379},{"type":"multiple","q":"Which two statements describe how to assess traffic flow patterns and network traffic types using a protocol analyzer? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"Capture traffic on the weekends when most employees are off work.","imgs":[]},{"t":"Capture traffic during peak utilization times to get a good representation of the different traffic types.","imgs":[]},{"t":"Only capture traffic in the areas of the network that receive most of the traffic such as the data center.","imgs":[]},{"t":"Perform the capture on different network segments.","imgs":[]},{"t":"Only capture WAN traffic because traffic to the web is responsible for the largest amount of traffic on a network.","imgs":[]}],"ans":[1,3],"sources":["Final Exam (161)"],"module":null,"id":380},{"type":"single","q":"What is the consequence of configuring a router with the ipv6 unicast-routing global configuration command?","imgs":[],"exp":"","topic":"","opts":[{"t":"All router interfaces will be automatically activated.","imgs":[]},{"t":"The IPv6 enabled router interfaces begin sending ICMPv6 Router Advertisement messages.","imgs":[]},{"t":"Each router interface will generate an IPv6 link-local address.","imgs":[]},{"t":"It statically creates a global unicast address on this router.","imgs":[]}],"ans":[1],"sources":["Final Exam (161)"],"module":null,"id":381},{"type":"multiple","q":"Which three layers of the OSI model map to the application layer of the TCP/IP model? (Choose three.)","imgs":[],"exp":"","topic":"","opts":[{"t":"application","imgs":[]},{"t":"network","imgs":[]},{"t":"data link","imgs":[]},{"t":"session","imgs":[]},{"t":"presentation","imgs":[]},{"t":"transport","imgs":[]}],"ans":[0,3,4],"sources":["Final Exam (161)"],"module":null,"id":382},{"type":"single","q":"Refer to the exhibit. If PC1 is sending a packet to PC2 and routing has been configured between the two routers, what will R1 do with the Ethernet frame header attached by PC1?","imgs":["https://itexamanswers.net/wp-content/uploads/2020/01/i271152v1n1_271152.png"],"exp":"","topic":"","opts":[{"t":"nothing, because the router has a route to the destination network","imgs":[]},{"t":"open the header and use it to determine whether the data is to be sent out S0/0/0","imgs":[]},{"t":"open the header and replace the destination MAC address with a new one","imgs":[]},{"t":"remove the Ethernet header and configure a new Layer 2 header before sending it out S0/0/0","imgs":[]}],"ans":[3],"sources":["Final Exam (161)"],"module":null,"id":383},{"type":"multiple","q":"What are two features of ARP? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"When a host is encapsulating a packet into a frame, it refers to the MAC address table to determine the mapping of IP addresses to MAC addresses.","imgs":[]},{"t":"An ARP request is sent to all devices on the Ethernet LAN and contains the IP address of the destination host and its multicast MAC address.","imgs":[]},{"t":"If a host is ready to send a packet to a local destination device and it has the IP address but not the MAC address of the destination, it generates an ARP broadcast.","imgs":[]},{"t":"If no device responds to the ARP request, then the originating node will broadcast the data packet to all devices on the network segment.","imgs":[]},{"t":"If a device receiving an ARP request has the destination IPv4 address, it responds with an ARP reply.","imgs":[]}],"ans":[2,4],"sources":["Final Exam (161)"],"module":null,"id":384},{"type":"single","q":"A network administrator is adding a new LAN to a branch office. The new LAN must support 90 connected devices. What is the smallest network mask that the network administrator can use for the new network?","imgs":[],"exp":"","topic":"","opts":[{"t":"255.255.255.128","imgs":[]},{"t":"255.255.255.240","imgs":[]},{"t":"255.255.255.248","imgs":[]},{"t":"255.255.255.224","imgs":[]}],"ans":[0],"sources":["Final Exam (161)"],"module":null,"id":385},{"type":"multiple","q":"What are two ICMPv6 messages that are not present in ICMP for IPv4? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"Neighbor Solicitation","imgs":[]},{"t":"Destination Unreachable","imgs":[]},{"t":"Host Confirmation","imgs":[]},{"t":"Time Exceeded","imgs":[]},{"t":"Router Advertisement","imgs":[]},{"t":"Route Redirection","imgs":[]}],"ans":[0,4],"sources":["Final Exam (161)"],"module":null,"id":386},{"type":"single","q":"A client packet is received by a server. The packet has a destination port number of 80. What service is the client requesting?","imgs":[],"exp":"","topic":"","opts":[{"t":"DHCP","imgs":[]},{"t":"SMTP","imgs":[]},{"t":"DNS","imgs":[]},{"t":"HTTP","imgs":[]}],"ans":[3],"sources":["Final Exam (161)"],"module":null,"id":387},{"type":"single","q":"What is an advantage for small organizations of adopting IMAP instead of POP?","imgs":[],"exp":"","topic":"","opts":[{"t":"POP only allows the client to store messages in a centralized way, while IMAP allows distributed storage.","imgs":[]},{"t":"Messages are kept in the mail servers until they are manually deleted from the email client.","imgs":[]},{"t":"When the user connects to a POP server, copies of the messages are kept in the mail server for a short time, but IMAP keeps them for a long time.","imgs":[]},{"t":"IMAP sends and retrieves email, but POP only retrieves email.","imgs":[]}],"ans":[1],"sources":["Final Exam (161)"],"module":null,"id":388},{"type":"single","q":"A technician can ping the IP address of the web server of a remote company but cannot successfully ping the URL address of the same web server. Which software utility can the technician use to diagnose the problem?","imgs":[],"exp":"","topic":"","opts":[{"t":"tracert","imgs":[]},{"t":"ipconfig","imgs":[]},{"t":"netstat","imgs":[]},{"t":"nslookup","imgs":[]}],"ans":[3],"sources":["Final Exam (161)"],"module":null,"id":389},{"type":"single","q":"Match the type of threat with the cause. (Not all options are used.)","imgs":[],"exp":"","topic":"","opts":[{"t":"","imgs":["https://itexamanswers.net/wp-content/uploads/2020/01/2021-11-13_112035.jpg"]}],"ans":[0],"sources":["Final Exam (161)"],"module":null,"id":390},{"type":"single","q":"A disgruntled employee is using some free wireless networking tools to determine information about the enterprise wireless networks. This person is planning on using this information to hack the wireless network. What type of attack is this?","imgs":[],"exp":"","topic":"","opts":[{"t":"DoS","imgs":[]},{"t":"access","imgs":[]},{"t":"reconnaissance","imgs":[]},{"t":"Trojan horse","imgs":[]}],"ans":[2],"sources":["Final Exam (161)"],"module":null,"id":391},{"type":"single","q":"What service is provided by HTTP?","imgs":[],"exp":"","topic":"","opts":[{"t":"Uses encryption to secure the exchange of text, graphic images, sound, and video on the web.","imgs":[]},{"t":"Allows for data transfers between a client and a file server.","imgs":[]},{"t":"An application that allows real-time chatting among remote users.","imgs":[]},{"t":"A basic set of rules for exchanging text, graphic images, sound, video, and other multimedia files on the web.","imgs":[]}],"ans":[3],"sources":["Final Exam (161)"],"module":null,"id":392},{"type":"single","q":"A client packet is received by a server. The packet has a destination port number of 67. What service is the client requesting?","imgs":[],"exp":"","topic":"","opts":[{"t":"FTP","imgs":[]},{"t":"DHCP","imgs":[]},{"t":"Telnet","imgs":[]},{"t":"SSH","imgs":[]}],"ans":[1],"sources":["Final Exam (161)"],"module":null,"id":393},{"type":"multiple","q":"What are two problems that can be caused by a large number of ARP request and reply messages? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"Switches become overloaded because they concentrate all the traffic from the attached subnets.","imgs":[]},{"t":"The ARP request is sent as a broadcast, and will flood the entire subnet.","imgs":[]},{"t":"The network may become overloaded because ARP reply messages have a very large payload due to the 48-bit MAC address and 32-bit IP address that they contain.","imgs":[]},{"t":"A large number of ARP request and reply messages may slow down the switching process, leading the switch to make many changes in its MAC table.","imgs":[]},{"t":"All ARP request messages must be processed by all nodes on the local network.","imgs":[]}],"ans":[1,4],"sources":["Final Exam (161)"],"module":null,"id":394},{"type":"multiple","q":"A group of Windows PCs in a new subnet has been added to an Ethernet network. When testing the connectivity, a technician finds that these PCs can access local network resources but not the Internet resources. To troubleshoot the problem, the technician wants to initially confirm the IP address and DNS configurations on the PCs, and also verify connectivity to the local router. Which three Windows CLI commands and utilities will provide the necessary information? (Choose three.)","imgs":[],"exp":"","topic":"","opts":[{"t":"netsh interface ipv6 show neighbor","imgs":[]},{"t":"arp -a","imgs":[]},{"t":"tracert","imgs":[]},{"t":"ping","imgs":[]},{"t":"ipconfig","imgs":[]},{"t":"nslookup","imgs":[]},{"t":"telnet","imgs":[]}],"ans":[3,4,5],"sources":["Final Exam (161)"],"module":null,"id":395},{"type":"single","q":"During the process of forwarding traffic, what will the router do immediately after matching the destination IP address to a network on a directly connected routing table entry?","imgs":[],"exp":"","topic":"","opts":[{"t":"analyze the destination IP address","imgs":[]},{"t":"switch the packet to the directly connected interface","imgs":[]},{"t":"look up the next-hop address for the packet","imgs":[]},{"t":"discard the traffic after consulting the route table","imgs":[]}],"ans":[1],"sources":["Final Exam (161)"],"module":null,"id":396},{"type":"single","q":"What characteristic describes antispyware?","imgs":[],"exp":"","topic":"","opts":[{"t":"applications that protect end devices from becoming infected with malicious software","imgs":[]},{"t":"a network device that filters access and traffic coming into a network","imgs":[]},{"t":"software on a router that filters traffic based on IP addresses or applications","imgs":[]},{"t":"a tunneling protocol that provides remote users with secure access into the network of an organization","imgs":[]}],"ans":[0],"sources":["Final Exam (161)"],"module":null,"id":397},{"type":"single","q":"A network administrator needs to keep the user ID, password, and session contents private when establishing remote CLI connectivity with a switch to manage it. Which access method should be chosen?","imgs":[],"exp":"","topic":"","opts":[{"t":"Telnet","imgs":[]},{"t":"AUX","imgs":[]},{"t":"SSH","imgs":[]},{"t":"Console","imgs":[]}],"ans":[2],"sources":["Final Exam (161)"],"module":null,"id":398},{"type":"multiple","q":"What are the two most effective ways to defend against malware? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"Implement a VPN.","imgs":[]},{"t":"Implement network firewalls.","imgs":[]},{"t":"Implement RAID.","imgs":[]},{"t":"Implement strong passwords.","imgs":[]},{"t":"Update the operating system and other application software.","imgs":[]},{"t":"Install and update antivirus software.","imgs":[]}],"ans":[4,5],"sources":["Final Exam (161)"],"module":null,"id":399},{"type":"single","q":"Which type of security threat would be responsible if a spreadsheet add-on disables the local software firewall?","imgs":[],"exp":"","topic":"","opts":[{"t":"brute-force attack","imgs":[]},{"t":"Trojan horse","imgs":[]},{"t":"DoS","imgs":[]},{"t":"buffer overflow","imgs":[]}],"ans":[1],"sources":["Final Exam (161)"],"module":null,"id":400},{"type":"single","q":"Which frame field is created by a source node and used by a destination node to ensure that a transmitted data signal has not been altered by interference, distortion, or signal loss?","imgs":[],"exp":"","topic":"","opts":[{"t":"User Datagram Protocol field","imgs":[]},{"t":"transport layer error check field","imgs":[]},{"t":"flow control field","imgs":[]},{"t":"frame check sequence field","imgs":[]},{"t":"error correction process field","imgs":[]}],"ans":[3],"sources":["Final Exam (161)"],"module":null,"id":401},{"type":"single","q":"A network administrator is adding a new LAN to a branch office. The new LAN must support 4 connected devices. What is the smallest network mask that the network administrator can use for the new network?","imgs":[],"exp":"","topic":"","opts":[{"t":"255.255.255.248","imgs":[]},{"t":"255.255.255.0","imgs":[]},{"t":"255.255.255.128","imgs":[]},{"t":"255.255.255.192","imgs":[]}],"ans":[0],"sources":["Final Exam (161)"],"module":null,"id":402},{"type":"multiple","q":"What two security solutions are most likely to be used only in a corporate environment? (Choose two.)","imgs":[],"exp":"","topic":"","opts":[{"t":"antispyware","imgs":[]},{"t":"virtual private networks","imgs":[]},{"t":"intrusion prevention systems","imgs":[]},{"t":"strong passwords","imgs":[]},{"t":"antivirus software","imgs":[]}],"ans":[1,2],"sources":["Final Exam (161)"],"module":null,"id":403},{"type":"single","q":"What characteristic describes antivirus software?","imgs":[],"exp":"","topic":"","opts":[{"t":"applications that protect end devices from becoming infected with malicious software","imgs":[]},{"t":"a network device that filters access and traffic coming into a network","imgs":[]},{"t":"a tunneling protocol that provides remote users with secure access into the network of an organization","imgs":[]},{"t":"software on a router that filters traffic based on IP addresses or applications","imgs":[]}],"ans":[0],"sources":["Final Exam (161)"],"module":null,"id":404},{"type":"single","q":"What mechanism is used by a router to prevent a received IPv4 packet from traveling endlessly on a network?","imgs":[],"exp":"","topic":"","opts":[{"t":"It checks the value of the TTL field and if it is 0, it discards the packet and sends a Destination Unreachable message to the source host.","imgs":[]},{"t":"It checks the value of the TTL field and if it is 100, it discards the packet and sends a Destination Unreachable message to the source host.","imgs":[]},{"t":"It decrements the value of the TTL field by 1 and if the result is 0, it discards the packet and sends a Time Exceeded message to the source host.","imgs":[]},{"t":"It increments the value of the TTL field by 1 and if the result is 100, it discards the packet and sends a Parameter Problem message to the source host.","imgs":[]}],"ans":[2],"sources":["Final Exam (161)"],"module":null,"id":405},{"type":"single","q":"A client packet is received by a server. The packet has a destination port number of 69. What service is the client requesting?","imgs":[],"exp":"","topic":"","opts":[{"t":"DNS","imgs":[]},{"t":"DHCP","imgs":[]},{"t":"SMTP","imgs":[]},{"t":"TFTP","imgs":[]}],"ans":[3],"sources":["Final Exam (161)"],"module":null,"id":406},{"type":"multiple","q":"An administrator defined a local user account with a secret password on router R1 for use w const SRC_LABEL={
 'Module 1-3':'Modul 1–3 Test','Module 4-7':'Modul 4–7 Test','Module 8-10':'Modul 8–10 Test',
 'Module 11-13':'Modul 11–13 Test','Practice Final (58)':'Practice Final','Final Exam (161)':'Final Exam'};
const SRC_ORDER=Object.keys(SRC_LABEL);
const LS='ccna1-fragentrainer-v1';
let store={res:{},flag:{},theme:''};
try{const s=JSON.parse(localStorage.getItem(LS));if(s)store=Object.assign(store,s)}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const byId={};DATA.forEach(q=>byId[q.id]=q);
const S={mode:'learn',list:[],i:0,sel:{},checked:{},review:false,exam:null,srcs:new Set(SRC_ORDER)};

/* ---------- Hilfsfunktionen ---------- */
function fmt(t){ // Code-Zeilen (CLI) erkennen und als Block darstellen
  const lines=String(t).split('\n');let out='',buf=[];
  const isCode=l=>/^\s*(R\d|S\d|PC\d?|Router|Switch|SW\d?|Host|C:\\|[A-Za-z0-9_-]+(\([a-z-]+\))?[#>])/.test(l)&&/[#>]/.test(l.slice(0,40));
  const flush=()=>{if(buf.length){out+='<span class="code">'+esc(buf.join('\n'))+'</span>';buf=[]}};
  lines.forEach(l=>{if(isCode(l))buf.push(l);else{flush();out+=esc(l)+'\n'}});
  flush();return out.replace(/\n$/,'');
}
function correct(q,sel){
  if(q.type==='single'||q.type==='multiple'){
    const a=q.ans.slice().sort().join(),b=(sel||[]).slice().sort().join();return a===b&&b!=='';
  }
  if(q.type==='matrix_sort_answer'){return !!sel&&q.rows.every((_,i)=>sel[i]>=0&&q.items[sel[i]]===q.items[q.ans[i]])}
  if(q.type==='fill'){const n=s=>String(s||'').toLowerCase().replace(/\s+/g,'');return n(sel)!==''&&q.ans.some(a=>n(a)===n(sel))}
  return null;
}
function hasAnswer(q,sel){
  if(!sel)return false;
  if(q.type==='matrix_sort_answer')return sel.some(x=>x>=0);
  return sel.length>0;
}
function filtered(){
  const m=$('fmod').value,t=$('ftype').value,st=$('fstat').value,qs=$('fq').value.trim().toLowerCase();
  let L=DATA.filter(q=>{
    if(!q.sources.some(s=>S.srcs.has(s)))return false;
    if(m==='none'){if(q.module!=null)return false}else if(m!=='all'&&q.module!==+m)return false;
    if(t==='other'){if(q.type==='single'||q.type==='multiple')return false}else if(t!=='all'&&q.type!==t)return false;
    const r=store.res[q.id];
    if(st==='new'&&r!==undefined)return false;
    if(st==='bad'&&r!==false)return false;
    if(st==='ok'&&r!==true)return false;
    if(st==='flag'&&!store.flag[q.id])return false;
    if(qs){
      const hay=(q.q+' '+(q.opts||[]).map(o=>o.t).join(' ')+' '+(q.rows||[]).join(' ')+' '+(q.items||[]).join(' ')+' '+q.exp).toLowerCase();
      if(!hay.includes(qs))return false;
    }
    return true;
  });
  if($('fshuf').checked){for(let i=L.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[L[i],L[j]]=[L[j],L[i]]}}
  return L;
}

/* ---------- Seitenleiste ---------- */
function initSide(){
  $('totals').textContent=DATA.length+' eindeutige Fragen aus 6 Prüfungen (Duplikate zusammengeführt)';
  $('srcs').innerHTML=SRC_ORDER.map(s=>{
    const n=DATA.filter(q=>q.sources.includes(s)).length;
    return `<label class="chk"><input type="checkbox" data-src="${esc(s)}" checked><span>${SRC_LABEL[s]} <small>(${n})</small></span></label>`}).join('');
  const mods=[...new Set(DATA.map(q=>q.module).filter(x=>x!=null))].sort((a,b)=>a-b);
  $('fmod').innerHTML='<option value="all">Alle Module</option>'+mods.map(m=>`<option value="${m}">Modul ${m}</option>`).join('')+'<option value="none">Ohne Modulzuordnung (Final-Fragen)</option>';
  $('srcs').addEventListener('change',e=>{
    const s=e.target.dataset.src;if(!s)return;
    e.target.checked?S.srcs.add(s):S.srcs.delete(s);rebuild();});
  ['fmod','ftype','fstat','fshuf'].forEach(id=>$(id).addEventListener('change',rebuild));
  $('fq').addEventListener('input',()=>{clearTimeout(initSide.t);initSide.t=setTimeout(rebuild,200)});
  $('reset').onclick=()=>{if(confirm('Gesamten Lernfortschritt und alle Markierungen löschen?')){store.res={};store.flag={};save();rebuild()}};
  $('theme').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
    const n=cur==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',n);store.theme=n;save()};
  if(store.theme)document.documentElement.setAttribute('data-theme',store.theme);
  $('mt').onclick=()=>{const o=$('side').classList.toggle('open');$('mt').setAttribute('aria-expanded',o)};
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
}
function sideStats(){
  const L=(S.mode==='learn'||S.mode==='cards')?S.list:[];
  const done=L.filter(q=>store.res[q.id]!==undefined).length,ok=L.filter(q=>store.res[q.id]===true).length;
  $('pstat').innerHTML=(S.mode==='learn'||S.mode==='cards')?`In der Auswahl: <b>${L.length}</b> Fragen · beantwortet <b>${done}</b> · zuletzt richtig <b>${ok}</b>`:'';
}

/* ---------- Modi ---------- */
function setMode(m){
  S.mode=m;S.review=false;S.exam=null;S.flip=false;clearInterval(timer);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
  $('examBar').style.display='none';
  if(m==='exam'){showExamSetup()}else rebuild();
  window.scrollTo({top:0});
}
function rebuild(){
  if(S.mode==='cards'){S.list=filtered();S.i=0;S.flip=false;renderCards();sideStats();return}
  if(S.mode==='stats'){renderStats();return}
  if(S.mode==='sheet'){renderSheet();return}
  if(S.mode==='calc'){renderCalc();return}
  if(S.mode==='exam'&&!S.review&&S.exam===null){showExamSetup();return}
  if(S.mode==='learn'){S.list=filtered();S.i=0;S.sel={};S.checked={};}
  renderAll();
}
function showExamSetup(){
  S.list=[];$('ports').style.display='none';$('examBar').style.display='none';
  const pool=filtered().filter(q=>q.type!=='image');
  $('view').innerHTML=`<div class="card"><h2 style="margin-top:0">Prüfungssimulation</h2>
   <p>Zufällige Fragen aus der aktuellen Filter-Auswahl (<b>${pool.length}</b> passende Fragen, ohne reine Bildfragen). Während der Prüfung gibt es keine Rückmeldung – die Auswertung folgt am Ende.</p>
   <div class="row"><label for="ecount">Anzahl der Fragen</label>
   <select id="ecount" style="width:auto">${[20,40,60,100].filter(n=>n<=pool.length).concat(pool.length&&![20,40,60,100].includes(pool.length)&&pool.length<100?[pool.length]:[]).map(n=>`<option>${n}</option>`).join('')}</select>
   <button class="btn primary" id="estart" ${pool.length?'':'disabled'}>Prüfung starten</button></div></div>`;
  const b=$('estart');if(b)b.onclick=()=>{
    const n=+$('ecount').value;const p=pool.slice().sort(()=>Math.random()-.5).slice(0,n);
    S.list=p;S.i=0;S.sel={};S.checked={};S.review=false;S.exam={start:Date.now(),done:false};
    $('ports').style.display='';renderAll();tick();};
}
let timer=null;
function tick(){
  clearInterval(timer);
  const upd=()=>{
    if(!S.exam||S.exam.done){clearInterval(timer);return}
    const s=Math.floor((Date.now()-S.exam.start)/1000),m=Math.floor(s/60);
    const answered=S.list.filter(q=>hasAnswer(q,S.sel[q.id])).length;
    $('examBar').innerHTML=`<span class="tag">Zeit ${m}:${String(s%60).padStart(2,'0')}</span><span class="tag">${answered} / ${S.list.length} beantwortet</span><button class="btn primary" id="efin">Prüfung abgeben</button>`;
    $('efin').onclick=finishExam;
  };
  $('examBar').style.display='flex';upd();timer=setInterval(upd,1000);
}
function finishExam(){
  const un=S.list.filter(q=>!hasAnswer(q,S.sel[q.id])).length;
  if(un&&!confirm(un+' Frage(n) sind unbeantwortet und zählen als falsch. Trotzdem abgeben?'))return;
  S.exam.done=true;clearInterval(timer);
  let ok=0;S.list.forEach(q=>{const c=!!correct(q,S.sel[q.id]);store.res[q.id]=c;if(c)ok++});
  save();
  const pct=Math.round(ok/S.list.length*100),secs=Math.floor((Date.now()-S.exam.start)/1000);
  const wrong=S.list.filter(q=>!correct(q,S.sel[q.id]));
  $('examBar').style.display='none';$('ports').style.display='none';
  $('view').innerHTML=`<div class="card result"><div class="big">${pct} %</div>
   <p>${ok} von ${S.list.length} richtig · Dauer ${Math.floor(secs/60)} min ${secs%60} s</p>
   <div class="row" style="justify-content:center">
    <button class="btn primary" id="rev" ${wrong.length?'':'disabled'}>${wrong.length} falsche Fragen ansehen</button>
    <button class="btn" id="again">Neue Prüfung</button></div></div>`;
  $('rev').onclick=()=>{S.review=true;S.list=wrong;S.i=0;S.list.forEach(q=>S.checked[q.id]=true);$('ports').style.display='';renderAll()};
  $('again').onclick=()=>{S.exam=null;showExamSetup()};
}

/* ---------- Rendering ---------- */
function renderAll(){renderPorts();renderCard();sideStats()}
function renderPorts(){
  const el=$('ports');
  if(!S.list.length){el.style.display='none';return}
  el.style.display='';
  el.innerHTML=S.list.map((q,i)=>{
    let c='';
    if(S.mode==='exam'&&!S.review&&S.exam){if(hasAnswer(q,S.sel[q.id]))c='ans'}
    else{const r=store.res[q.id];if(r===true)c='ok';else if(r===false)c='bad'}
    if(store.flag[q.id])c+=' flag';
    if(i===S.i)c+=' cur';
    return `<button class="${c}" data-i="${i}" aria-label="Frage ${i+1}" title="Frage ${i+1}"></button>`}).join('');
  el.onclick=e=>{const b=e.target.closest('button');if(b){S.i=+b.dataset.i;renderAll()}};
}
function imgTag(src){return `<img src="${esc(src)}" alt="Abbildung zur Frage" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\\'imgfail\\'>Bild konnte nicht geladen werden (offline?). Quelle: ${esc(src)}</div>'">`}
function renderCard(){
  const v=$('view');
  if(!S.list.length){v.innerHTML='<div class="card empty">Keine Fragen für diese Filter-Auswahl. Passe die Filter links an.</div>';return}
  const q=S.list[S.i],chk=!!S.checked[q.id],exam=S.mode==='exam'&&!S.review&&S.exam;
  const sel=S.sel[q.id];
  const srcs=q.sources.map(s=>SRC_LABEL[s]).join(', ');
  let h=`<div class="card"><div class="meta"><span><b>Frage ${S.i+1}</b> von ${S.list.length}</span>
   <span class="tag">${srcs}</span>${q.module!=null?`<span class="tag">Modul ${q.module}</span>`:''}${q.topic?`<span class="tag">Thema ${esc(q.topic)}</span>`:''}
   <span class="tag">${q.type==='multiple'?'Mehrfachauswahl':q.type==='single'?'Einzelauswahl':q.type==='matrix_sort_answer'?'Zuordnung (Drag &amp; Drop)':q.type==='fill'?'Kurzantwort':'Bildfrage'}</span></div>
   <p class="qtext">${fmt(q.q)}</p>`;
  const qi=q.type==='image'?q.imgs.slice(0,1):q.imgs;
  if(qi.length)h+=`<div class="imgs">${qi.map(imgTag).join('')}</div>`;
  if(q.type==='single'||q.type==='multiple'){
    h+=`<div class="opts ${q.type==='multiple'?'multi':''}" role="${q.type==='multiple'?'group':'radiogroup'}">`;
    q.opts.forEach((o,k)=>{
      const on=(sel||[]).includes(k),isA=q.ans.includes(k);
      let c='opt';
      if(chk){if(isA)c+=' right'+(on?'':' missed');else if(on)c+=' wrong'}else if(on)c+=' sel';
      const mark=chk?(isA?'✓':(on?'✗':'')):(on?'✓':'');
      h+=`<button class="${c}" data-o="${k}" ${chk?'disabled':''} aria-pressed="${on}"><span class="box" aria-hidden="true">${mark}</span><span class="t">${fmt(o.t)}${o.imgs.map(imgTag).join('')}</span></button>`});
    h+='</div>';
  }else if(q.type==='matrix_sort_answer'){
    h+=ddHtml(q,sel,chk);
  }else if(q.type==='fill'){
    h+=`<div class="row"><input id="fillin" value="${esc(sel||'')}" ${chk?'disabled':''} placeholder="Antwort eingeben" aria-label="Antwort" style="max-width:260px">${chk?`<span class="verdict ${correct(q,sel)?'ok':'bad'}" style="margin:0">Richtig: ${esc(q.ans[0])}</span>`:''}</div>`;
  }else{ // image
    if(chk){
      const extra=q.imgs.slice(1).concat(q.exp_imgs||[]);
      if(extra.length)h+=`<p><b>Lösung (Bild aus der Quelle):</b></p><div class="imgs">${extra.map(imgTag).join('')}</div>`;
      else h+='<p class="exp"><b>Hinweis</b>Bei dieser Zuordnungsfrage enthält die Abbildung der Quelle bereits die Lösung.</p>';
    }
  }
  if(chk){
    if(q.type==='image'){
      const r=store.res[q.id];
    }else{
      const ok=correct(q,sel);
      h+=`<div class="verdict ${ok?'ok':'bad'}" role="status">${ok?'✓ Richtig':'✗ Leider falsch'}${(!ok&&q.type==='multiple')?' – alle richtigen Antworten sind grün markiert (gestrichelt = von dir übersehen).':''}</div>`;
    }
    if(q.aimgs&&q.aimgs.length)h+=`<details class="exp"><summary>Originalbild der Quelle anzeigen</summary><div class="imgs" style="margin-top:8px">${q.aimgs.map(imgTag).join('')}</div></details>`;
    if(q.exp)h+=`<div class="exp"><b>Erklärung${q.topic?' (Thema '+esc(q.topic)+')':''}</b>${esc(q.exp)}</div>`;
  }
  h+='<div class="nav">';
  h+=`<button class="btn" id="prev" ${S.i===0?'disabled':''}>Zurück</button>`;
  if(!chk&&!exam&&q.type==='image')h+='<button class="btn primary" id="check">Lösung zeigen</button>';
  else if(!chk&&!exam)h+=`<button class="btn primary" id="check" ${hasAnswer(q,sel)?'':'disabled'}>Antwort prüfen</button>`;
  if(chk&&q.type==='image'&&!exam)h+='<button class="btn" id="knew">Gewusst</button><button class="btn" id="didnt">Nicht gewusst</button>';
  h+=`<button class="btn" id="next" ${S.i===S.list.length-1?'disabled':''}>Weiter</button><span class="sp"></span>
   <button class="btn ghost flagbtn" id="flag" aria-pressed="${!!store.flag[q.id]}">${store.flag[q.id]?'★ Markiert':'☆ Markieren'}</button></div></div>`;
  v.innerHTML=h;
  bindCard(q,exam);
}
function bindCard(q,exam){
  const go=d=>{S.i=Math.max(0,Math.min(S.list.length-1,S.i+d));renderAll();window.scrollTo({top:0})};
  $('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
  $('flag').onclick=()=>{store.flag[q.id]?delete store.flag[q.id]:store.flag[q.id]=1;save();renderAll()};
  const c=$('check');if(c)c.onclick=()=>doCheck(q);
  const kn=$('knew');if(kn){kn.onclick=()=>{store.res[q.id]=true;save();go(1)};$('didnt').onclick=()=>{store.res[q.id]=false;save();go(1)}}
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    if(S.checked[q.id])return;const k=+b.dataset.o;let s=S.sel[q.id]||[];
    if(q.type==='single')s=[k];else s=s.includes(k)?s.filter(x=>x!==k):s.concat(k);
    S.sel[q.id]=s;
    if(q.type==='single'&&!exam){doCheck(q)}else{renderAll()}
  });
  if(q.type==='matrix_sort_answer'&&!S.checked[q.id])ddBind(q);
  const fi=$('fillin');
  if(fi&&!S.checked[q.id]){
    fi.oninput=()=>{S.sel[q.id]=fi.value;const cb=$('check');if(cb)cb.disabled=!fi.value.trim();if(exam)renderPorts()};
    fi.onkeydown=e=>{if(e.key==='Enter'&&!exam&&fi.value.trim())doCheck(q)};
  }
}

/* ---------- Drag-and-drop Zuordnung ---------- */
function ddOrder(q){
  S.order=S.order||{};
  if(!S.order[q.id]){const a=q.items.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}S.order[q.id]=a}
  return S.order[q.id];
}
function ddHtml(q,sel,chk){
  const cur=sel||q.rows.map(()=>-1),placed=new Set(cur.filter(x=>x>=0));
  const chip=k=>`<button type="button" class="chip${S.pick===k&&S.pickQ===q.id?' pick':''}" draggable="${chk?'false':'true'}" data-c="${k}" ${chk?'disabled':''}>${esc(q.items[k])}</button>`;
  let h='<p class="muted">'+(chk?'Auswertung:':'Ziehe die Antworten auf die passenden Felder. Auf dem Handy: erst Antwort antippen, dann das Feld. Eine platzierte Antwort tippst du an, um sie zurückzulegen.')+(q.rows.length<q.items.length?' Nicht alle Optionen werden benötigt.':'')+'</p><div class="dd"><div class="dd-rows">';
  q.rows.forEach((r,i)=>{
    const c=cur[i],ok=c>=0&&q.items[c]===q.items[q.ans[i]];
    h+=`<div class="dd-row"><div class="dd-label">${fmt(r)}</div><div class="dd-zone${chk?(ok?' good':' bad'):''}" data-r="${i}" ${chk?'':'tabindex="0" role="button"'} aria-label="Feld ${i+1}">${c>=0?chip(c):'<span class="ph">hierher ziehen</span>'}${chk&&!ok?`<div class="fix">✗ Richtig: ${esc(q.items[q.ans[i]])}</div>`:''}</div></div>`;
  });
  h+='</div><div class="dd-pool" data-pool="1">'+ddOrder(q).filter(k=>!placed.has(k)).map(chip).join('')+'</div></div>';
  return h;
}
function ddBind(q){
  const get=()=>S.sel[q.id]||q.rows.map(()=>-1);
  const place=(k,r)=>{
    const s=get().slice(),from=s.indexOf(k);
    if(from>=0)s[from]=-1;
    if(r>=0)s[r]=k;
    S.sel[q.id]=s;S.pick=null;S.pickQ=null;renderAll();
  };
  document.querySelectorAll('.dd .chip').forEach(c=>{
    const k=+c.dataset.c;
    c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',String(k));e.dataTransfer.effectAllowed='move';c.classList.add('drag')});
    c.addEventListener('dragend',()=>c.classList.remove('drag'));
    c.addEventListener('click',e=>{
      e.stopPropagation();
      const z=c.closest('.dd-zone');
      if(z&&S.pick!=null&&S.pickQ===q.id){place(S.pick,+z.dataset.r);return}
      if(z){place(k,-1);return}
      if(S.pickQ===q.id&&S.pick===k){S.pick=null;S.pickQ=null}else{S.pick=k;S.pickQ=q.id}
      renderCard();
    });
  });
  document.querySelectorAll('.dd-zone').forEach(z=>{
    const r=+z.dataset.r;
    z.addEventListener('dragover',e=>{e.preventDefault();z.classList.add('over')});
    z.addEventListener('dragleave',()=>z.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.classList.remove('over');const k=parseInt(e.dataTransfer.getData('text/plain'),10);if(!isNaN(k))place(k,r)});
    z.addEventListener('click',()=>{if(S.pick!=null&&S.pickQ===q.id)place(S.pick,r)});
    z.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&S.pick!=null&&S.pickQ===q.id){e.preventDefault();place(S.pick,r)}});
  });
  const pool=document.querySelector('.dd-pool');
  if(pool){pool.addEventListener('dragover',e=>e.preventDefault());
    pool.addEventListener('drop',e=>{e.preventDefault();const k=parseInt(e.dataTransfer.getData('text/plain'),10);if(!isNaN(k))place(k,-1)});}
}
function doCheck(q){
  S.checked[q.id]=true;
  if(q.type!=='image'){store.res[q.id]=!!correct(q,S.sel[q.id]);save()}
  renderAll();
}
document.addEventListener('keydown',e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(S.mode==='cards'){
    if(e.key===' '||e.key==='Enter'){const f=$('flip');if(f){e.preventDefault();f.click()}return}
    if(e.key==='ArrowRight'&&$('next'))$('next').click();
    else if(e.key==='ArrowLeft'&&$('prev'))$('prev').click();
    return;
  }
  if(S.mode!=='learn'&&S.mode!=='exam')return;
  if(!S.list.length||!$('prev'))return;
  const q=S.list[S.i];
  if(e.key==='ArrowRight')$('next').click();
  else if(e.key==='ArrowLeft')$('prev').click();
  else if(e.key==='Enter'){const c=$('check');if(c&&!c.disabled)c.click()}
  else if(/^[1-9]$/.test(e.key)&&q.opts){const b=document.querySelectorAll('.opt')[+e.key-1];if(b&&!b.disabled)b.click()}
});
/* =====================  ERWEITERUNGEN  ===================== */
const MODNAME={1:'Networking Today',2:'Switch- & Endgeräte-Konfiguration',3:'Protokolle und Modelle',4:'Bitübertragungsschicht',5:'Zahlensysteme',6:'Sicherungsschicht',7:'Ethernet Switching',8:'Vermittlungsschicht',9:'Adressauflösung (ARP/NDP)',10:'Router-Grundkonfiguration',11:'IPv4-Adressierung',12:'IPv6-Adressierung',13:'ICMP'};
function hidePorts(){$('ports').style.display='none';$('examBar').style.display='none'}
function answerList(q){
  if(q.type==='single'||q.type==='multiple')return '<ul class="alist">'+q.ans.map(k=>`<li>${fmt(q.opts[k].t)}${q.opts[k].imgs.map(imgTag).join('')}</li>`).join('')+'</ul>';
  if(q.type==='fill')return '<p><b>'+esc(q.ans.join(' / '))+'</b></p>';
  if(q.type==='matrix_sort_answer')return '<table class="match"><tbody>'+q.rows.map((r,i)=>`<tr><td>${esc(r)}</td><td><b>→ ${esc(q.items[q.ans[i]])}</b></td></tr>`).join('')+'</tbody></table>';
  const extra=q.imgs.slice(1).concat(q.exp_imgs||[]);
  return extra.length?`<div class="imgs">${extra.map(imgTag).join('')}</div>`:'<p class="muted">Die Abbildung der Quelle enthält bereits die Lösung.</p>';
}

/* ---------- Karteikarten ---------- */
function renderCards(){
  hidePorts();
  const v=$('view');
  if(!S.list.length){v.innerHTML='<div class="card empty">Keine Karten für diese Filter-Auswahl.</div>';return}
  const q=S.list[S.i],fl=!!S.flip;
  const r=store.res[q.id];
  let h=`<div class="card"><div class="meta"><span><b>Karte ${S.i+1}</b> von ${S.list.length}</span>
    ${q.module!=null?`<span class="tag">Modul ${q.module}</span>`:''}${q.topic?`<span class="tag">Thema ${esc(q.topic)}</span>`:''}
    ${r===true?'<span class="tag">zuletzt gewusst</span>':r===false?'<span class="tag">zuletzt nicht gewusst</span>':''}</div>
    <p class="qtext">${fmt(q.q)}</p>`;
  const qi=q.type==='image'?q.imgs.slice(0,1):q.imgs;
  if(qi.length)h+=`<div class="imgs">${qi.map(imgTag).join('')}</div>`;
  if(!fl&&q.type==='matrix_sort_answer'){h+='<ul class="alist plain">'+q.rows.map(r=>`<li>${fmt(r)}</li>`).join('')+'</ul>';
    h+=`<label class="chk"><input type="checkbox" id="showopts" ${S.showOpts?'checked':''}> Antwortoptionen anzeigen</label>`;
    if(S.showOpts)h+='<p class="muted">Optionen: '+q.items.map(esc).join(' · ')+'</p>';
  }
  if(!fl&&(q.type==='single'||q.type==='multiple')){
    h+=`<label class="chk"><input type="checkbox" id="showopts" ${S.showOpts?'checked':''}> Antwortoptionen anzeigen</label>`;
    if(S.showOpts)h+='<ul class="alist plain">'+q.opts.map(o=>`<li>${fmt(o.t)}</li>`).join('')+'</ul>';
  }
  if(fl){
    h+=`<div class="exp" style="border-color:var(--ok)"><b>Richtige Antwort${q.type==='multiple'?'en':''}</b>${answerList(q)}</div>`;
    if(q.exp)h+=`<div class="exp"><b>Erklärung</b>${esc(q.exp)}</div>`;
  }
  h+='<div class="nav"><button class="btn" id="prev" '+(S.i===0?'disabled':'')+'>Zurück</button>';

  else h+='<button class="btn" id="knew">Gewusst</button><button class="btn" id="didnt">Nicht gewusst</button>';
  h+=`<button class="btn" id="next" ${S.i===S.list.length-1?'disabled':''}>Weiter</button><span class="sp"></span>

  v.innerHTML=h;

  $('prev').onclick=()=>go(-1);$('next').onclick=()=>go(1);
  $('flag').onclick=()=>{store.flag[q.id]?delete store.flag[q.id]:store.flag[q.id]=1;save();renderCards()};
  const f=$('flip');if(f)f.onclick=()=>{S.flip=true;renderCards()};
  const kn=$('knew');if(kn){kn.onclick=()=>{store.res[q.id]=true;save();if(S.i<S.list.length-1)go(1);else renderCards()};$('didnt').onclick=()=>{store.res[q.id]=false;save();if(S.i<S.list.length-1)go(1);else renderCards()}}
  const so=$('showopts');if(so)so.onchange=()=>{S.showOpts=so.checked;renderCards()};
}

/* ---------- Fortschritt ---------- */
function statRow(label,L,onPractice,onWeak){
  const done=L.filter(q=>store.res[q.id]!==undefined).length,ok=L.filter(q=>store.res[q.id]===true).length;
  const acc=done?Math.round(ok/done*100):null,cov=L.length?Math.round(done/L.length*100):0;
  return {label,total:L.length,done,ok,acc,cov,onPractice,onWeak};
}
function renderStats(){
  hidePorts();
  const rows=[];
  for(let m=1;m<=13;m++){const L=DATA.filter(q=>q.module===m);if(L.length)rows.push(statRow(`Modul ${m}: ${MODNAME[m]}`,L,()=>practice({mod:String(m)}),()=>practice({mod:String(m),stat:'bad'})))}
  rows.push(statRow('Final-Fragen ohne Modulzuordnung',DATA.filter(q=>q.module==null),()=>practice({mod:'none'}),()=>practice({mod:'none',stat:'bad'})));
  const all=statRow('Gesamt',DATA,()=>practice({}),()=>practice({stat:'bad'}));
  const cand=rows.filter(r=>r.done>=3&&r.acc!==null).sort((a,b)=>a.acc-b.acc)[0];
  const flagged=Object.keys(store.flag).length;
  let h=`<div class="card"><h2 style="margin-top:0">Dein Fortschritt</h2>
   <div class="kpis"><div class="kpi"><b>${all.done}</b><span>von ${all.total} beantwortet (${all.cov} %)</span></div>
   <div class="kpi"><b>${all.acc===null?'–':all.acc+' %'}</b><span>Trefferquote (letzter Stand)</span></div>
   <div class="kpi"><b>${all.done-all.ok}</b><span>zuletzt falsch</span></div>
   <div class="kpi"><b>${flagged}</b><span>markiert</span></div></div>`;
  if(cand)h+=`<p class="verdict ${cand.acc<70?'bad':'ok'}" style="font-weight:500">Schwächstes Modul bisher: <b>${esc(cand.label)}</b> (${cand.acc} % richtig bei ${cand.done} Fragen).</p>`;
  h+='<div class="row" style="margin:10px 0 16px"><button class="btn primary" id="sWeak">Alle falschen Fragen üben</button><button class="btn" id="sNew">Nur neue Fragen üben</button><button class="btn" id="sFlag">Markierte üben</button></div>';
  h+='<table class="stat-table"><thead><tr><th>Bereich</th><th>Abdeckung</th><th>Treffer</th><th></th></tr></thead><tbody>';
  rows.forEach((r,i)=>{h+=`<tr><td>${esc(r.label)}<div class="muted">${r.done} / ${r.total} beantwortet</div></td>
    <td><div class="bar"><i style="width:${r.cov}%"></i></div>${r.cov} %</td>

function renderSheet(){
  hidePorts();
  const toc=SHEET.map(s=>`<a href="#sh-${s.id}" class="tag">${s.t}</a>`).join(' ');
  $('view').innerHTML=`<div class="card sheetbar"><div class="row"><input type="search" id="shq" placeholder="Im Cheat Sheet suchen (z. B. 443, ARP, /27, EUI-64)" style="flex:1;min-width:200px"><button class="btn" id="shp">Drucken / PDF</button></div><div class="toc">${toc}</div></div>`+
   '<div id="sheet">'+SHEET.map(s=>`<section class="sec" id="sh-${s.id}"><h2>${s.t}</h2>${s.b.map(b=>`<div class="blk">${b}</div>`).join('')}</section>`).join('')+'</div>';
  $('shp').onclick=()=>window.print();
  $('shq').oninput=()=>{
    const q=$('shq').value.trim().toLowerCase();
    document.querySelectorAll('#sheet .sec').forEach(sec=>{
      let any=false;
      sec.querySelectorAll('.blk').forEach(b=>{
        const trs=b.querySelectorAll('tbody tr');
        if(!q){b.style.display='';trs.forEach(t=>t.style.display='');any=true;return}
        const whole=b.textContent.toLowerCase().includes(q);
        if(trs.length){let vis=0;trs.forEach(t=>{const m=t.textContent.toLowerCase().includes(q);t.style.display=m?'':'none';if(m)vis++});b.style.display=vis?'':'none';if(vis)any=true}
        else{b.style.display=whole?'':'none';if(whole)any=true}
      });
      sec.style.display=any?'':'none';
    });
  };
  sideStats();
}

function ip2n(s){const p=String(s).trim().split('.');if(p.length!==4)return null;let n=0;for(const x of p){if(!/^\d{1,3}$/.test(x)||+x>255)return null;n=n*256+ +x}return n>>>0}
function n2ip(n){return [n>>>24,(n>>>16)&255,(n>>>8)&255,n&255].join('.')}
function maskN(p){return p===0?0:((0xFFFFFFFF<<(32-p))>>>0)}
function parsePrefix(s){
  s=String(s).trim().replace('/','');
  if(/^\d+$/.test(s)&&+s>=0&&+s<=32)return +s;
  const n=ip2n(s);if(n===null)return null;
  let p=0;while(p<32&&((n>>>(31-p))&1))p++;
  return maskN(p)===n?p:null;
}
const b8=n=>n.toString(2).padStart(8,'0');
function ipBin(n,p){
  const bits=[...Array(32)].map((_,i)=>(n>>>(31-i))&1);
  return [0,1,2,3].map(o=>bits.slice(o*8,o*8+8).map((b,j)=>o*8+j<p?`<u>${b}</u>`:b).join('')).join('.');
}
function ipKind(n){
  const o1=n>>>24,o2=(n>>>16)&255;
  if(o1===10)return 'privat (10.0.0.0/8)';
  if(o1===172&&o2>=16&&o2<=31)return 'privat (172.16.0.0/12)';
  if(o1===192&&o2===168)return 'privat (192.168.0.0/16)';
  if(o1===127)return 'Loopback';
  if(o1===169&&o2===254)return 'APIPA / Link-Local';
  if(o1>=224&&o1<=239)return 'Multicast';
  if(o1>=240)return 'reserviert/experimentell';
  return 'öffentlich';
}
function subnetCalc(ipS,pS){
  const n=ip2n(ipS),p=parsePrefix(pS);
  if(n===null)return {err:'Ungültige IPv4-Adresse.'};
  if(p===null)return {err:'Ungültige Maske oder Präfixlänge (z. B. /27 oder 255.255.255.224).'};
  const m=maskN(p),net=(n&m)>>>0,bc=(net|(~m>>>0))>>>0;
  const hosts=p>=31?(p===32?1:2):Math.pow(2,32-p)-2;
  return {n,p,m,net,bc,first:p>=31?net:net+1,last:p>=31?bc:bc-1,hosts,wild:(~m)>>>0};
}
function ipv6Expand(s){
  s=s.trim().toLowerCase();if(!/^[0-9a-f:]+$/.test(s)||(s.match(/::/g)||[]).length>1)return null;
  let g;
  if(s.includes('::')){const[a,b]=s.split('::');const A=a?a.split(':'):[],B=b?b.split(':'):[];const miss=8-A.length-B.length;if(miss<1)return null;g=A.concat(Array(miss).fill('0'),B)}
  else g=s.split(':');
  if(g.length!==8||g.some(x=>x===''||x.length>4))return null;
  return g.map(x=>x.padStart(4,'0'));
}
function ipv6Compress(g){
  g=g.map(x=>x.replace(/^0+(?=.)/,''));
  let best=-1,bl=0,cur=-1,cl=0;
  g.forEach((x,i)=>{if(x==='0'){if(cur<0){cur=i;cl=0}cl++;if(cl>bl){bl=cl;best=cur}}else{cur=-1;cl=0}});
  if(bl<2)return g.join(':');
  const left=g.slice(0,best).join(':'),right=g.slice(best+bl).join(':');
  return left+'::'+right;
}
let drill=null,dstat={ok:0,n:0},sdrill=null;
function newBinDrill(){
  const t=Math.floor(Math.random()*4),v=Math.floor(Math.random()*256);
  const hex=v.toString(16).toUpperCase().padStart(2,'0');
  drill=[
    {p:`Dezimal <b>${v}</b> → Binär (8 Bit)`,a:b8(v),norm:s=>s.replace(/\s/g,'')},
    {p:`Binär <b>${b8(v)}</b> → Dezimal`,a:String(v),norm:s=>s.trim()},
    {p:`Dezimal <b>${v}</b> → Hex (2 Zeichen)`,a:hex,norm:s=>s.trim().toUpperCase().padStart(2,'0')},
    {p:`Hex <b>${hex}</b> → Dezimal`,a:String(v),norm:s=>s.trim()}][t];
}
function newSubDrill(){
  const p=16+Math.floor(Math.random()*15),base=[()=>`192.168.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`,()=>`10.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`,()=>`172.${16+Math.floor(Math.random()*16)}.${Math.floor(Math.random()*256)}.${Math.floor(Math.random()*256)}`][Math.floor(Math.random()*3)]();
  sdrill={ip:base,p,c:subnetCalc(base,String(p))};
}
function renderCalc(){
  hidePorts();
  if(!drill)newBinDrill();
  if(!sdrill)newSubDrill();
  $('view').innerHTML=`
  <div class="card"><h2 style="margin-top:0">Subnetz-Rechner</h2>
   <div class="row"><input id="cip" value="192.168.10.77" aria-label="IPv4-Adresse" style="max-width:200px"><input id="cmask" value="/27" aria-label="Präfix oder Maske" style="max-width:200px"><button class="btn primary" id="cgo">Berechnen</button></div>
   <div id="cout" style="margin-top:12px"></div></div>
  <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Konverter</h2>
   <div class="row"><input id="cv" placeholder="Zahl oder IPv4 (z. B. 192.168.1.1, 255, 0xFF, 11000000)" style="flex:1;min-width:220px"><button class="btn primary" id="cvgo">Umrechnen</button></div>
   <div id="cvout" style="margin-top:12px"></div>
   <h3>IPv6 kürzen / erweitern</h3>
   <div class="row"><input id="v6" value="2001:0db8:0000:0000:0000:ff00:0042:8329" style="flex:1;min-width:220px"><button class="btn primary" id="v6go">Umwandeln</button></div><div id="v6out" style="margin-top:12px"></div></div>
  <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Übung: Binär, Dezimal, Hex</h2>
   <p id="dp" style="font-size:1.1rem"></p>
   <div class="row"><input id="da" autocomplete="off" style="max-width:240px" aria-label="Antwort"><button class="btn primary" id="dgo">Prüfen</button><button class="btn" id="dnext">Nächste Aufgabe</button></div>
   <p id="dr" role="status"></p><p class="muted" id="ds"></p></div>
  <div class="card" style="margin-top:16px"><h2 style="margin-top:0">Übung: Subnetting</h2>
   <p style="font-size:1.1rem">Gegeben: <b id="sdi"></b> / <b id="sdp"></b></p>
   <table class="match"><tbody>
    <tr><td>Subnetzmaske</td><td><input id="s1" autocomplete="off"></td></tr>
    <tr><td>Netzadresse</td><td><input id="s2" autocomplete="off"></td></tr>
    <tr><td>Broadcast-Adresse</td><td><input id="s3" autocomplete="off"></td></tr>
    <tr><td>Nutzbare Hosts</td><td><input id="s4" autocomplete="off"></td></tr></tbody></table>
   <div class="row" style="margin-top:10px"><button class="btn primary" id="sgo">Prüfen</button><button class="btn" id="snext">Neue Aufgabe</button></div><div id="sr" role="status" style="margin-top:10px"></div></div>`;
  const drawCalc=()=>{
    const r=subnetCalc($('cip').value,$('cmask').value),o=$('cout');
    if(r.err){o.innerHTML=`<div class="verdict bad">${r.err}</div>`;return}
    o.innerHTML=`<table class="ref"><tbody>
     <tr><td>Netzadresse</td><td><b>${n2ip(r.net)}/${r.p}</b></td></tr>
     <tr><td>Subnetzmaske</td><td>${n2ip(r.m)} (Wildcard ${n2ip(r.wild)})</td></tr>
     <tr><td>Erster / letzter Host</td><td>${n2ip(r.first)} – ${n2ip(r.last)}</td></tr>
     <tr><td>Broadcast</td><td>${n2ip(r.bc)}</td></tr>
     <tr><td>Nutzbare Hosts</td><td><b>${r.hosts.toLocaleString('de-DE')}</b> (2<sup>${32-r.p}</sup> − 2)</td></tr>
     <tr><td>Adresstyp</td><td>${ipKind(r.n)}</td></tr>
     <tr><td>IP binär</td><td><span class="code" style="margin:0">${ipBin(r.n,r.p)}</span></td></tr>
     <tr><td>Maske binär</td><td><span class="code" style="margin:0">${ipBin(r.m,r.p)}</span></td></tr></tbody></table><p class="muted">Unterstrichen = Netzanteil, nicht unterstrichen = Hostanteil.</p>`;
  };
  $('cgo').onclick=drawCalc;[$('cip'),$('cmask')].forEach(e=>e.onkeydown=ev=>{if(ev.key==='Enter')drawCalc()});drawCalc();
  const conv=()=>{
    let s=$('cv').value.trim(),o=$('cvout');if(!s){o.innerHTML='';return}
    const ip=ip2n(s);
    if(ip!==null&&s.includes('.')){o.innerHTML=`<table class="ref"><tbody><tr><td>Binär</td><td><span class="code" style="margin:0">${s.split('.').map(x=>b8(+x)).join('.')}</span></td></tr><tr><td>Hex</td><td>${s.split('.').map(x=>(+x).toString(16).toUpperCase().padStart(2,'0')).join('.')}</td></tr><tr><td>Als 32-Bit-Zahl</td><td>${ip}</td></tr></tbody></table>`;return}
    let v=NaN;
    if(/^0x[0-9a-f]+$/i.test(s))v=parseInt(s,16);else if(/^[01]{4,}$/.test(s)&&s.length>3&&/^[01]+$/.test(s)&&s.length%4===0&&s.length>=8)v=parseInt(s,2);else if(/^\d+$/.test(s))v=parseInt(s,10);else if(/^[0-9a-f]+$/i.test(s))v=parseInt(s,16);
    if(isNaN(v)){o.innerHTML='<div class="verdict bad">Eingabe nicht erkannt.</div>';return}
    o.innerHTML=`<table class="ref"><tbody><tr><td>Dezimal</td><td>${v}</td></tr><tr><td>Binär</td><td><span class="code" style="margin:0">${v.toString(2).padStart(8,'0')}</span></td></tr><tr><td>Hex</td><td>${v.toString(16).toUpperCase()}</td></tr></tbody></table><p class="muted">Hinweis: Binärzahlen ab 8 Stellen (Vielfaches von 4) werden als Binär gelesen, reine Ziffern sonst als Dezimal, mit „0x“ als Hex.</p>`;
  };
  $('cvgo').onclick=conv;$('cv').onkeydown=e=>{if(e.key==='Enter')conv()};
  const v6=()=>{const g=ipv6Expand($('v6').value),o=$('v6out');
    o.innerHTML=g?`<table class="ref"><tbody><tr><td>Erweitert</td><td><code>${g.join(':')}</code></td></tr><tr><td>Gekürzt</td><td><code>${ipv6Compress(g)}</code></td></tr></tbody></table>`:'<div class="verdict bad">Ungültige IPv6-Adresse.</div>'};
  $('v6go').onclick=v6;$('v6').onkeydown=e=>{if(e.key==='Enter')v6()};v6();
  const showD=()=>{$('dp').innerHTML=drill.p;$('da').value='';$('dr').innerHTML='';$('ds').textContent=`Treffer: ${dstat.ok} von ${dstat.n}`;$('da').focus()};
  const chkD=()=>{
    const v=drill.norm($('da').value);if(!v)return;
    dstat.n++;const ok=v===drill.a;if(ok)dstat.ok++;
    $('dr').innerHTML=ok?'<span class="verdict ok">✓ Richtig</span>':`<span class="verdict bad">✗ Richtig wäre: ${drill.a}</span>`;
    $('ds').textContent=`Treffer: ${dstat.ok} von ${dstat.n}`;
  };
  $('dgo').onclick=chkD;$('dnext').onclick=()=>{newBinDrill();showD()};
  $('da').onkeydown=e=>{if(e.key==='Enter'){if($('dr').innerHTML)$('dnext').click();else chkD()}};showD();
  const showS=()=>{$('sdi').textContent=sdrill.ip;$('sdp').textContent='/'+sdrill.p;['s1','s2','s3','s4'].forEach(i=>$(i).value='');$('sr').innerHTML=''};
  $('sgo').onclick=()=>{
    const c=sdrill.c,ans=[n2ip(c.m),n2ip(c.net),n2ip(c.bc),String(c.hosts)],got=['s1','s2','s3','s4'].map(i=>$(i).value.trim().replace(/\./g,i==='s4'?'':'.'));
    const names=['Subnetzmaske','Netzadresse','Broadcast','Nutzbare Hosts'];
    $('sr').innerHTML=ans.map((a,i)=>`<div class="verdict ${got[i]===a?'ok':'bad'}" style="margin:4px 0;font-weight:500">${got[i]===a?'✓':'✗'} ${names[i]}: ${a}</div>`).join('');
  };
  $('snext').onclick=()=>{newSubDrill();showS()};showS();
  sideStats();
}

/* ---------- Countdown bis zum Test ---------- */
const TEST_AT=Date.parse('2026-10-14T08:00:00+02:00'); // 14.10.2026, 08:00 Uhr Berlin (MESZ)
function tickCountdown(){
  const el=$('cdt'),box=$('cd');if(!el)return;
  let s=Math.floor((TEST_AT-Date.now())/1000);
  if(s<=0){el.textContent=s>-7200?'Der Test läuft – viel Erfolg!':'Test vorbei';box.classList.add('done');box.classList.remove('soon');return}
  const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60,p=n=>String(n).padStart(2,'0');
  el.textContent=(d>0?d+' T ':'')+p(h)+' Std '+p(m)+' Min '+p(sec)+' Sek';
  box.classList.toggle('soon',s<86400);
}
tickCountdown();setInterval(tickCountdown,1000);
initSide();rebuild();
</script>
