wo.)","imgs":[],"exp":"Fiber-optic cabling supports higher bandwidth than UTP for longer distances. Fiber is immune to EMI and RFI, but costs more, requires more skill to install, and requires more safety precautions.","topic":"4.5.1","opts":[{"t":"It is not affected by EMI or RFI.","imgs":[]},{"t":"Each pair of cables is wrapped in metallic foil.","imgs":[]},{"t":"It combines the technique of cancellation, shielding, and twisting to protect data.","imgs":[]},{"t":"It typically contains 4 pairs of fiber-optic wires.","imgs":[]},{"t":"It is more expensive than UTP cabling is.","imgs":[]}],"ans":[0,4],"type":"multiple","sources":["Module 4-7"],"module":4,"id":85},{"q":"What is a primary role of the Physical layer in transmitting data on the network?","imgs":[],"exp":"The OSI physical layer provides the means to transport the bits that make up a frame across the network media. This layer accepts a complete frame from the data link layer and encodes it as a series of signals that are transmitted to the local media.","topic":"4.1.2","opts":[{"t":"create the signals that represent the bits in each frame on to the media","imgs":[]},{"t":"provide physical addressing to the devices","imgs":[]},{"t":"determine the path packets take through the network","imgs":[]},{"t":"control data access to the media","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":86},{"q":"With the use of unshielded twisted-pair copper wire in a network, what causes crosstalk within the cable pairs?","imgs":[],"exp":"Crosstalk is a type of noise, or interference that occurs when signal transmission on one wire interferes with another wire. When current flows through a wire a magnetic field is produced. The produced magnetic field will interface the signal carried in the adjacent wire.","topic":"4.3.1","opts":[{"t":"the magnetic field around the adjacent pairs of wire","imgs":[]},{"t":"the use of braided wire to shield the adjacent wire pairs","imgs":[]},{"t":"the reflection of the electrical wave back from the far end of the cable","imgs":[]},{"t":"the collision caused by two nodes trying to use the media simultaneously","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":87},{"q":"Refer to the graphic. What type of cabling is shown?","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2020-01-11_180314-300x234-1.jpg"],"exp":"Network cabling include different types of cables:\n\nUTP cable consists of four pairs of color-coded wires that have been twisted together and then encased in a flexible plastic sheath.\nSTP cable uses four pairs of wires, each wrapped in a foil shield, which are then wrapped in an overall metallic braid or foil.\nCoaxial cable uses a copper conductor and a layer of flexible plastic insulation surrounds the copper conductor.\nFiber cable is a flexible, extremely thin, transparent strand of glass surrounded by plastic insulation.","topic":"4.5.1","opts":[{"t":"STP","imgs":[]},{"t":"UTP","imgs":[]},{"t":"coax","imgs":[]},{"t":"fiber","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":4,"id":88},{"q":"In addition to the cable length, what two factors could interfere with the communication carried over UTP cables? (Choose two.)","imgs":[],"exp":"Copper media is widely used in network communications. However, copper media is limited by distance and signal interference. Data is transmitted on copper cables as electrical pulses. The electrical pulses are susceptible to interference from two sources:\n\nElectromagnetic interference (EMI) or radio frequency interference (RFI) - EMI and RFI signals can distort and corrupt the data signals being carried by copper media.\nCrosstalk - Crosstalk is a disturbance caused by the electric or magnetic fields of a signal on one wire interfering with the signal in an adjacent wire.","topic":"4.3.1","opts":[{"t":"crosstalk","imgs":[]},{"t":"bandwidth","imgs":[]},{"t":"size of the network","imgs":[]},{"t":"signal modulation technique","imgs":[]},{"t":"electromagnetic interference","imgs":[]}],"ans":[0,4],"type":"multiple","sources":["Module 4-7"],"module":4,"id":89},{"q":"Which two devices commonly affect wireless networks? (Choose two.)","imgs":[],"exp":"Radio Frequency Interference (RFI) is the interference that is caused by radio transmitters and other devices that are transmitting in the same frequency.","topic":"4.6.1","opts":[{"t":"Blu-ray players","imgs":[]},{"t":"home theaters","imgs":[]},{"t":"cordless phones","imgs":[]},{"t":"microwaves","imgs":[]},{"t":"incandescent light bulbs","imgs":[]},{"t":"external hard drives","imgs":[]}],"ans":[2,3],"type":"multiple","sources":["Module 4-7"],"module":4,"id":90},{"q":"Which two statements describe the services provided by the data link layer? (Choose two.)","imgs":[],"exp":"The data link layer is divided into two sub layers, namely Logical Link Control (LLC) and Media Access Control (MAC). LLC forms a frame from the network layer PDU into a format that conforms to the requirements of the network interface and media. A network layer PDU might be for IPv4 or IPv6. The MAC sub layer defines the media access processes performed by the hardware. It manages the frame access to the network media according to the physical signaling requirements (copper cable, fiber optic, wireless, etc.)","topic":"6.1.1","opts":[{"t":"It defines the end-to-end delivery addressing scheme.","imgs":[]},{"t":"It maintains the path between the source and destination devices during the data transmission.","imgs":[]},{"t":"It manages the access of frames to the network media.","imgs":[]},{"t":"It provides reliable delivery through link establishment and flow control.","imgs":[]},{"t":"It ensures that application data will be transmitted according to the prioritization.","imgs":[]},{"t":"It packages various Layer 3 PDUs into a frame format that is compatible with the network interface.","imgs":[]}],"ans":[2,5],"type":"multiple","sources":["Module 4-7"],"module":6,"id":91},{"q":"What is the function of the CRC value that is found in the FCS field of a frame?","imgs":[],"exp":"The CRC value in the FCS field of the received frame is compared to the computed CRC value of that frame, in order to verify the integrity of the frame. If the two values do not match, then the frame is discarded.","topic":"6.3.2","opts":[{"t":"to verify the integrity of the received frame","imgs":[]},{"t":"to verify the physical address in the frame","imgs":[]},{"t":"to verify the logical address in the frame","imgs":[]},{"t":"to compute the checksum header for the data field in the frame","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":6,"id":92},{"q":"What is contained in the trailer of a data-link frame?","imgs":[],"exp":"The trailer in a data-link frame contains error detection information that is pertinent to the frame included in the FCS field. The header contains control information, such as the addressing, while the area that is indicated by the word \"data\" includes the data, transport layer PDU, and the IP header.","topic":"6.3.2","opts":[{"t":"logical address","imgs":[]},{"t":"physical address","imgs":[]},{"t":"data","imgs":[]},{"t":"error detection","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":6,"id":93},{"q":"Which statement describes a characteristic of the frame header fields of the data link layer?","imgs":[],"exp":"All data link layer protocols encapsulate the Layer 3 PDU within the data field of the frame. However, the structure of the frame and the fields that are contained in the header vary according to the protocol. Different data link layer protocols may use different fields, like priority/quality of service, logical connection control, physical link control, flow control, and congestion control.","topic":"6.3.2","opts":[{"t":"They all include the flow control and logical connection fields.","imgs":[]},{"t":"Ethernet frame header fields contain Layer 3 source and destination addresses.","imgs":[]},{"t":"They vary depending on protocols.","imgs":[]},{"t":"They include information on user applications.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":6,"id":94},{"q":"A network team is comparing physical WAN topologies for connecting remote sites to a headquarters building. Which topology provides high availability and connects some, but not all, remote sites?","imgs":[],"exp":"Partial mesh topologies provide high availability by interconnecting multiple remote sites, but do not require a connection between all remote sites. A mesh topology requires point-to-point links with every system being connected to every other system. A point-to-point topology is where each device is connected to one other device. A hub and spoke uses a central device in a star topology that connects to other point-to-point devices.","topic":"6.2.2","opts":[{"t":"mesh","imgs":[]},{"t":"partial mesh","imgs":[]},{"t":"hub and spoke","imgs":[]},{"t":"point-to-point","imgs":[]}],"ans":[1],"type":"single","sources":["Module 4-7"],"module":6,"id":95},{"q":"Which two fields or features does Ethernet examine to determine if a received frame is passed to the data link layer or discarded by the NIC? (Choose two.)","imgs":[],"exp":"An Ethernet frame is not processed and is discarded if it is smaller than the minimum (64 bytes) or if the calculated frame check sequence (FCS) value does not match the received FCS value. Auto-MDIX (automatic medium-dependent interface crossover) is Layer 1 technology that detects cable straight-through or crossover types. The source MAC address is not used to determine how the frame is received. CEF (Cisco Express Forwarding) is a technology used to expedite Layer 3 switching.","topic":"7.1.4","opts":[{"t":"auto-MDIX","imgs":[]},{"t":"CEF","imgs":[]},{"t":"Frame Check Sequence","imgs":[]},{"t":"minimum frame size","imgs":[]},{"t":"source MAC address","imgs":[]}],"ans":[2,3],"type":"multiple","sources":["Module 4-7"],"module":7,"id":96},{"q":"Which media communication type does not require media arbitration in the data link layer?","imgs":[],"exp":"Half-duplex communication occurs when both devices can both transmit and receive on the medium but cannot do so simultaneously. Full-duplex communication occurs when both devices can transmit and receive on the medium at the same time and therefore does not require media arbitration. Half-duplex communication is typically contention-based, whereas controlled (deterministic) access is applied in technologies where devices take turns to access the medium.","topic":"6.2.5","opts":[{"t":"deterministic","imgs":[]},{"t":"half-duplex","imgs":[]},{"t":"full-duplex","imgs":[]},{"t":"controlled access","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":6,"id":97},{"q":"Which statement describes an extended star topology?","imgs":[],"exp":"In an extended star topology, central intermediate devices interconnect other star topologies.","topic":"6.2.4","opts":[{"t":"End devices connect to a central intermediate device, which in turn connects to other central intermediate devices.","imgs":[]},{"t":"End devices are connected together by a bus and each bus connects to a central intermediate device.","imgs":[]},{"t":"Each end system is connected to its respective neighbor via an intermediate device.","imgs":[]},{"t":"All end and intermediate devices are connected in a chain to each other.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":6,"id":98},{"q":"What is a characteristic of the LLC sublayer?","imgs":[],"exp":"The Logical Link Control (LLC) defines the software processes that provide services to the network layer protocols. The information is placed by LLC in the frame and identifies which network layer protocol is being used for the frame. This information allows multiple Layer 3 protocols, such as IPv4 and IPv6, to utilize the same network interface and media.","topic":"6.1.2","opts":[{"t":"It provides the logical addressing required that identifies the device.","imgs":[]},{"t":"It provides delimitation of data according to the physical signaling requirements of the medium.","imgs":[]},{"t":"It places information in the frame allowing multiple Layer 3 protocols to use the same network interface and media.","imgs":[]},{"t":"It defines software processes that provide services to the physical layer.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":6,"id":99},{"q":"What are three ways that media access control is used in networking? (Choose three.)","imgs":[],"exp":"Wired Ethernet networks use CSMA/CD for media access control. IEEE 802.11 wireless networks use CSMA/CA, a similar method. Media access control defines the way data frames get placed on the media. The controlled access method is deterministic, not a contention-based access to networks. Because each device has its own time to use the medium, controlled access networks such as legacy Token Ring do not have collisions.","topic":"6.2.7","opts":[{"t":"Ethernet utilizes CSMA/CD.","imgs":[]},{"t":"Media access control provides placement of data frames onto the media.","imgs":[]},{"t":"Contention-based access is also known as deterministic.","imgs":[]},{"t":"802.11 utilizes CSMA/CD.","imgs":[]},{"t":"Data link layer protocols define the rules for access to different media.","imgs":[]},{"t":"Networks with controlled access have reduced performance due to data collisions.","imgs":[]}],"ans":[0,1,4],"type":"multiple","sources":["Module 4-7"],"module":6,"id":100},{"q":"During the encapsulation process, what occurs at the data link layer for a PC connected to an Ethernet network?","imgs":[],"exp":"The Ethernet frame includes the source and destination physical address. The trailer includes a CRC value in the Frame Check Sequence field to allow the receiving device to determine if the frame has been changed (has errors) during the transmission.","topic":"6.3.3","opts":[{"t":"An IP address is added.","imgs":[]},{"t":"The logical address is added.","imgs":[]},{"t":"The physical address is added.","imgs":[]},{"t":"The process port number is added.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":6,"id":101},{"q":"What three items are contained in an Ethernet header and trailer? (Choose three.)","imgs":[],"exp":"Layer 2 headers contain the following:\n\nFrame start and stop indicator flags at the beginning and end of a frame\nAddressing - for Ethernet networks this part of the header contains source and destination MAC addresses\nType field to indicate what Layer 3 protocol is being used\nError detection to determine if the frame arrived without error","topic":"6.3.2","opts":[{"t":"source IP address","imgs":[]},{"t":"source MAC address","imgs":[]},{"t":"destination IP address","imgs":[]},{"t":"destination MAC address","imgs":[]},{"t":"error-checking information","imgs":[]}],"ans":[1,3,4],"type":"multiple","sources":["Module 4-7"],"module":6,"id":102},{"q":"What type of communication rule would best describe CSMA/CD?","imgs":[],"exp":"Carrier sense multiple access collision detection (CSMA/CD) is the access method used with Ethernet. The access method rule of communication dictates how a network device is able to place a signal on the carrier. CSMA/CD dictates those rules on an Ethernet network and CSMA/CA dictates those rules on an 802.11 wireless LAN.","topic":"6.2.6","opts":[{"t":"access method","imgs":[]},{"t":"flow control","imgs":[]},{"t":"message encapsulation","imgs":[]},{"t":"message encoding","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":6,"id":103},{"q":"Which three basic parts are common to all frame types supported by the data link layer? (Choose three.)","imgs":[],"exp":"The data link protocol is responsible for NIC-to-NIC communications within the same network. Although there are many different data link layer protocols that describe data link layer frames, each frame type has three basic parts:\n\nHeader\nData\nTrailer","topic":"6.3.1","opts":[{"t":"header","imgs":[]},{"t":"type field","imgs":[]},{"t":"MTU size","imgs":[]},{"t":"data","imgs":[]},{"t":"trailer","imgs":[]},{"t":"CRC value","imgs":[]}],"ans":[0,3,4],"type":"multiple","sources":["Module 4-7"],"module":6,"id":104},{"q":"Which statement is true about the CSMA/CD access method that is used in Ethernet?","imgs":[],"exp":"Legacy bus-topology Ethernet LAN uses CSMA/CD as network media access control protocol. It works by detecting a collision in the medium and backing off (after transmitting a jam signal) as necessary. When one host wants to transmit a frame, it listens on the medium to check if the medium is busy. After it senses that no one else is transmitting, the host starts transmitting the frame, it also monitors the current level to detect a collision. If it detects a collision, it transmits a special jam signal so that all other hosts can know there was a collision. The other host will receive this jam signal and stop transmitting. After this, both hosts enter an exponential backoff phase and retry transmission.","topic":"6.2.7","opts":[{"t":"When a device hears a carrier signal and transmits, a collision cannot occur.","imgs":[]},{"t":"A jamming signal causes only devices that caused the collision to execute a backoff algorithm.","imgs":[]},{"t":"All network devices must listen before transmitting.","imgs":[]},{"t":"Devices involved in a collision get priority to transmit after the backoff period.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":6,"id":105},{"q":"What is the auto-MDIX feature on a switch?","imgs":[],"exp":"The auto-MDIX enables a switch to use a crossover or a straight-through Ethernet cable to connect to a device regardless of the device on the other end of the connection.","topic":"7.4.5","opts":[{"t":"the automatic configuration of an interface for 10/100/1000 Mb/s operation","imgs":[]},{"t":"the automatic configuration of an interface for a straight-through or a crossover Ethernet cable connection","imgs":[]},{"t":"the automatic configuration of full-duplex operation over a single Ethernet copper or optical cable","imgs":[]},{"t":"the ability to turn a switch interface on or off accordingly if an active connection is detected","imgs":[]}],"ans":[1],"type":"single","sources":["Module 4-7"],"module":7,"id":106},{"q":"Refer to the exhibit. What is the destination MAC address of the Ethernet frame as it leaves the web server if the final destination is PC1?","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/i209881v1n2_209881.png"],"exp":"The destination MAC address is used for local delivery of Ethernet frames. The MAC (Layer 2) address changes at each network segment along the path. As the frame leaves the web server, it will be delivered by using the MAC address of the default gateway.","topic":"7.3.5","opts":[{"t":"00-60-2F-3A-07-AA","imgs":[]},{"t":"00-60-2F-3A-07-BB","imgs":[]},{"t":"00-60-2F-3A-07-CC","imgs":[]},{"t":"00-60-2F-3A-07-DD","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":7,"id":107},{"q":"A Layer 2 switch is used to switch incoming frames from a 1000BASE-T port to a port connected to a 100Base-T network. Which method of memory buffering would work best for this task?","imgs":[],"exp":"With shared memory buffering, the number of frames stored in the buffer is restricted only by the of the entire memory buffer and not limited to a single port buffer. This permits larger frames to be transmitted with fewer dropped frames. This is important to asymmetric switching, which applies to this scenario, where frames are being exchanged between ports of different rates. With port-based memory buffering, frames are stored in queues that are linked to specific incoming and outgoing ports making it possible for a single frame to delay the transmission of all the frames in memory because of a busy destination port. Level 1 cache is memory used in a CPU. Fixed configuration refers to the port arrangement in switch hardware.","topic":"7.4.3","opts":[{"t":"port-based buffering","imgs":[]},{"t":"level 1 cache buffering","imgs":[]},{"t":"shared memory buffering","imgs":[]},{"t":"fixed configuration buffering","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":7,"id":108},{"q":"What are two examples of the cut-through switching method? (Choose two.)","imgs":[],"exp":"Store-and forward switching accepts the entire frame and performs error checking using CRC before forwarding the frame. Store-and-forward is often required for QOS analysis. Fast-forward and fragment-free are both variations of the cut-through switching method where only part of the frame is received before the switch begins to forward it.","topic":"7.4.2","opts":[{"t":"store-and-forward switching","imgs":[]},{"t":"fast-forward switching","imgs":[]},{"t":"CRC switching","imgs":[]},{"t":"fragment-free switching","imgs":[]},{"t":"QOS switching","imgs":[]}],"ans":[1,3],"type":"multiple","sources":["Module 4-7"],"module":7,"id":109},{"q":"Which frame forwarding method receives the entire frame and performs a CRC check to detect errors before forwarding the frame?","imgs":[],"exp":"Fast-forward and fragment-free switching are variations of cut-through switching, which begins to forward the frame before the entire frame is received.","topic":"7.4.1","opts":[{"t":"cut-through switching","imgs":[]},{"t":"store-and-forward switching","imgs":[]},{"t":"fragment-free switching","imgs":[]},{"t":"fast-forward switching","imgs":[]}],"ans":[1],"type":"single","sources":["Module 4-7"],"module":7,"id":110},{"q":"What is the purpose of the FCS field in a frame?","imgs":[],"exp":"The FCS field in a frame is used to detect any errors in the transmission and receipt of a frame. This is done by comparing the CRC value within the frame against a computed CRC value of the frame. If the two values do not match, then the frame is discarded.","topic":"7.1.4","opts":[{"t":"to obtain the MAC address of the sending node","imgs":[]},{"t":"to verify the logical address of the sending node","imgs":[]},{"t":"to compute the CRC header for the data field","imgs":[]},{"t":"to determine if errors occurred in the transmission and reception","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":7,"id":111},{"q":"Which switching method has the lowest level of latency?","imgs":[],"exp":"Fast-forward switching begins to forward a frame after reading the destination MAC address, resulting in the lowest latency. Fragment-free reads the first 64 bytes before forwarding. Store-and-forward has the highest latency because it reads the entire frame before beginning to forward it. Both fragment-free and fast-forward are types of cut-through switching.","topic":"7.4.2","opts":[{"t":"cut-through","imgs":[]},{"t":"store-and-forward","imgs":[]},{"t":"fragment-free","imgs":[]},{"t":"fast-forward","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":7,"id":112},{"q":"A network administrator is connecting two modern switches using a straight-through cable. The switches are new and have never been configured. Which three statements are correct about the final result of the connection? (Choose three.)","imgs":[],"exp":"Modern switches can negotiate to work in full-duplex mode if both switches are capable. They will negotiate to work using the fastest possible speed and the auto-MDIX feature is enabled by default, so a cable change is not needed.","topic":"7.4.4","opts":[{"t":"The link between the switches will work at the fastest speed that is supported by both switches.","imgs":[]},{"t":"The link between switches will work as full-duplex.","imgs":[]},{"t":"If both switches support different speeds, they will each work at their own fastest speed.","imgs":[]},{"t":"The auto-MDIX feature will configure the interfaces eliminating the need for a crossover cable.","imgs":[]},{"t":"The connection will not be possible unless the administrator changes the cable to a crossover cable.","imgs":[]},{"t":"The duplex capability has to be manually configured because it cannot be negotiated.","imgs":[]}],"ans":[0,1,3],"type":"multiple","sources":["Module 4-7"],"module":7,"id":113},{"q":"Which advantage does the store-and-forward switching method have compared with the cut-through switching method?","imgs":[],"exp":"A switch using the store-and-forward switching method performs an error check on an incoming frame by comparing the FCS value against its own FCS calculations after the entire frame is received. In comparison, a switch using the cut-through switching method makes quick forwarding decisions and starts the forwarding process without waiting for the entire frame to be received. Thus a switch using cut-through switching may send invalid frames to the network. The performance of store-and-forward switching is slower compared to cut-through switching performance. Collision detection is monitored by the sending device. Store-and-forward switching does not use IPv4 Layer 3 and 4 information for its forwarding decisions.","topic":"7.4.1","opts":[{"t":"collision detecting","imgs":[]},{"t":"frame error checking","imgs":[]},{"t":"faster frame forwarding","imgs":[]},{"t":"frame forwarding using IPv4 Layer 3 and 4 information","imgs":[]}],"ans":[1],"type":"single","sources":["Module 4-7"],"module":7,"id":114},{"q":"When the store-and-forward method of switching is in use, what part of the Ethernet frame is used to perform an error check?","imgs":[],"exp":"The cyclic redundancy check (CRC) part of the trailer is used to determine if the frame has been modified during transit. If the integrity of the frame is verified, the frame is forwarded. If the integrity of the frame cannot be verified, then the frame is dropped.","topic":"7.4.1","opts":[{"t":"CRC in the trailer","imgs":[]},{"t":"source MAC address in the header","imgs":[]},{"t":"destination MAC address in the header","imgs":[]},{"t":"protocol type in the header","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":115},{"q":"Which switching method uses the CRC value in a frame?","imgs":[],"exp":"When the store-and-forward switching method is used, the switch receives the complete frame before forwarding it on to the destination. The cyclic redundancy check (CRC) part of the trailer is used to determine if the frame has been modified during transit. In contrast, a cut-through switch forwards the frame once the destination Layer 2 address is read. Two types of cut-through switching methods are fast-forward and fragment-free.","topic":"7.4.1","opts":[{"t":"cut-through","imgs":[]},{"t":"fast-forward","imgs":[]},{"t":"fragment-free","imgs":[]},{"t":"store-and-forward","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":7,"id":116},{"q":"What are two actions performed by a Cisco switch? (Choose two.)","imgs":[],"exp":"Important actions that a switch performs are as follows:\n\nWhen a frame comes in, the switch examines the Layer 2 source address to build and maintain the Layer 2 MAC address table.\nIt examines the Layer 2 destination address to determine how to forward the frame. When the destination address is in the MAC address table, then the frame is sent out a particular port. When the address is unknown, the frame is sent to all ports that have devices connected to that network.","topic":"7.3.2","opts":[{"t":"building a routing table that is based on the first IP address in the frame header","imgs":[]},{"t":"using the source MAC addresses of frames to build and maintain a MAC address table","imgs":[]},{"t":"forwarding frames with unknown destination IP addresses to the default gateway","imgs":[]},{"t":"utilizing the MAC address table to forward frames via the destination MAC address","imgs":[]},{"t":"examining the destination MAC address to add new entries to the MAC address table","imgs":[]}],"ans":[1,3],"type":"multiple","sources":["Module 4-7"],"module":7,"id":117},{"q":"Which two statements describe features or functions of the logical link control sublayer in Ethernet standards? (Choose two.)","imgs":[],"exp":"Logical link control is implemented in software and enables the data link layer to communicate with the upper layers of the protocol suite. Logical link control is specified in the IEEE 802.2 standard. IEEE 802.3 is a suite of standards that define the different Ethernet types. The MAC (Media Access Control) sublayer is responsible for the placement and retrieval of frames on and off the media. The MAC sublayer is also responsible for adding a header and a trailer to the network layer protocol data unit (PDU).","topic":"7.1.2","opts":[{"t":"Logical link control is implemented in software.","imgs":[]},{"t":"Logical link control is specified in the IEEE 802.3 standard.","imgs":[]},{"t":"The LLC sublayer adds a header and a trailer to the data.","imgs":[]},{"t":"The data link layer uses LLC to communicate with the upper layers of the protocol suite.","imgs":[]},{"t":"The LLC sublayer is responsible for the placement and retrieval of frames on and off the media.","imgs":[]}],"ans":[0,3],"type":"multiple","sources":["Module 4-7"],"module":7,"id":118},{"q":"What is the auto-MDIX feature?","imgs":[],"exp":"The auto-MDIX feature allows the device to configure its network port according to the cable type that is used (straight-through or crossover) and the type of device that is connected to that port. When a port of a switch is configured with auto-MDIX, this switch can be connected to another switch by the use of either a straight-through cable or a crossover cable.","topic":"7.4.5","opts":[{"t":"It enables a device to automatically configure an interface to use a straight-through or a crossover cable.","imgs":[]},{"t":"It enables a device to automatically configure the duplex settings of a segment.","imgs":[]},{"t":"It enables a device to automatically configure the speed of its interface.","imgs":[]},{"t":"It enables a switch to dynamically select the forwarding method.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":119},{"q":"What is one advantage of using the cut-through switching method instead of the store-and-forward switching method?","imgs":[],"exp":"Cut-through switching provides lower latency switching for high-performance computing (HPC) applications. Cut-through switching allows more invalid frames to cross the network than store-and-forward switching. The cut-through switching method can make a forwarding decision as soon as it looks up the destination MAC address of the frame.","topic":"7.4.2","opts":[{"t":"has a positive impact on bandwidth by dropping most of the invalid frames","imgs":[]},{"t":"makes a fast forwarding decision based on the source MAC address of the frame","imgs":[]},{"t":"has a lower latency appropriate for high-performance computing applications","imgs":[]},{"t":"provides the flexibility to support any mix of Ethernet speeds","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":7,"id":120},{"q":"Which is a multicast MAC address?","imgs":[],"exp":"Multicast MAC addresses begin with the special value of 01-00-5E.","topic":"7.2.6","opts":[{"t":"FF-FF-FF-FF-FF-FF","imgs":[]},{"t":"5C-26-0A-4B-19-3E","imgs":[]},{"t":"01-00-5E-00-00-03","imgs":[]},{"t":"00-26-0F-4B-00-3E","imgs":[]}],"ans":[2],"type":"single","sources":["Module 4-7"],"module":7,"id":121},{"q":"Refer to the exhibit. The PC is connected to the console port of the switch. All the other connections are made through FastEthernet links. Which types of UTP cables can be used to connect the devices?","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/i274301v1n1_206934.png"],"exp":"A straight-through cable is commonly used to interconnect a host to a switch and a switch to a router. A crossover cable is used to interconnect similar devices together like switch to a switch, a host to a host, or a router to a router. If a switch has the MDIX capability, a crossover could be used to connect the switch to the router; however, that option is not available. A rollover cable is used to connect to a router or switch console port.","topic":"4.4.3","type":"single","opts":[{"t":"1 - rollover, 2 - crossover, 3 - straight-through","imgs":[]},{"t":"1 - rollover, 2 - straight-through, 3 - crossover","imgs":[]},{"t":"1 - crossover, 2 - rollover, 3 - straight-through","imgs":[]},{"t":"1 - crossover, 2 - straight-through, 3 - rollover","imgs":[]}],"ans":[1],"sources":["Module 4-7"],"module":4,"id":122},{"q":"Open the PT Activity. Perform the tasks in the activity instructions and then answer the question.\n\nModules 4 - 7: Ethernet Concepts Exam - Packet Tracer\n\nWhich port does Switch0 use to send frames to the host with the IPv4 address 10.1.1.5?","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2020-03-08_212125-1.jpg"],"exp":"Issuing the command ipconfig /all from the PC0 command prompt displays the IPv4 address and MAC address. When the IPv4 address 10.1.1.5 is pinged from PC0, the switch stores the source MAC address (from PC0) along with the port to which PC0 is connected. When the destination reply is received, the switch takes the destination MAC address and compares to MAC addresses stored in the MAC address table. Issuing the show mac-address-table on the PC0 Terminal application displays two dynamic MAC address entries. The MAC address and port entry that does not belong to PC0 must be the MAC address and port of the destination with the IPv4 address 10.1.1.5.","topic":"7.3.2","opts":[{"t":"Fa0/1","imgs":[]},{"t":"Fa0/5","imgs":[]},{"t":"Fa0/9","imgs":[]},{"t":"Fa0/11","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":7,"id":123},{"q":"What makes fiber preferable to copper cabling for interconnecting buildings? (Choose three.)","imgs":[],"exp":"Optical fiber cable transmits data over longer distances and at higher bandwidths than any other networking media. Unlike copper wires, fiber-optic cable can transmit signals with less attenuation and is completely immune to EMI and RFI.","topic":"4.5.1","opts":[{"t":"greater distances per cable run","imgs":[]},{"t":"lower installation cost","imgs":[]},{"t":"limited susceptibility to EMI/RFI","imgs":[]},{"t":"durable connections","imgs":[]},{"t":"greater bandwidth potential","imgs":[]},{"t":"easily terminated","imgs":[]}],"ans":[0,2,4],"type":"multiple","sources":["Module 4-7"],"module":4,"id":124},{"q":"What OSI physical layer term describes the process by which one wave modifies another wave?","imgs":[],"exp":"Modulation is the physical layer process where a data signal modifies one or more characteristics (amplitude, frequency, or phase) of another higher-frequency wave (the carrier wave). This technique allows digital binary data to be successfully transmitted over analog mediums, such as wireless airwaves.","topic":"4.2.4","opts":[{"t":"modulation","imgs":[]},{"t":"IEEE","imgs":[]},{"t":"EIA/TIA","imgs":[]},{"t":"air","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":125},{"q":"What OSI physical layer term describes the capacity at which a medium can carry data?","imgs":[],"exp":"Bandwidth is the physical layer term that describes the maximum theoretical capacity of a medium (such as copper or fiber-optic cabling) to carry data over a given period of time. It is typically measured in bits per second (bps), Mbps, or Gbps. It should not be confused with throughput, which represents the actual, real-world measure of data successfully traversing the media under practical conditions (often lower due to latency and network overhead).","topic":"4.2.5","opts":[{"t":"bandwidth","imgs":[]},{"t":"IEEE","imgs":[]},{"t":"EIA/TIA","imgs":[]},{"t":"air","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":126},{"q":"What OSI physical layer term describes the amount of time, including delays, for data to travel from one point to another?","imgs":[],"exp":"Latency is the physical layer term that describes the total amount of time, including various delays, required for data to travel from one specific point to another across a network. This time measurement encompasses the actual propagation delay (the time bits take to physically traverse the copper, fiber, or wireless media) as well as intermediary processing delays, queuing delays within routing or switching devices, and serialization delays. High latency directly impacts network performance, particularly for real-time traffic such as VoIP or online streaming.","topic":"4.2.6","opts":[{"t":"latency","imgs":[]},{"t":"bandwidth","imgs":[]},{"t":"throughput","imgs":[]},{"t":"goodput","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":127},{"q":"What OSI physical layer term describes the amount of time, including delays, for data to travel from one point to another?","imgs":[],"exp":"Latency is the physical layer term that describes the total amount of time, including various delays, required for data to travel from one specific point to another across a network. This time measurement encompasses the actual propagation delay (the time bits take to physically traverse the copper, fiber, or wireless media) as well as intermediary processing delays, queuing delays within routing or switching devices, and serialization delays. High latency directly impacts network performance, particularly for real-time traffic such as VoIP or online streaming.","topic":"4.2.6","opts":[{"t":"latency","imgs":[]},{"t":"fiber-optic cable","imgs":[]},{"t":"air","imgs":[]},{"t":"copper cable","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":128},{"q":"What OSI physical layer term describes the measure of usable data transferred over a given period of time?","imgs":[],"exp":"Goodput is the physical layer term that measures the actual amount of usable application data transferred over the network during a specific period of time. Unlike throughput, which accounts for all bits traveling across the media (including protocol overhead, headers, control packets, and retransmitted data due to errors), goodput filters out this technical overhead. It represents only the useful payload delivered to the end-user application. Consequently, goodput is always lower than throughput, which in turn is lower than bandwidth.","topic":"4.2.6","opts":[{"t":"goodput","imgs":[]},{"t":"fiber-optic cable","imgs":[]},{"t":"air","imgs":[]},{"t":"copper cable","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":129},{"q":"What OSI physical layer term describes the physical medium which uses electrical pulses?","imgs":[],"exp":"Copper cable is the Layer 1 (Physical) medium that relies on electrical pulses to transmit binary data across a network. In local area networks, the most widely used types are Unshielded Twisted-Pair (UTP) and Shielded Twisted-Pair (STP). The transmitting network interface card (NIC) modifies voltage levels to represent bits, which are then decoded by the receiving device. Its primary limitations compared to fiber-optic cables are that electrical signals attenuate (lose strength) over shorter distances and are highly susceptible to electromagnetic interference (EMI) and crosstalk.","topic":"4.3.1","opts":[{"t":"copper cable","imgs":[]},{"t":"fiber-optic cable","imgs":[]},{"t":"air","imgs":[]},{"t":"goodput","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":130},{"q":"What OSI physical layer term describes the physical medium that uses the propagation of light?","imgs":[],"exp":"The fiber-optic cable is the Layer 1 (Physical) medium that relies on the propagation of light (using modulated light pulses) to transmit binary data. Constructed from thin, flexible strands of high-quality glass or plastic, this medium is capable of carrying network data over immense distances at ultra-high bandwidth capacities. Additionally, because it uses light instead of electrical currents, it is completely immune to electromagnetic interference (EMI) and radio frequency interference (RFI).","topic":"4.2.4","opts":[{"t":"fiber-optic cable","imgs":[]},{"t":"goodput","imgs":[]},{"t":"latency","imgs":[]},{"t":"throughput","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":131},{"q":"What OSI physical layer term describes the physical medium for microwave transmissions?","imgs":[],"exp":"Air is the physical medium used by the OSI physical layer (Layer 1) to carry radio frequency and microwave signals in wireless communications. Unlike guided media such as copper cabling (which relies on electrical pulses) or fiber-optic cabling (which relies on light pulses), wireless technologies transmit electromagnetic signals directly through unguided space. In this context, the air serves as the actual transmission channel through which modulated waves travel between antennas.","topic":"4.2.4","opts":[{"t":"air","imgs":[]},{"t":"goodput","imgs":[]},{"t":"latency","imgs":[]},{"t":"throughput","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":4,"id":132},{"q":"Which two functions are performed at the MAC sublayer of the OSI data link layer? (Choose two.)","imgs":[],"exp":"The MAC sublayer (Media Access Control) constitutes the lower portion of the OSI Data Link Layer (Layer 2) and interfaces directly with the hardware and physical layer signaling.\nIts key assignments include:\n\nSynchronization: It embeds preamble and delimiter flags into the frame, which provides synchronization between source and destination nodes so they can detect precisely where a transmission begins and ends.\nError Detection: It computes the Cyclic Redundancy Check (CRC) value and implements a trailer (FCS field) at the end of the frame, allowing the receiving NIC to check for data corruption.\nMedia Access: It dictates the physical rules for placing data frames onto the transmission medium depending on the topology (e.g., CSMA/CD).\n\nThe alternative choices (identifying network protocols or enabling IPv4 and IPv6 to share the same physical interface) are software functions belonging entirely to the upper LLC sublayer.","topic":"6.1.2","opts":[{"t":"Adds Layer 2 control information to network protocol data.","imgs":[]},{"t":"Places information in the frame that identifies which network layer protocol is being used for the frame.","imgs":[]},{"t":"Controls the NIC responsible for sending and receiving data on the physical medium.","imgs":[]},{"t":"Implements a trailer to detect transmission errors.","imgs":[]},{"t":"Enables IPv4 and IPv6 to utilize the same network interface and media.","imgs":[]}],"ans":[2,3],"type":"multiple","sources":["Module 4-7"],"module":6,"id":133},{"q":"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Choose two.)","imgs":[],"exp":"The OSI data link layer is divided into two distinct sublayers: LLC (Logical Link Control) and MAC (Media Access Control). The LLC sublayer is defined by the IEEE 802.2 standard and is implemented entirely in software.\nThe primary functions performed at the LLC sublayer include:\n\nInterfacing with upper layers: It acts as an intermediary between network software (Layer 3 protocols) and the underlying hardware. By inserting control information into the frame that identifies which network layer protocol is being used, it enables multiple protocols, such as IPv4 and IPv6, to utilize the same network interface and media.\nInitial control encapsulation: It is responsible for adding Layer 2 control information to the network protocol data units (PDUs) before handing them down to the MAC sublayer.\n\nThe other choices describe functions belonging to the MAC sublayer or the Physical layer (such as integrating physical technologies, node synchronization, or implementing the FCS trailer with a CRC value for transmission error detection).","topic":"6.1.2","opts":[{"t":"Enables IPv4 and IPv6 to utilize the same network interface and media.","imgs":[]},{"t":"Places information in the frame that identifies which network layer protocol is being used for the frame.","imgs":[]},{"t":"Integrates various physical technologies.","imgs":[]},{"t":"Implements a process to delimit fields within a Layer 2 frame.","imgs":[]},{"t":"Controls the NIC responsible for sending and receiving data on the physical medium.","imgs":[]}],"ans":[0,1],"type":"multiple","sources":["Module 4-7"],"module":6,"id":134},{"q":"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Choose two.)","imgs":[],"exp":"The OSI data link layer is divided into two distinct sublayers: LLC (Logical Link Control) and MAC (Media Access Control). The LLC sublayer is defined by the IEEE 802.2 standard and is implemented entirely in software.\nThe primary functions performed at the LLC sublayer include:\n\nInterfacing with upper layers: It acts as an intermediary between network software (Layer 3 protocols) and the underlying hardware. By inserting control information into the frame that identifies which network layer protocol is being used, it enables multiple protocols, such as IPv4 and IPv6, to utilize the same network interface and media.\nInitial control encapsulation: It is responsible for adding Layer 2 control information to the network protocol data units (PDUs) before handing them down to the MAC sublayer.\n\nThe other choices describe functions belonging to the MAC sublayer or the Physical layer (such as integrating physical technologies, node synchronization, or implementing the FCS trailer with a CRC value for transmission error detection).","topic":"6.1.2","opts":[{"t":"Adds Layer 2 control information to network protocol data.","imgs":[]},{"t":"Places information in the frame that identifies which network layer protocol is being used for the frame.","imgs":[]},{"t":"Performs data encapsulation.","imgs":[]},{"t":"Controls the NIC responsible for sending and receiving data on the physical medium.","imgs":[]},{"t":"Integrates various physical technologies.","imgs":[]}],"ans":[0,1],"type":"multiple","sources":["Module 4-7"],"module":6,"id":135},{"q":"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Choose two.)","imgs":[],"exp":"The OSI data link layer is divided into two distinct sublayers: LLC (Logical Link Control) and MAC (Media Access Control). The LLC sublayer is defined by the IEEE 802.2 standard and is implemented entirely in software.\nThe primary functions performed at the LLC sublayer include:\n\nInterfacing with upper layers: It acts as an intermediary between network software (Layer 3 protocols) and the underlying hardware. By inserting control information into the frame that identifies which network layer protocol is being used, it enables multiple protocols, such as IPv4 and IPv6, to utilize the same network interface and media.\nInitial control encapsulation: It is responsible for adding Layer 2 control information to the network protocol data units (PDUs) before handing them down to the MAC sublayer.\n\nThe other choices describe functions belonging to the MAC sublayer or the Physical layer (such as integrating physical technologies, node synchronization, or implementing the FCS trailer with a CRC value for transmission error detection).","topic":"6.1.2","opts":[{"t":"Adds Layer 2 control information to network protocol data.","imgs":[]},{"t":"Enables IPv4 and IPv6 to utilize the same network interface and media.","imgs":[]},{"t":"Provides data link layer addressing.","imgs":[]},{"t":"Implements a trailer to detect transmission errors.","imgs":[]},{"t":"Provides synchronization between source and target nodes.","imgs":[]}],"ans":[0,1],"type":"multiple","sources":["Module 4-7"],"module":6,"id":136},{"q":"Which two functions are performed at the LLC sublayer of the OSI data link layer? (Choose two.)","imgs":[],"exp":"The OSI data link layer is divided into two distinct sublayers: LLC (Logical Link Control) and MAC (Media Access Control). The LLC sublayer is defined by the IEEE 802.2 standard and is implemented entirely in software.\nThe primary functions performed at the LLC sublayer include:\n\nInterfacing with upper layers: It acts as an intermediary between network software (Layer 3 protocols) and the underlying hardware. By inserting control information into the frame that identifies which network layer protocol is being used, it enables multiple protocols, such as IPv4 and IPv6, to utilize the same network interface and media.\nInitial control encapsulation: It is responsible for adding Layer 2 control information to the network protocol data units (PDUs) before handing them down to the MAC sublayer.\n\nThe other choices describe functions belonging to the MAC sublayer or the Physical layer (such as integrating physical technologies, node synchronization, or implementing the FCS trailer with a CRC value for transmission error detection).","topic":"6.1.2","opts":[{"t":"Enables IPv4 and IPv6 to utilize the same network interface and media.","imgs":[]},{"t":"Adds Layer 2 control information to network protocol data.","imgs":[]},{"t":"Integrates various physical technologies.","imgs":[]},{"t":"Implements a trailer to detect transmission errors.","imgs":[]},{"t":"Provides synchronization between source and target nodes.","imgs":[]}],"ans":[0,1],"type":"multiple","sources":["Module 4-7"],"module":6,"id":137},{"q":"What action will occur if a switch receives a frame with the destination MAC address FF:FF:FF:FF:FF:FF?","imgs":[],"exp":"The MAC address FF:FF:FF:FF:FF:FF is a Layer 2 broadcast address. When an Ethernet switch receives a broadcast frame, it does not look up a specific destination port in its CAM/MAC address table. Instead, the switch is designed to flood the frame out of all active ports within the same broadcast domain (VLAN), excluding the original port where the frame was received (the ingress port). This behavior ensures that the broadcast message successfully reaches every end device connected to the local network.","topic":"7.2.5","opts":[{"t":"The switch forwards it out all ports except the ingress port.","imgs":[]},{"t":"The switch refreshes the timer on that entry.","imgs":[]},{"t":"The switch does not forward the frame.","imgs":[]},{"t":"The switch sends the frame to a connected router because the destination MAC address is not local.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":138},{"q":"What action will occur if a switch receives a frame with the destination MAC address 01:00:5E:00:00:D9?","imgs":[],"exp":"","topic":"7.2.6","opts":[{"t":"The switch forwards it out all ports except the ingress port.","imgs":[]},{"t":"The switch does not forward the frame.","imgs":[]},{"t":"The switch sends the frame to a connected router because the destination MAC address is not local.","imgs":[]},{"t":"The switch shares the MAC address table entry with any connected switches.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":139},{"q":"What action will occur if a host receives a frame with a destination MAC address of FF:FF:FF:FF:FF:FF?","imgs":[],"exp":"The MAC address FF:FF:FF:FF:FF:FF represents a Layer 2 broadcast address.\nWhen a host's network interface card (NIC) receives a frame containing this specific destination address, it instantly recognizes that the message is intended for every single device within the local network segment. As a result, instead of dropping it, the NIC accepts the data and hands it up the protocol stack so that the host will process the frame. End hosts do not forward broadcast frames to other devices or routers; that flooding action is strictly a switch behavior.","topic":"7.2.5","opts":[{"t":"The host will process the frame.","imgs":[]},{"t":"The host forwards the frame to the router.","imgs":[]},{"t":"The host sends the frame to the switch to update the MAC address table.","imgs":[]},{"t":"The host forwards the frame to all other hosts.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":140},{"q":"What action will occur if a switch receives a frame and does have the source MAC address in the MAC table?","imgs":[],"exp":"When an Ethernet switch receives a frame, it performs two main lookups: it examines the source MAC address (to learn and maintain its address mapping table) and the destination MAC address (to decide which output port to forward the frame to).\nTo build and maintain its MAC address table, the switch inspects the source address. If this specific source MAC address is already present in the table for the incoming port, the switch recognizes that the device is still active and connected to that interface. Instead of creating a duplicate entry, the switch simply refreshes the aging timer for that specific entry. This action resets the countdown clock, preventing the valid entry from expiring and being prematurely deleted from the switch's CAM memory.","topic":"7.3.2","opts":[{"t":"The switch refreshes the timer on that entry.","imgs":[]},{"t":"The switch adds it to its MAC address table associated with the port number.","imgs":[]},{"t":"The switch forwards the frame to the associated port.","imgs":[]},{"t":"The switch sends the frame to a connected router because the destination MAC address is not local.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":141},{"q":"What action will occur if a host receives a frame with a destination MAC address of FF:FF:FF:FF:FF:FF?","imgs":[],"exp":"The MAC address FF:FF:FF:FF:FF:FF represents a Layer 2 broadcast address.\nWhen a host's network interface card (NIC) receives a frame containing this specific destination address, it instantly recognizes that the message is intended for every single device within the local network segment. As a result, instead of dropping it, the NIC accepts the data and hands it up the protocol stack so that the host will process the frame. End hosts do not forward broadcast frames to other devices or routers; that flooding action is strictly a switch behavior.","topic":"7.2.5","opts":[{"t":"The host will process the frame.","imgs":[]},{"t":"The host returns the frame to the switch.","imgs":[]},{"t":"The host replies to the switch with its own IP address.","imgs":[]},{"t":"The host forwards the frame to all other hosts.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":142},{"q":"What action will occur if a host receives a frame with a destination MAC address it does not recognize?","imgs":[],"exp":"When a host's network interface card (NIC) receives an Ethernet frame, the very first action it takes is to examine the destination MAC address located within the Layer 2 header.\nThe host will only accept and pass the frame up the protocol stack for processing if the destination MAC address matches:\n\nIts own unique physical MAC address.\nA broadcast MAC address (FF-FF-FF-FF-FF-FF).\nA multicast MAC address that the host is actively subscribed to.\n\nIf the destination MAC address does not match any of these criteria (meaning it is a unicast address that it does not recognize as its own), the NIC determines that the data was not intended for this device and immediately drops the frame. End hosts do not forward unassigned frames or flood the network; that behavior is strictly handled by network switches.","topic":"7.2.3","opts":[{"t":"The host will discard the frame.","imgs":[]},{"t":"The host replies to the switch with its own IP address.","imgs":[]},{"t":"The host forwards the frame to all other hosts.","imgs":[]},{"t":"The host returns the frame to the switch.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 4-7"],"module":7,"id":143},{"q":"Which type of UTP cable is used to connect a PC to a switch port?","imgs":[],"exp":"A rollover cable is a Cisco proprietary cable used to connect to a router or switch console port. A straight-through (also called patch) cable is usually used to interconnect a host to a switch and a switch to a router. A crossover cable is used to interconnect similar devices together, for example, between two switches, two routers, and two hosts.","topic":"4.4.3","opts":[{"t":"console","imgs":[]},{"t":"rollover","imgs":[]},{"t":"crossover","imgs":[]},{"t":"straight-through","imgs":[]}],"ans":[3],"type":"single","sources":["Module 4-7"],"module":4,"id":144},{"type":"single","q":"What will happen if the default gateway address is incorrectly configured on a host?","imgs":[],"exp":"When a host needs to send a message to another host located on the same network, it can forward the message directly. However, when a host needs to send a message to a remote network, it must use the router, also known as the default gateway. This is because the data link frame address of the remote destination host cannot be used directly. Instead, the IP packet has to be sent to the router (default gateway) and the router will forward the packet toward its destination. Therefore, if the default gateway is incorrectly configured, the host can communicate with other hosts on the same network, but not with hosts on remote networks.","topic":"10.3.1","opts":[{"t":"The host cannot communicate with other hosts in the local network.","imgs":[]},{"t":"The host cannot communicate with hosts in other networks.","imgs":[]},{"t":"A ping from the host to 127.0.0.1 would not be successful.","imgs":[]},{"t":"The host will have to use ARP to determine the correct address of the default gateway.","imgs":[]},{"t":"The switch will not forward packets initiated by the host.","imgs":[]}],"ans":[1],"sources":["Module 8-10","Final Exam (161)"],"module":10,"id":145},{"type":"single","q":"The global configuration command ip default-gateway 172.16.100.1 is applied to a switch. What is the effect of this command?","imgs":[],"exp":"A default gateway address is typically configured on all devices to allow them to communicate beyond just their local network.In a switch this is achieved using the command ip default-gateway <ip address>.","topic":"10.3.2","opts":[{"t":"The switch can communicate with other hosts on the 172.16.100.0 network.","imgs":[]},{"t":"The switch can be remotely managed from a host on another network.","imgs":[]},{"t":"The switch is limited to sending and receiving frames to and from the gateway 172.16.100.1.","imgs":[]},{"t":"The switch will have a management interface with the address 172.16.100.1.","imgs":[]}],"ans":[1],"sources":["Module 8-10","Final Exam (161)"],"module":10,"id":146},{"type":"single","q":"What happens when the transport input ssh command is entered on the switch vty lines?","imgs":[],"exp":"The transport input ssh command when entered on the switch vty (virtual terminal lines) will encrypt all inbound controlled telnet connections.","topic":"10.1.1","opts":[{"t":"The SSH client on the switch is enabled.","imgs":[]},{"t":"The switch requires a username/password combination for remote access.","imgs":[]},{"t":"Communication between the switch and remote users is encrypted.","imgs":[]},{"t":"The switch requires remote connections via a proprietary client software.","imgs":[]}],"ans":[2],"sources":["Module 8-10","Final Exam (161)"],"module":10,"id":147},{"type":"single","q":"A new network administrator has been asked to enter a banner message on a Cisco device. What is the fastest way a network administrator could test whether the banner is properly configured?","imgs":[],"exp":"While at the privileged mode prompt such as Router#, type exit,press Enter, and the banner message appears. Power cycling a network device that has had the banner motd command issued will also display the banner message, but this is not a quick way to test the configuration.","topic":"10.1.1","opts":[{"t":"Enter CTRL-Z at the privileged mode prompt.","imgs":[]},{"t":"Exit global configuration mode.","imgs":[]},{"t":"Power cycle the device.","imgs":[]},{"t":"Reboot the device.","imgs":[]},{"t":"Exit privileged EXEC mode and press Enter.","imgs":[]}],"ans":[4],"sources":["Module 8-10","Final Exam (161)"],"module":10,"id":148},{"type":"single","q":"A router boots and enters setup mode. What is the reason for this?","imgs":[],"exp":"If a router cannot locate the startup-config file in NVRAM, it will enter setup mode to allow the configuration to be entered from the console device.","topic":"10.1.1","opts":[{"t":"The IOS image is corrupt.","imgs":[]},{"t":"Cisco IOS is missing from flash memory.","imgs":[]},{"t":"The configuration file is missing from NVRAM.","imgs":[]},{"t":"The POST process has detected hardware failure.","imgs":[]}],"ans":[2],"sources":["Module 8-10","Practice Final (58)"],"module":10,"id":149},{"type":"single","q":"Why is NAT not needed in IPv6?","imgs":[],"exp":"The large number of public IPv6 addresses eliminates the need for NAT. Sites from the largest enterprises to single households can get public IPv6 network addresses. This avoids some of the NAT-induced application problems that are experienced by applications that require end-to-end connectivity.","topic":"8.3.2","opts":[{"t":"Because IPv6 has integrated security, there is no need to hide the IPv6 addresses of internal networks.","imgs":[]},{"t":"The problems that are induced by NAT applications are solved because the IPv6 header improves packet handling by intermediate routers.","imgs":[]},{"t":"The end-to-end connectivity problems that are caused by NAT are solved because the number of routes increases with the number of nodes that are connected to the Internet.","imgs":[]},{"t":"Any host or user can get a public IPv6 network address because the number of available IPv6 addresses is extremely large.","imgs":[]}],"ans":[3],"sources":["Module 8-10","Practice Final (58)"],"module":8,"id":150},{"type":"single","q":"What routing table entry has a next hop address associated with a destination network?","imgs":[],"exp":"Routing table entries for remote routes will have a next hop IP address. The next hop IP address is the address of the router interface of the next device to be used to reach the destination network. Directly-connected and local routes have no next hop, because they do not require going through another router to be reached.","topic":"8.5.4","opts":[{"t":"directly-connected routes","imgs":[]},{"t":"local routes","imgs":[]},{"t":"remote routes","imgs":[]},{"t":"C and L source routes","imgs":[]}],"ans":[2],"sources":["Module 8-10","Practice Final (58)"],"module":8,"id":151},{"type":"single","q":"Which term describes a field in the IPv4 packet header that contains a unicast, multicast, or broadcast address?","imgs":[],"exp":"The destination IPv4 address is a 32-bit field in the IP header that specifies the logical address of the end device to which the packet is being sent. This field can hold a unicast address (for a specific single host), a multicast address (for a specific group of hosts), or a broadcast address (for all hosts on the local network segment). Routers inspect this address to perform route lookups in their routing tables, ensuring the packet is forwarded out of the appropriate interface toward the intended destination.","topic":"8.2.2","opts":[{"t":"destination IPv4 address","imgs":[]},{"t":"protocol","imgs":[]},{"t":"TTL","imgs":[]},{"t":"header checksum","imgs":[]}],"ans":[0],"sources":["Module 8-10","Practice Final (58)"],"module":8,"id":152},{"type":"single","q":"Refer to the exhibit. The exhibit shows a small switched network and the contents of the MAC address table of the switch. PC1 has sent a frame addressed to PC3. What will the switch do with the frame?","imgs":["https://itexamanswers.net/wp-content/uploads/2020/05/45_i275394v1n1_207267.png"],"exp":"The MAC address of PC3 is not present in the MAC table of the switch. Because the switch does not know where to send the frame that is addressed to PC3, it will forward the frame to all the switch ports, except for port 4, which is the incoming port.","topic":"9.2.8","opts":[{"t":"The switch will discard the frame.","imgs":[]},{"t":"The switch will forward the frame to all ports.","imgs":[]},{"t":"The switch will forward the frame only to port 2.","imgs":[]},{"t":"The switch will forward the frame only to ports 1 and 3.","imgs":[]},{"t":"The switch will forward the frame to all ports except port 4.","imgs":[]}],"ans":[4],"sources":["Module 8-10","Practice Final (58)"],"module":9,"id":153},{"type":"single","q":"Which destination address is used in an ARP request frame?","imgs":[],"exp":"The purpose of an ARP request is to find the MAC address of the destination host on an Ethernet LAN. The ARP process sends a Layer 2 broadcast to all devices on the Ethernet LAN. The frame contains the IP address of the destination and the broadcast MAC address, FFFF.FFFF.FFFF. The host with the IP address that matches the IP address in the ARP request will reply with a unicast frame that includes the MAC address of the host. Thus the original sending host will obtain the destination IP and MAC address pair to continue the encapsulation process for data transmission.","topic":"9.2.3","opts":[{"t":"0.0.0.0","imgs":[]},{"t":"255.255.255.255","imgs":[]},{"t":"the physical address of the destination host","imgs":[]},{"t":"FFFF.FFFF.FFFF","imgs":[]},{"t":"AAAA.AAAA.AAAA","imgs":[]}],"ans":[3],"sources":["Module 8-10","Practice Final (58)"],"module":9,"id":154},{"q":"Which information is used by routers to forward a data packet toward its destination?","imgs":[],"exp":"","topic":"8.5.1","opts":[{"t":"source IP address","imgs":[]},{"t":"destination IP address","imgs":[]},{"t":"source data-link address","imgs":[]},{"t":"destination data-link address","imgs":[]}],"ans":[1],"type":"single","sources":["Module 8-10"],"module":8,"id":155},{"q":"A computer has to send a packet to a destination host in the same LAN. How will the packet be sent?","imgs":[],"exp":"","topic":"8.4.1","opts":[{"t":"The packet will be sent to the default gateway first, and then, depending on the response from the gateway, it may be sent to the destination host.","imgs":[]},{"t":"The packet will be sent directly to the destination host.","imgs":[]},{"t":"The packet will first be sent to the default gateway, and then from the default gateway it will be sent directly to the destination host.","imgs":[]},{"t":"The packet will be sent only to the default gateway.","imgs":[]}],"ans":[1],"type":"single","sources":["Module 8-10"],"module":8,"id":156},{"q":"A router receives a packet from the Gigabit 0/0 interface and determines that the packet needs to be forwarded out the Gigabit 0/1 interface. What will the router do next?","imgs":[],"exp":"","topic":"8.5.1","opts":[{"t":"route the packet out the Gigabit 0/1 interface","imgs":[]},{"t":"create a new Layer 2 Ethernet frame to be sent to the destination","imgs":[]},{"t":"look into the ARP cache to determine the destination IP address","imgs":[]},{"t":"look into the routing table to determine if the destination network is in the routing table","imgs":[]}],"ans":[1],"type":"single","sources":["Module 8-10"],"module":8,"id":157},{"q":"Which IPv4 address can a host use to ping the loopback interface?","imgs":[],"exp":"","topic":"8.4.1","opts":[{"t":"126.0.0.1","imgs":[]},{"t":"127.0.0.0","imgs":[]},{"t":"126.0.0.0","imgs":[]},{"t":"127.0.0.1","imgs":[]}],"ans":[3],"type":"single","sources":["Module 8-10"],"module":8,"id":158},{"q":"A computer can access devices on the same network but cannot access devices on other networks. What is the probable cause of this problem?","imgs":[],"exp":"","topic":"8.4.2","opts":[{"t":"The cable is not connected properly to the NIC.","imgs":[]},{"t":"The computer has an invalid IP address.","imgs":[]},{"t":"The computer has an incorrect subnet mask.","imgs":[]},{"t":"The computer has an invalid default gateway address.","imgs":[]}],"ans":[3],"type":"single","sources":["Module 8-10"],"module":8,"id":159},{"q":"Which statement describes a feature of the IP protocol?","imgs":[],"exp":"IP protocol is a connection-less protocol, considered unreliable in terms of end-to-end delivery. It does not provide error control in the cases where receiving packets are out-of-order or in cases of missing packets. It relies on upper layer services, such as TCP, to resolve these issues.","topic":"8.1.5","opts":[{"t":"IP encapsulation is modified based on network media.","imgs":[]},{"t":"IP relies on Layer 2 protocols for transmission error control.","imgs":[]},{"t":"MAC addresses are used during the IP packet encapsulation.","imgs":[]},{"t":"IP relies on upper layer services to handle situations of missing or out-of-order packets.","imgs":[]}],"ans":[3],"type":"single","sources":["Module 8-10"],"module":8,"id":160},{"q":"Which parameter does the router use to choose the path to the destination when there are multiple routes available?","imgs":[],"exp":"","topic":"8.5.1","opts":[{"t":"the lower metric value that is associated with the destination network","imgs":[]},{"t":"the lower gateway IP address to get to the destination network","imgs":[]},{"t":"the higher metric value that is associated with the destination network","imgs":[]},{"t":"the higher gateway IP address to get to the destination network","imgs":[]}],"ans":[0],"type":"single","sources":["Module 8-10"],"module":8,"id":161},{"q":"What are two services provided by the OSI network layer? (Choose two.)","imgs":[],"exp":"The OSI network layer provides several services to allow communication between devices:\n\naddressing\nencapsulation\nrouting\nde-encapsulation\n\nError detection, placing frames on the media, and collision detection are all functions of the data ink layer.","topic":"8.1.1","opts":[{"t":"performing error detection","imgs":[]},{"t":"routing packets toward the destination","imgs":[]},{"t":"encapsulating PDUs from the transport layer","imgs":[]},{"t":"placement of frames on the media","imgs":[]},{"t":"collision detection","imgs":[]}],"ans":[1,2],"type":"multiple","sources":["Module 8-10"],"module":8,"id":162},{"q":"Within a production network, what is the purpose of configuring a switch with a default gateway address?","imgs":[],"exp":"A default gateway address allows a switch to forward packets that originate on the switch to remote networks. A default gateway address on a switch does not provide Layer 3 routing for PCs that are connected on that switch. A switch can still be accessible from Telnet as long as the source of the Telnet connection is on the local network.","topic":"8.4.2","opts":[{"t":"Hosts that are connected to the switch can use the switch default gateway address to forward packets to a remote destination.","imgs":[]},{"t":"A switch must have a default gateway to be accessible by Telnet and SSH.","imgs":[]},{"t":"The default gateway address is used to forward packets originating from the switch to remote networks.","imgs":[]},{"t":"It provides a next-hop address for all traffic that flows through the switch.","imgs":[]}],"ans":[2],"type":"single","sources":["Module 8-10"],"module":8,"id":163},{"q":"What is a basic characteristic of the IP protocol?","imgs":[],"exp":"Internet Protocol (IP) is a network layer protocol that does not require initial exchange of control information to establish an end-to-end connection before packets are forwarded. Thus, IP is connectionless and does not provide reliable end-to-end delivery by itself. IP is media independent. User data segmentation is a service provided at the transport layer.","topic":"8.1.3","opts":[{"t":"connectionless","imgs":[]},{"t":"media dependent","imgs":[]},{"t":"user data segmentation","imgs":[]},{"t":"reliable end-to-end delivery","imgs":[]}],"ans":[0],"type":"single","sources":["Module 8-10"],"module":8,"id":164},{"q":"Which field in the IPv4 header is used to prevent a packet from traversing a network endlessly?","imgs":[],"exp":"The value of the Time-to-Live (TTL) field in the IPv4 header is used to limit the lifetime of a packet. The sending host sets the initial TTL value; which is decreased by one each time the packet is processed by a router. If the TTL field decrements to zero, the router discards the packet and sends an Internet Control Message Protocol (ICMP) Time Exceeded message to the source IP address. The Differentiated Services (DS) field is used to determine the priority of each packet. Sequence Number and Acknowledgment Number are two fields in the TCP header.","topic":"8.2.2","opts":[{"t":"Time-to-Live","imgs":[]},{"t":"Sequence Number","imgs":[]},{"t":"Acknowledgment Number","imgs":[]},{"t":"Differentiated Services","imgs":[]}],"ans":[0],"type":"single","sources":["Module 8-10"],"module":8,"id":165},{"q":"What is one advantage that the IPv6 simplified header offers over IPv4?","imgs":[],"exp":"The IPv6 simplified header offers several advantages over IPv4:\n\nBetter routing efficiency and efficient packet handling for performance and forwarding-rate scalability\nNo requirement for processing checksums\nSimplified and more efficient extension header mechanisms (as opposed to the IPv4 Options field)\nA Flow Label field for per-flow processing with no need to open the transport inner packet to identify the various traffic flows","topic":"8.3.3","opts":[{"t":"smaller-sized header","imgs":[]},{"t":"little requirement for processing checksums","imgs":[]},{"t":"smaller-sized source and destination IP addresses","imgs":[]},{"t":"efficient packet handling","imgs":[]}],"ans":[3],"type":"single","sources":["Module 8-10"],"module":8,"id":166},{"q":"What IPv4 header field identifies the upper layer protocol carried in the packet?","imgs":[],"exp":"It is the Protocol field in the IP header that identifies the upper-layer protocol the packet is carrying. The Version field identifies the IP version. The Differential Services field is used for setting packet priority. The Identification field is used to reorder fragmented packets.","topic":"8.2.2","opts":[{"t":"Protocol","imgs":[]},{"t":"Identification","imgs":[]},{"t":"Version","imgs":[]},{"t":"Differentiated Services","imgs":[]}],"ans":[0],"type":"single","sources":["Module 8-10"],"module":8,"id":167},{"q":"Refer to the exhibit. Match the packets with their destination IP address to the exiting interfaces on the router. (Not all targets are used.)","imgs":["https://itexamanswers.net/wp-content/uploads/2019/12/CCNA-v7-Modul-8-10_Qns-15-Exten-exhibit-1594760765.9811.png"],"exp":"Packets with a destination of 172.17.6.15 are forwarded through Fa0/0. Packets with a destination of 172.17.10.5 are forwarded through Fa1/1. Packets with a destination of 172.17.12.10 are forwarded through Fa1/0. Packets with a destination of 172.17.14.8 are forwarded through Fa0/1. Because network 172.17.8.0 has no entry in the routing table, it will take the gateway of last resort, which means that packets with a destination of 172.17.8.20 are forwarded through Serial0/0/0. Because a gateway of last resort exists, no packets will be dropped.","topic":"8.5.1","type":"matrix_sort_answer","rows":["packets with destination of 172.17.6.15","packets with destination of 172.17.14.8","packets with destination of 172.17.12.10","packets with destination of 172.17.10.5","packets with destination of 172.17.8.20"],"items":["FastEthernet0/0","FastEthernet0/1","FastEthernet1/0","FastEthernet1/1","Serial0/0/0"],"ans":[0,1,2,3,4],"aimgs":["https://itexamanswers.net/wp-content/uploads/2019/12/2024-09-17_144248.jpg"],"sources":["Module 8-10"],"module":8,"id":168},{"q":"What information does the loopback test provide?","imgs":[],"exp":"Because the loopback test sends packets back to the host device, it does not provide information about network connectivity to other hosts. The loopback test verifies that the host NIC, drivers, and TCP/IP stack are functioning.","topic":"8.4.1","opts":[{"t":"The TCP/IP stack on the device is working correctly.","imgs":[]},{"t":"The device has end-to-end connectivity.","imgs":[]},{"t":"DHCP is working correctly.","imgs":[]},{"t":"The Ethernet cable is working correctly.","imgs":[]},{"t":"The device has the correct IP address on the network.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 8-10"],"module":8,"id":169},{"q":"How do hosts ensure that their packets are directed to the correct network destination?","imgs":[],"exp":"Hosts must maintain their own local routing table to ensure that network layer packets are directed to the correct destination network. This local table typically contains a route to the loopback interface, a route to the network that the host is connected to, and a local default route, which represents the route that packets must take to reach all remote network addresses.","topic":"8.4.4","opts":[{"t":"They have to keep their own local routing table that contains a route to the loopback interface, a local network route, and a remote default route.","imgs":[]},{"t":"They always direct their packets to the default gateway, which will be responsible for the packet delivery.","imgs":[]},{"t":"They search in their own local routing table for a route to the network destination address and pass this information to the default gateway.","imgs":[]},{"t":"They send a query packet to the default gateway asking for the best route.","imgs":[]}],"ans":[0],"type":"single","sources":["Module 8-10"],"module":8,"id":170},{"q":"When transporting data from real-time applications, such as streaming audio and video, which field in the IPv6 header can be used to inform the routers and switches to maintain the same path for the packets in the same conversation?","imgs":[],"exp":"The Flow Label in IPv6 header is a 20-bit field that provides a special service for real-time applications. This field can be used to inform routers and switches to maintain the same path for the packet flow so that packets will not be reordered.","topic":"8.3.4","opts":[{"t":"Next Header","imgs":[]},{"t":"Flow Label","imgs":[]},{"t":"Traffic Class","imgs":[]},{"t":"Differentiated Services","imgs":[]}],"ans":[1],"type":"single","sources":["Module 8-10"],"module":8,"id":171},{"q":"What statement describes the function of the Address Resolution Protocol?","imgs":[],"exp":"When a PC wants to send data on the network, it always knows the IP address of the destination. However, it also needs to discover the MAC address of the destination. ARP is the protocol that is used to discover the MAC address of a host that belongs to the same network.","topic":"9.2.1","opts":[{"t":"ARP is used to discover the IP address of any host on a different network.","imgs":[]},{"t":"ARP is used to discover the IP address of any host on the local network.","imgs":[]},{"t":"ARP is used to discover the MAC address of any host on a different network.","imgs":[]},{"t":"ARP is used to discover the MAC address of any host on the local network.","imgs":[]}],"ans":[3],"type":"single","sources":["Module 8-10"],"module":9,"id":172},{"q":"Under which two circumstances will a switch flood a frame out of every port except the port that the frame was received on? (Choose two.)","imgs":[],"exp":"A switch will flood a frame out of every port, except the one that the frame was received from, under two circumstances. Either the frame has the broadcast address as the destination address, or the destination address is unknown to the switch.","topic":"9.2.3","opts":[{"t":"The frame has the broadcast address as the destination address.","imgs":[]},{"t":"The destination address is unknown to the switch.","imgs":[]},{"t":"The source address in the frame header is the broadcast address.","imgs":[]},{"t":"The source address in the frame is a multicast address.","imgs":[]},{"t":"The destination address in the frame is a known unicast address.","imgs":[]}],"ans":[0,1],"type":"multiple","sources":["Module 8-10"],"module":9,"id":173},{"q":"Which statement describes the treatment of ARP requests on the local link?","imgs":[],"exp":"One of the negative issues with ARP requests is that they are sent as a broadcast. This means all devices on the local link must rece
